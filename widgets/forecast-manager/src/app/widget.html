<!doctype html>
<html data-lm-modal-layout="forecast-manager" lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Forecast Manager</title>
  <link rel="stylesheet" href="forecast.css?v=1.12.1">
  <link rel="stylesheet" href="forecast-header.css?v=1.12.1">
  <link rel="stylesheet" href="forecast-enhancements.css?v=1.12.1">
  <link rel="stylesheet" href="forecast-contract-review.css?v=1.12.1">
  <link rel="stylesheet" href="number-transitions.css?v=1.12.1">
  <style>.segments{background:linear-gradient(180deg,#f7f9fc 0%,#e9eef6 100%)}.segments button:hover{transform:translateY(-1px)}</style>
  <script src="https://static.zohocdn.com/creator/widgets/version/2.0/widgetsdk-min.js"></script>
  <script src="runtime-context.js?v=1.12.1"></script>
  <script src="critical-error-reporter.js?v=1.12.1"></script>
  <script src="success-feedback.js?v=1.12.1"></script>
  <script src="forecast-model.js?v=1.12.1"></script>
  <script src="forecast-overview.js?v=1.12.1"></script>
  <link rel="stylesheet" href="interaction-motion.css?v=1.12.1">
<script src="interaction-motion.js?v=1.12.1"></script>
<script src="interaction-surfaces.js?v=1.12.1"></script>
<script src="number-edit-commit.js?v=1.12.1"></script>
  <script src="number-transitions.js?v=1.12.1"></script>
  <script src="forecast-summary.js?v=1.12.1"></script>
  <script src="forecast-builder-actions.js?v=1.12.1"></script>
  <script src="creator-data.js?v=1.12.1"></script>
  <script src="forecast-review-model.js?v=1.12.1"></script>
  <script src="forecast-contract-review.js?v=1.12.1"></script>
<link rel="stylesheet" href="modal-layout.css?v=1.12.1">
</head>
<body>
<main id="app">
  <header class="topbar">
    <div class="forecast-brand"><div class="brand"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10 12 3l9 7v10H3zM9 20v-7h6v7M3 10h18"/></svg><span>Land Master</span></div>
    <span class="brand-divider" aria-hidden="true"></span><span class="module-name">Forecast Manager</span></div>
    <nav class="forecast-pages" id="forecastPages" role="tablist" aria-label="Forecast Manager Pages" data-lm-motion="tabs">
      <button id="forecastsTab" role="tab" aria-selected="true" aria-controls="forecastsPanel" data-forecast-page="forecasts" disabled>Builder Forecasts</button>
      <button id="contractReviewTab" role="tab" aria-selected="false" aria-controls="contractReviewPanel" data-forecast-page="review" disabled>Contract Review</button>
    </nav>
    <div class="head-actions"><span id="saveStatus" class="save-status" data-state="connecting" role="status" aria-live="polite">Connecting…</span><span id="environment" class="badge" hidden>Connecting</span><button id="refresh" class="icon-btn" aria-label="Refresh forecasts" title="Refresh forecasts" disabled><svg viewBox="0 0 24 24"><path d="M20 7v5h-5M4 17v-5h5M19 12a7 7 0 0 0-12-5L4 10m1 2a7 7 0 0 0 12 5l3-3"/></svg></button></div>
  </header>
  <div class="main">
    <div id="notice" class="notice" role="alert" hidden></div>
    <section id="forecastsPanel" role="tabpanel" aria-labelledby="forecastsTab" data-lm-motion="panel">
    <section class="toolbar" aria-label="Forecast filters">
      <div class="filter territory-filter"><label id="territoryLabel">Territory</label><button id="territoryPicker" class="picker" data-picker="territories" aria-labelledby="territoryLabel territoryText" aria-haspopup="dialog" aria-expanded="false" disabled><span id="territoryText">All Territories</span><svg viewBox="0 0 20 20"><path d="m5 7 5 5 5-5"/></svg></button></div>
      <div class="filter wide"><label id="projectLabel">Project</label><button id="projectPicker" class="picker" data-picker="project" aria-labelledby="projectLabel projectText" aria-haspopup="dialog" aria-expanded="false" disabled><span id="projectText">Choose a Project</span><svg viewBox="0 0 20 20"><path d="m5 7 5 5 5-5"/></svg></button></div>
      <div class="filter"><label id="builderLabel">Builders</label><button id="builderPicker" class="picker" data-picker="builders" aria-labelledby="builderLabel builderText" aria-haspopup="dialog" aria-expanded="false" disabled><span id="builderText">All Builders</span><svg viewBox="0 0 20 20"><path d="m5 7 5 5 5-5"/></svg></button></div>
      <div class="filter"><label id="yearLabel">Fiscal Years</label><button id="yearPicker" class="picker" data-picker="years" aria-labelledby="yearLabel yearText" aria-haspopup="dialog" aria-expanded="false" disabled><span id="yearText">WFY 2026, 2027, 2028</span><svg viewBox="0 0 20 20"><path d="m5 7 5 5 5-5"/></svg></button></div>
      <button id="add" class="btn primary" disabled><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 4v12M4 10h12"/></svg>Add Forecast</button>
      <span id="window" class="window-state" hidden></span>
    </section>
    <section id="workspace" hidden>
      <div id="phaseSwitch" class="forecast-header-controls">
        <div class="forecast-phase-switch"><span id="phaseSwitchLabel">Phase</span><div id="phaseTabs" class="forecast-phase-tabs" role="tablist" aria-labelledby="phaseSwitchLabel" data-lm-motion="tabs"></div></div>
        <button id="editPhaseOrder" class="btn" type="button" hidden>Phase Order</button>
        <div id="forecastGrouping" class="forecast-grouping" role="tablist" aria-label="Forecast Grouping" data-lm-motion="tabs">
          <button id="groupByPhase" type="button" role="tab" aria-selected="true" aria-controls="forecastGroups" data-forecast-grouping="phase">Phase → Builder</button>
          <button id="groupByBuilder" type="button" role="tab" aria-selected="false" aria-controls="forecastGroups" data-forecast-grouping="builder" tabindex="-1">Builder → Phase</button>
        </div>
      </div>
      <div id="phaseOverview" role="tabpanel">
        <section id="compactSummary" class="compact-summary" aria-label="Phase Lot Totals and Takedown Schedules"></section>
        <div id="phaseFallback" role="tabpanel" hidden>
          <p id="phaseOverviewError" class="phase-load-error" role="status" hidden></p>
      <details class="snapshot" id="summary" hidden><summary><svg class="summary-icon" viewBox="0 0 20 20" aria-hidden="true"><path d="M3 16V4h14v12H3M3 8h14M8 8v8"/></svg><span>Phase Lot Totals and Takedown Schedules</span><svg class="summary-arrow" viewBox="0 0 20 20" aria-hidden="true"><path d="m5 7 5 5 5-5"/></svg></summary><iframe id="summaryFrame" title="Subdivision and builder takedown summary" sandbox="" loading="lazy"></iframe></details>
        </div>
      </div>
      <section class="matrix-panel">
        <div class="matrix-tools">
          <div class="matrix-title"><h2>Builder Forecasts</h2></div>
          <div class="matrix-view-controls">
          <div id="matrixLegend" class="matrix-legend" aria-label="Displayed value colors"><span data-legend="sold" hidden><i class="sold-swatch" aria-hidden="true"></i>Sold</span><span data-legend="forecast"><i class="forecast-swatch" aria-hidden="true"></i>Forecast</span><span data-legend="scheduled" hidden><i class="scheduled-swatch" aria-hidden="true"></i>Scheduled</span></div>
          <div class="segments" role="group" aria-label="Displayed values">
            <button data-view="outlook" aria-pressed="true" title="Completed months show sold lots. Current and future months show forecast.">Sold + Forecast</button>
            <button data-view="forecast" aria-pressed="false"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 16V9m6 7V4m6 12v-5"/></svg>Forecast</button>
            <button data-view="actual" aria-pressed="false"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="m4 10 4 4 8-8"/></svg>Sold</button>
            <button data-view="scheduled" aria-pressed="false"><svg viewBox="0 0 20 20" aria-hidden="true"><rect x="3" y="4" width="14" height="13" rx="2"/><path d="M6 2v4m8-4v4M3 8h14"/></svg>Scheduled</button>
          </div>
          </div>
          <div class="matrix-actions"><button id="expandForecastGroups" type="button" class="btn">Expand All</button><button id="check" class="btn" hidden>Check status</button><button id="discard" class="btn" hidden>Discard local changes</button><button id="export" class="btn"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 3v9m-3-3 3 3 3-3M4 13v4h12v-4"/></svg>Export CSV</button></div>
        </div>
        <div id="creationStatus" class="creation-status" role="status" aria-live="polite" hidden></div>
        <div id="matrixScroll">
          <div id="phaseReportScroll" tabindex="0" role="region" aria-label="Phase Monthly Totals">
            <div id="phaseReportContent"><div id="phaseMonthHeader" class="forecast-phase-axis"></div><div id="forecastGroups" role="tabpanel" aria-labelledby="groupByPhase" data-lm-motion="panel"></div></div>
          </div>
        </div>
      </section>
    </section>
    <section id="empty" class="empty"><h2>Select a Project</h2></section>
    <footer class="app-foot"><span>WFY runs from February through January</span><span>Forecast Manager · v1.12.1</span></footer>
    </section>
    <section id="contractReviewPanel" role="tabpanel" aria-labelledby="contractReviewTab" data-lm-motion="panel" hidden></section>
  </div>
</main>
<div id="modal" class="modal" hidden><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialogTitle"><header class="dialog-head"><div><span id="dialogKicker" class="kicker">FORECAST YEAR</span><h2 id="dialogTitle">Add forecast year</h2><div id="dialogContext" class="dialog-context" hidden></div></div><button id="dialogClose" class="close-btn" aria-label="Close"><svg viewBox="0 0 20 20"><path d="m5 5 10 10M15 5 5 15"/></svg></button></header><div class="dialog-body" id="dialogBody"></div><footer class="dialog-foot"><span id="dialogStatus" role="status" aria-live="polite"></span><div><button id="dialogCancel" class="btn">Cancel</button><button id="dialogAction" class="btn primary">Create forecast year</button></div></footer></section></div>
<script>
LMCriticalErrors.configure({widget:"Forecast Manager",version:"1.12.1",code:"FORECAST",getContext:function(){return window.LMRuntime?LMRuntime.current():{};}});
// Creator v2 UTIL handshake is shared with the permanent loader.
// ZOHO.CREATOR.init is the legacy v1 equivalent; do not mix initialization versions.
window.forecastReporterReady=function(){LMCriticalErrors.markReady();};
</script>
<script src="forecast-app.js?v=1.12.1"></script>
</body>
</html>
