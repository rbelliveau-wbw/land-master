
name: Create Widget Release

on:
  workflow_dispatch:
    inputs:
      widget:
        description: Widget slug
        required: true
        type: choice
        options:
          - proforma-manager
          - budget-manager
          - land-master
          - contract-management
          - tax-center
          - milestone-gantt
      version:
        description: New immutable version
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
      - run: npm run validate
      - run: npm run release -- "${{ inputs.widget }}" "${{ inputs.version }}"
      - name: Create pull request
        uses: peter-evans/create-pull-request@v8
        with:
          branch: "release/${{ inputs.widget }}-${{ inputs.version }}"
          commit-message: "Release ${{ inputs.widget }} ${{ inputs.version }}"
          title: "Release ${{ inputs.widget }} ${{ inputs.version }}"
          body: "Creates an immutable widget release. Review validation and promotion separately."
