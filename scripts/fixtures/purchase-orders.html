<!doctype html><meta charset="utf-8"><title>PO browser fixture</title>
<link rel="stylesheet" href="/purchase-orders.css">
<style>body{font:14px system-ui;background:#f3f6fa;color:#0b2345;padding:24px}.mbtn{padding:9px 14px;border:1px solid #ccd4df;background:white;border-radius:8px}.primary{background:#0b2345;color:white}button{cursor:pointer}</style>
<h1>Purchase Order fixture</h1><p>Local simulation — no Creator writes or notifications.</p>
<button id="open">Open PO</button><button id="lose">Lose next response</button><button id="view">View saved PO</button><button id="over">Open over-budget draft</button><button id="approval">View approval test</button><label><input type="checkbox" id="slow">Slow saved read</label><label><input type="checkbox" id="slow-balances">Slow balances</label><label><input type="checkbox" id="slow-write">Slow write</label><label><input type="checkbox" id="fail">Fail next saved read</label><output id="writes">Writes: 0</output>
<script src="/po-domain.js"></script><script src="/po-grid.js"></script><script src="/po-controller.js"></script><script src="/po-progress.js"></script><script src="/po-ui.js"></script>
<script>
const orders=new Map(),receipts=new Map();let writes=0,lost=false,decisionReceipt;
orders.set('2002',{id:'2002',budgetId:'1001',vendorId:'1002',description:'Saved order',amount:'100.00',requestDate:'2026-10-13',dateNeeded:'2026-10-14',revision:'saved-fixture',status:'Draft',commitmentState:'None',approvalState:'Not Configured',lines:[{ID:'3002',key:'saved-line',budgetItemId:'1003',description:'Saved roadwork',uom:'EA',costElement:'5',pricingMode:'Calculated',quantity:'2',unitPrice:'50.00',finalAmount:'100.00'}]});
orders.set('2003',{...structuredClone(orders.get('2002')),id:'2003',amount:'50065.00',description:'Over-budget regression',lines:[{ID:'3003',key:'over-line',budgetItemId:'1003',description:'$100 shortfall test',uom:'EA',costElement:'5',pricingMode:'Calculated',quantity:'1',unitPrice:'50065.00',finalAmount:'50065.00'}]});
const items=[{ID:'1003',Item_Name:'Roadwork',Budget_Code:'100'},{ID:'1004',Item_Name:'Utilities',Budget_Code:'200'}];
window.fixtureDelete=true;
const ui=LMPOUI.create({scope:()=> 'development-fixture',userAccessId:()=> '1005',canEdit:()=>true,canDelete:()=>window.fixtureDelete,phaseName:()=> 'Example phase',items:()=>items,vendorUrl:()=>'/#Form:Vendors',vendors:async()=>[{ID:'1002',Vendor_Name:'Example vendor'}],saved(){},call:async p=>{
 if(p.action==='PreviewApprovals')return {success:true,contract:'po-v1',approvalPreview:{roles:(p.hasBudgetModification?['VP','CFO','COO']:['CFO']).map((role,index)=>({role,order:index+1})),hasBudgetModification:p.hasBudgetModification}};
 if(p.action==='Balances'){const balances=items.map(i=>{const final=i.ID==='1003'?5000000n:100000n;let issued=i.ID==='1003'?3500n:0n,pending=0n;for(const order of orders.values())if(order.commitmentState==='Reserved'){for(const line of order.lines)if(line.budgetItemId===i.ID)issued+=LMPO.money(line.finalAmount);for(const mod of order.approvalBundle?.modifications||[])if(mod.budgetItemId===i.ID&&mod.status!=='Approved')pending+=LMPO.money(mod.amount);}return {budgetItemId:i.ID,finalCents:String(final),modCents:'0',issuedCents:String(issued),availableCents:String(final-issued),pendingModificationCents:String(pending),subdivisionCode:'SH01',minorCode:'3225'};});await new Promise(resolve=>setTimeout(resolve,document.querySelector('#slow-balances').checked?3500:800));return {success:true,contract:'po-v1',balances};}
 if(p.action==='List')return {success:true,contract:'po-v1',rows:[...orders.values()].map(x=>({id:x.id,amount:x.amount,status:x.status}))};
 if(p.action==='Get'){if(document.querySelector('#slow').checked)await new Promise(resolve=>setTimeout(resolve,5000));if(document.querySelector('#fail').checked){document.querySelector('#fail').checked=false;throw Error('Simulated saved PO read denied');}return {success:true,contract:'po-v1',snapshot:structuredClone(orders.get(p.id))};}
 if(p.action==='Check')return receipts.get(p.token);
 if(p.action==='CheckDecision')return decisionReceipt;
 writes++;document.querySelector('#writes').textContent='Writes: '+writes;
 if(p.action==='Approve'||p.action==='Reject'){const snapshot=structuredClone(orders.get(p.id)),bundle=snapshot.approvalBundle,row=bundle.rows.find(r=>r.id===p.approvalId);row.status=p.action==='Approve'?'Approved':'Rejected';row.respondedDate='2026-10-13';row.notes=p.note;snapshot.approvalState=p.action==='Approve'?'Pending':'Rejected';if(p.action==='Approve')bundle.rows.find(r=>r.role==='CFO').status='Pending';bundle.emailSent=true;bundle.canApprove=false;bundle.canRetryEmail=false;orders.set(p.id,snapshot);decisionReceipt={contract:'po-v1',success:true,writeState:'verified',snapshot};await new Promise(resolve=>setTimeout(resolve,document.querySelector('#slow-write').checked?4000:300));if(lost){lost=false;throw Error('Simulated lost decision response');}return structuredClone(decisionReceipt);}
 const snapshot={...structuredClone(p),id:p.id||'2001',revision:p.token,status:p.action==='Submit'?'Submitted':'Draft',commitmentState:p.action==='Submit'?'Reserved':'None',approvalState:'Not Configured',lines:p.lines.map((l,i)=>({...l,ID:String(3001+i)}))};
 if(p.action==='Submit'){const modifications=Object.entries(LMPO.validate(p,true).grouped).flatMap(([id,amount],index)=>{const extra=amount-BigInt(p.expectedBalances[id])-BigInt(p.expectedPendingModifications[id]);return extra>0n?[{id:String(4001+index),budgetItemId:id,amount:LMPO.currency(extra),status:'Submitted'}]:[];});snapshot.approvalState='Pending';snapshot.budgetModificationId=modifications[0]?.id||null;snapshot.approvalBundle={modifications,rows:(modifications.length?['VP','CFO','COO']:['CFO']).map((role,index)=>({id:String(5001+index),role,order:index+1,status:index?'Not Sent':'Pending'})),canApprove:false,canRetryEmail:false,emailSent:false};}
 const receipt={success:true,contract:'po-v1',writeState:'verified',snapshot};orders.set(snapshot.id,snapshot);receipts.set(p.token,receipt);
 await new Promise(r=>setTimeout(r,300));if(lost){lost=false;throw Error('Simulated lost response');}return receipt;
}});
document.querySelector('#open').onclick=e=>ui.open({ID:'1001'},e.target);
document.querySelector('#lose').onclick=()=>lost=true;
document.querySelector('#view').onclick=e=>ui.open({ID:'1001'},e.target,'2002','view');
document.querySelector('#over').onclick=e=>ui.open({ID:'1001'},e.target,'2003');
document.querySelector('#approval').onclick=e=>{const snapshot={...structuredClone(orders.get('2003')),id:'2004',status:'Submitted',commitmentState:'Reserved',approvalState:'Pending',budgetModificationId:'4004',approvalBundle:{rows:[{id:'5004',role:'VP',order:1,status:'Pending',notes:''},{id:'5005',role:'CFO',order:2,status:'Not Sent'},{id:'5006',role:'COO',order:3,status:'Not Sent'}],modifications:[{id:'4004',budgetItemId:'1003',amount:'100.00',status:'Submitted'}],active:{id:'5004',notes:''},canApprove:true,canRetryEmail:false,emailSent:true}};orders.set('2004',snapshot);ui.open({ID:'1001'},e.target,'2004','view');};
</script>
