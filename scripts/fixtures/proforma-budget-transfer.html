<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PF Budget transfer fixture</title><link rel="stylesheet" href="budget-transfer.css"><style>body{font:13px Arial;background:#f4f7fb;color:#193a5a}.btn{padding:8px 12px;border:1px solid #ccd9e8;border-radius:7px;background:white;color:#193a5a}.primary{background:#2361b6;color:white}button:disabled{opacity:.5}#test-result{padding:16px}</style><script src="budget-transfer-model.js"></script><script src="budget-transfer-ui.js"></script><h1>PF Budget transfer · synthetic records</h1><button class="btn" id="open">Open transfer</button><div id="test-result" role="status"></div><script>
