<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Manage Lots</title>
  <script src="https://js.zohostatic.com/creator/widgets/version/1.0/widgetsdk-min.js"></script>
  <script src="critical-error-reporter.js"></script>
  <style>
    *{box-sizing:border-box} :root{--navy:#0b2b52;--blue:#2563eb;--bg:#f3f6fa;--line:#dbe3ed;--text:#10233e;--muted:#68758a;--green:#07875b;--greenbg:#e9fbf3;--amber:#b56908;--amberbg:#fff6de;--red:#be3745;--grey:#eef2f6}
    body{margin:0;background:var(--bg);color:var(--text);font:13px Inter,"Segoe UI",sans-serif} button,input,select,textarea{font:inherit}
    .top{height:58px;background:white;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 22px;gap:12px;position:sticky;top:0;z-index:10}.mark{width:30px;height:30px;border-radius:9px;background:var(--navy);color:white;display:grid;place-items:center;font-weight:800}.title{font-size:16px;font-weight:800}.sub{font-size:11px;color:var(--muted)}.grow{flex:1}.status{display:flex;gap:7px;align-items:center;color:var(--muted);font-size:12px}.dot{width:7px;height:7px;border-radius:50%;background:#d59b14}.dot.live{background:#08966b}.dot.error{background:var(--red)}
    .toolbar{background:white;border-bottom:1px solid var(--line);padding:14px 22px;display:flex;gap:12px;align-items:end;flex-wrap:wrap}.field{display:grid;gap:5px}.field label{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}select,input,textarea{border:1px solid #cbd6e3;border-radius:8px;background:white;color:var(--text);padding:9px 11px;outline:none}select:focus,input:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px #2563eb18}.toolbar select{min-width:280px}.search{min-width:220px}.summary{display:flex;gap:8px;flex-wrap:wrap}.pill{padding:7px 10px;border-radius:20px;background:var(--grey);font-weight:700;color:#536176}.pill.open{background:var(--greenbg);color:var(--green)}
    .notice{margin:16px 22px 0;padding:11px 13px;border:1px solid #f0d896;background:#fffaf0;color:#805a06;border-radius:9px;display:none}.notice.show{display:block}.main{padding:18px 22px 100px}.empty{padding:80px;text-align:center;color:var(--muted)}.blocks{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px}.block{background:white;border:1px solid var(--line);border-radius:12px;box-shadow:0 1px 3px #14233a0b;overflow:hidden}.block.selected{border-color:#7597c4;box-shadow:0 0 0 3px #1d447912}.bh{padding:11px 13px;border-bottom:1px solid #edf1f5;display:flex;align-items:center;gap:8px}.bh strong{font-size:12px;text-transform:uppercase;letter-spacing:.06em}.bh .count{color:var(--muted)}.link{margin-left:auto;border:0;background:none;color:var(--blue);font-weight:700;cursor:pointer}.lots{padding:12px;display:grid;grid-template-columns:repeat(auto-fill,minmax(34px,1fr));gap:5px}.lot{aspect-ratio:1;border-radius:6px;border:1px solid;display:grid;place-items:center;font-weight:800;font-size:10px;cursor:not-allowed;position:relative}.lot.open{background:var(--greenbg);border-color:#72d9b2;color:#056746;cursor:pointer}.lot.open:hover{transform:translateY(-1px);box-shadow:0 3px 8px #07875b20}.lot.chosen{background:var(--navy);border-color:var(--navy);color:white;box-shadow:0 2px 7px #0b2b5240}.lot.sold,.lot.takedown{background:var(--grey);border-color:#d3dae4;color:#8490a0}.lot.contracted{background:var(--amberbg);border-color:#efd077;color:var(--amber)}
    .bottom{position:fixed;left:0;right:0;bottom:0;background:white;border-top:1px solid var(--line);padding:12px 22px;display:flex;align-items:center;gap:12px;box-shadow:0 -5px 20px #14233a10;z-index:12}.selected-count{font-size:15px;font-weight:800}.chips{flex:1;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.btn{border:0;border-radius:9px;padding:10px 15px;font-weight:800;cursor:pointer}.btn:disabled{opacity:.4;cursor:not-allowed}.secondary{background:white;border:1px solid #cbd6e3;color:var(--text)}.primary{background:var(--navy);color:white}.primary:hover:not(:disabled){background:#061f3d}
    .overlay{position:fixed;inset:0;background:#07152699;display:none;z-index:30;padding:22px;overflow:auto}.overlay.open{display:flex}.modal{width:min(1040px,100%);margin:auto;background:white;border-radius:15px;box-shadow:0 24px 70px #0004}.mh,.mf{padding:17px 20px;display:flex;align-items:center;gap:10px}.mh{border-bottom:1px solid var(--line)}.mh h2{margin:0;font-size:18px}.x{margin-left:auto;border:0;background:var(--grey);border-radius:50%;width:30px;height:30px;cursor:pointer}.mb{padding:20px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.span2{grid-column:span 2}.span3{grid-column:1/-1}.field textarea{min-height:82px;resize:vertical}.lotlist{border:1px solid var(--line);background:#f8fafc;border-radius:8px;padding:9px;min-height:38px}.tag{display:inline-block;padding:4px 7px;background:#e8eef7;color:var(--navy);border-radius:6px;margin:2px;font-size:11px;font-weight:700}.section{grid-column:1/-1;margin-top:5px;padding-top:16px;border-top:1px solid var(--line);font-weight:800}.interest{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.mf{border-top:1px solid var(--line);justify-content:flex-end}.errorbox{display:none;margin-bottom:14px;padding:11px;background:#fff0f1;color:#9d2734;border:1px solid #f1b9bf;border-radius:8px}.errorbox.show{display:block}.toast{position:fixed;right:20px;bottom:78px;background:#0e273f;color:white;padding:12px 16px;border-radius:10px;display:none;z-index:50}.toast.show{display:block}
    @media(max-width:760px){.grid,.interest{grid-template-columns:1fr}.span2{grid-column:auto}.toolbar select,.search{min-width:100%;width:100%}.top{padding:0 12px}.main{padding-left:12px;padding-right:12px}.bottom{padding:10px 12px}.chips{display:none}}
  </style>
</head>
<body>
  <header class="top"><div class="mark">LM</div><div><div class="title">Manage Lots</div><div class="sub">Create builder takedowns visually</div></div><div class="grow"></div><div class="status"><span id="dot" class="dot"></span><span id="mode">Connecting to Creator…</span></div></header>
  <section class="toolbar">
    <div class="field"><label for="subdivision">Subdivision</label><select id="subdivision"><option value="">Choose a subdivision…</option></select></div>
    <div class="field"><label for="search">Find a lot</label><input id="search" class="search" placeholder="Lot, block, or code"></div>
    <div class="summary"><span class="pill open" id="availablePill">0 available</span><span class="pill" id="lockedPill">0 unavailable</span></div>
    <button id="reload" class="btn secondary">↻ Refresh</button>
  </section>
  <div id="notice" class="notice"></div>
  <main class="main"><div id="empty" class="empty">Choose a subdivision to view its lots.</div><div id="blocks" class="blocks"></div></main>
  <footer class="bottom"><div id="selectedCount" class="selected-count">No lots selected</div><div id="chips" class="chips"></div><button id="clear" class="btn secondary" disabled>Clear</button><button id="create" class="btn primary" disabled>Create Takedown</button></footer>
  <div id="overlay" class="overlay"><div class="modal"><div class="mh"><div><h2>Create Builder Takedown</h2><div id="modalSub" class="sub"></div></div><button id="close" class="x" aria-label="Close">×</button></div><div class="mb"><div id="formError" class="errorbox"></div><div id="form" class="grid"></div></div><div class="mf"><button id="cancel" class="btn secondary">Cancel</button><button id="confirm" class="btn primary">Create Takedown</button></div></div></div>
  <div id="toast" class="toast"></div>
  <script>
  (function(){
    "use strict";
    var CFG={pageSize:200,maxPages:50,reports:{subdivisions:"All_Subdivisions",builders:"All_Builders",lots:"All_Lots_All_Fields"},form:"Builder_Takedown"};
    var S={live:false,subdivisions:[],builders:[],lots:[],selected:new Set(),subdivisionId:"",busy:false};
    var $=function(id){return document.getElementById(id)};
    function str(v){if(v==null)return"";if(typeof v==="object")return String(v.ID||v.id||v.display_value||v.Subdivision_Name||v.Builder_Name||v.Name||"");return String(v)}
    function idOf(v){return str(v)} function truthy(v){return v===true||v===1||/^(true|yes|1)$/i.test(str(v))}
    function esc(v){return str(v).replace(/[&<>"']/g,function(c){return({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]})}
    function money(v){var n=Number(String(v||0).replace(/[$,]/g,""));return isFinite(n)?n:0}
    function toZoho(v){if(!v)return"";var p=v.split("-");return p.length===3?p[1]+"/"+p[2]+"/"+p[0]:v}
    function relationEmpty(v){if(v==null||v==="")return true;if(Array.isArray(v))return v.length===0;return /^\[?\s*\]?$/.test(str(v))}
    function eligible(lot){return str(lot.Status)==="Open"&&!truthy(lot.Archived)&&relationEmpty(lot.Add_Builder_Takedown_Name)}
    function lotSubdivisionId(l){return idOf(l.Subdivision)}
    function responseBad(r){var c=r&&(r.code||(r.result&&r.result.code));return !r||(c&&String(c)!=="3000")||r.error||(r.result&&r.result.error)}
    function emptyResponse(r){var c=r&&(r.code||(r.result&&r.result.code));return String(c)==="3100"||String(c)==="9280"}
    function getAll(report,criteria){var out=[];function page(n){var a={reportName:report,page:n,pageSize:CFG.pageSize};if(criteria)a.criteria=criteria;return ZOHO.CREATOR.API.getAllRecords(a).then(function(r){if(emptyResponse(r))return out;if(responseBad(r))throw r;var rows=r.data||[];out=out.concat(rows);return rows.length===CFG.pageSize&&n<CFG.maxPages?page(n+1):out})}return page(1)}
    function createSuccess(r){var c=r&&(r.code||(r.result&&r.result.code));return String(c)==="3000"&&!r.error}
    function addRecord(data){var app=(window.ZOHO&&ZOHO.CREATOR&&ZOHO.CREATOR.appName)||undefined;var env=[{formName:CFG.form,data:{data:data}},{formName:CFG.form,data:data},{appName:app,formName:CFG.form,data:{data:data}},{appName:app,formName:CFG.form,data:data}];function attempt(i){if(i>=env.length)return Promise.reject(new Error("Creator did not accept the add-record payload."));return ZOHO.CREATOR.API.addRecord(env[i]).then(function(r){if(createSuccess(r))return r;throw r}).catch(function(e){var c=e&&e.code;if(!c&&e&&e.responseText)try{c=JSON.parse(e.responseText).code}catch(x){}if(String(c)==="2945")return attempt(i+1);throw e})}return attempt(0)}
    function errText(e){if(!e)return"Unknown error";if(typeof e==="string")return e;return e.message||e.responseText||JSON.stringify(e).slice(0,300)}
    function setMode(text,kind){$("mode").textContent=text;$("dot").className="dot "+(kind||"")}
    function notice(msg){$("notice").textContent=msg;$("notice").classList.toggle("show",!!msg)}
    function toast(msg){$("toast").textContent=msg;$("toast").classList.add("show");setTimeout(function(){$("toast").classList.remove("show")},3500)}
    function load(){if(!S.live)return;setMode("Loading lots…","");notice("");Promise.all([getAll(CFG.reports.subdivisions),getAll(CFG.reports.builders),getAll(CFG.reports.lots)]).then(function(all){S.subdivisions=all[0];S.builders=all[1];S.lots=all[2];renderSubdivisionOptions();render();setMode("Connected","live")}).catch(function(e){setMode("Load failed","error");notice("Creator data could not be loaded: "+errText(e));if(window.LMCriticalErrors)LMCriticalErrors.breadcrumb("error","Manage Lots load failed",{error:errText(e)},true)})}
    function renderSubdivisionOptions(){var el=$("subdivision"),chosen=S.subdivisionId;el.innerHTML='<option value="">Choose a subdivision…</option>'+S.subdivisions.slice().sort(function(a,b){return str(a.Subdivision_Name).localeCompare(str(b.Subdivision_Name))}).map(function(s){return '<option value="'+esc(s.ID)+'"'+(String(s.ID)===chosen?' selected':'')+'>'+esc(s.Subdivision_Name)+'</option>'}).join("")}
    function selectedSubdivision(){return S.subdivisions.find(function(x){return String(x.ID)===S.subdivisionId})}
    function visibleLots(){var q=$("search").value.trim().toLowerCase();return S.lots.filter(function(l){if(lotSubdivisionId(l)!==S.subdivisionId)return false;if(!q)return true;return [l.Lot_Code,l.Block,l.Lot_Number].some(function(v){return str(v).toLowerCase().indexOf(q)>=0})})}
    function statusClass(l){if(eligible(l))return"open";if(str(l.Status)==="Sold")return"sold";if(!relationEmpty(l.Add_Builder_Takedown_Name))return"takedown";if(str(l.Status)==="Contracted")return"contracted";return"sold"}
    function render(){var rows=visibleLots(),blocks={};S.selected.forEach(function(id){if(!S.lots.some(function(l){return String(l.ID)===id&&lotSubdivisionId(l)===S.subdivisionId}))S.selected.delete(id)});rows.forEach(function(l){var b=str(l.Block)||"Unassigned";(blocks[b]||(blocks[b]=[])).push(l)});$("empty").style.display=S.subdivisionId&&rows.length?"none":"block";$("empty").textContent=S.subdivisionId?"No lots match this view.":"Choose a subdivision to view its lots.";$("blocks").innerHTML=Object.keys(blocks).sort(function(a,b){return a.localeCompare(b,undefined,{numeric:true})}).map(function(b){var lots=blocks[b].sort(function(a,c){return Number(a.Lot_Number)-Number(c.Lot_Number)}),sel=lots.filter(function(l){return S.selected.has(String(l.ID))}).length;return '<section class="block '+(sel?'selected':'')+'"><div class="bh"><strong>Block '+esc(b)+'</strong><span class="count">'+lots.length+' lots</span><button class="link" data-all="'+esc(b)+'">Select available</button></div><div class="lots">'+lots.map(function(l){var c=statusClass(l),chosen=S.selected.has(String(l.ID));var reason=eligible(l)?"Available":str(l.Status)==="Sold"?"Sold":!relationEmpty(l.Add_Builder_Takedown_Name)?"Already in a takedown":str(l.Status)||"Unavailable";return '<button class="lot '+c+(chosen?' chosen':'')+'" data-id="'+esc(l.ID)+'" '+(eligible(l)?'':'disabled')+' title="'+esc(l.Lot_Code||('Block '+l.Block+', Lot '+l.Lot_Number))+' — '+esc(reason)+'">'+esc(l.Lot_Number)+'</button>'}).join("")+'</div></section>'}).join("");var subRows=S.lots.filter(function(l){return lotSubdivisionId(l)===S.subdivisionId});$("availablePill").textContent=subRows.filter(eligible).length+" available";$("lockedPill").textContent=subRows.filter(function(l){return !eligible(l)}).length+" unavailable";syncSelection()}
    function syncSelection(){var ids=Array.from(S.selected),lots=ids.map(function(id){return S.lots.find(function(l){return String(l.ID)===id})}).filter(Boolean);$("selectedCount").textContent=ids.length?ids.length+" lot"+(ids.length===1?"":"s")+" selected":"No lots selected";$("chips").textContent=lots.map(function(l){return "B"+str(l.Block)+" L"+str(l.Lot_Number)}).join(" · ");$("clear").disabled=!ids.length;$("create").disabled=!ids.length}
    function toggleLot(id){var l=S.lots.find(function(x){return String(x.ID)===id});if(!l||!eligible(l))return;if(S.selected.has(id))S.selected.delete(id);else S.selected.add(id);render()}
    function formField(label,id,type,opts,cls){var body;if(type==="select")body='<select id="'+id+'">'+opts+'</select>';else if(type==="textarea")body='<textarea id="'+id+'"></textarea>';else body='<input id="'+id+'" type="'+type+'"'+(opts?' value="'+esc(opts)+'"':'')+'>';return '<div class="field '+(cls||"")+'"><label for="'+id+'">'+label+'</label>'+body+'</div>'}
    function openModal(){var sub=selectedSubdivision(),today=new Date().toISOString().slice(0,10),lots=Array.from(S.selected).map(function(id){return S.lots.find(function(l){return String(l.ID)===id})}).filter(Boolean);var builderOpts='<option value="">Choose builder…</option>'+S.builders.slice().sort(function(a,b){return str(a.Builder_Name).localeCompare(str(b.Builder_Name))}).map(function(b){return '<option value="'+esc(b.ID)+'">'+esc(b.Builder_Name)+'</option>'}).join("");$("modalSub").textContent=str(sub&&sub.Subdivision_Name)+" · "+lots.length+" selected lots";var html=formField("Name *","fName","text",str(sub&&sub.Subdivision_Name)+" Takedown - "+today)+formField("Builder *","fBuilder","select",builderOpts)+formField("Status *","fStatus","select",'<option>Active</option><option>Closed</option>')+formField("Entered Date *","fEntered","date",today)+formField("Purchase Date *","fPurchase","date",today)+formField("Tax Proration Date","fTaxDate","date","")+formField("Tax Method *","fTaxMethod","select",'<option>Flat</option><option>Percentage of Appraisal</option>')+formField("Tax Per Lot","fTaxPerLot","number","0")+formField("Percent of Appraisal","fPercent","number","0")+formField("Tax Status *","fTaxStatus","select",'<option>Taxes Paid</option><option>Taxes Unpaid</option><option>Proration Taxes Unpaid</option>')+formField("Additional Fee Type","fFeeType","select",'<option value="">None</option><option>Mailbox</option><option>Water Tap</option><option>Other</option>')+formField("Additional Fees Per Lot","fFees","number","0");html+='<div class="field span3"><label>Selected lots</label><div class="lotlist">'+lots.map(function(l){return '<span class="tag">Block '+esc(l.Block)+' · Lot '+esc(l.Lot_Number)+'</span>'}).join("")+'</div></div>'+formField("Notes","fNotes","textarea","","span3")+'<div class="section">Interest Rate Periods</div><div id="interest" class="interest span3"></div>';$("form").innerHTML=html;var interest="";for(var i=1;i<=12;i++)interest+=formField("Rate "+i+" (%)","ir"+i,"number","")+formField("From","if"+i,"date","")+formField("To","it"+i,"date","");$("interest").innerHTML=interest;$("formError").classList.remove("show");$("overlay").classList.add("open")}
    function val(id){return $(id)?$(id).value.trim():""}
    function payload(){var data={Name:val("fName"),Subdivision1:S.subdivisionId,Builder1:val("fBuilder"),Entered_Date:toZoho(val("fEntered")),Purchase_Date:toZoho(val("fPurchase")),Tax_Method:val("fTaxMethod"),Tax_Status:val("fTaxStatus"),Status:val("fStatus"),Lots:Array.from(S.selected),Lot_Count:S.selected.size,Tax_Per_Lot:Number(val("fTaxPerLot")||0),Percent_of_Appraisal:Number(val("fPercent")||0),Additional_Fees_Per_Lot:Number(val("fFees")||0),Calculate_Interest:false,Notes:val("fNotes")};if(val("fTaxDate"))data.Tax_Proration_Date=toZoho(val("fTaxDate"));if(val("fFeeType"))data.Additional_Fee_Type=val("fFeeType");for(var i=1;i<=12;i++){var r=val("ir"+i),f=val("if"+i),t=val("it"+i);if(r)data[i===7?"Interest_Rate_71":"Interest_Rate_"+i]=Number(r);if(f)data[i===1?"Date1_1":"Date"+i+"_1"]=toZoho(f);if(t)data[i===1?"Date1_2":"Date"+i+"_2"]=toZoho(t)}return data}
    function latestSelected(){return getAll(CFG.reports.lots).then(function(rows){var map={};rows.forEach(function(l){map[String(l.ID)]=l});var bad=Array.from(S.selected).filter(function(id){return !map[id]||!eligible(map[id])});if(bad.length){S.lots=rows;S.selected.clear();render();throw new Error(bad.length+" selected lot"+(bad.length===1?" is":"s are")+" no longer available. The selection was cleared; please review and try again.")}return rows})}
    function confirm(){if(S.busy)return;var required=["fName","fBuilder","fEntered","fPurchase","fTaxMethod","fTaxStatus","fStatus"].filter(function(id){return !val(id)});if(required.length){showFormError("Complete all required fields before creating the takedown.");return}S.busy=true;$("confirm").disabled=true;$("confirm").textContent="Checking lots…";latestSelected().then(function(){$("confirm").textContent="Creating…";return addRecord(payload())}).then(function(){var n=S.selected.size;S.selected.clear();$("overlay").classList.remove("open");toast("Takedown created with "+n+" lot"+(n===1?"":"s")+".");return load()}).catch(function(e){showFormError(errText(e));setMode("Create failed","error");if(window.LMCriticalErrors)LMCriticalErrors.breadcrumb("error","Builder Takedown creation failed",{error:errText(e),lotCount:S.selected.size},true)}).finally(function(){S.busy=false;$("confirm").disabled=false;$("confirm").textContent="Create Takedown"})}
    function showFormError(msg){$("formError").textContent=msg;$("formError").classList.add("show")}
    $("subdivision").addEventListener("change",function(){S.subdivisionId=this.value;S.selected.clear();render()});$("search").addEventListener("input",render);$("reload").addEventListener("click",load);$("blocks").addEventListener("click",function(e){var lot=e.target.closest("[data-id]");if(lot)return toggleLot(lot.dataset.id);var all=e.target.closest("[data-all]");if(all){S.lots.filter(function(l){return lotSubdivisionId(l)===S.subdivisionId&&str(l.Block)===all.dataset.all&&eligible(l)}).forEach(function(l){S.selected.add(String(l.ID))});render()}});$("clear").addEventListener("click",function(){S.selected.clear();render()});$("create").addEventListener("click",openModal);["close","cancel"].forEach(function(id){$(id).addEventListener("click",function(){$("overlay").classList.remove("open")})});$("confirm").addEventListener("click",confirm);
    if(window.LMCriticalErrors)LMCriticalErrors.configure({widget:"Manage Lots",version:"0.1.0",code:"MLOTS",getContext:function(){return{subdivisionId:S.subdivisionId,selectedLots:S.selected.size}}});
    if(window.ZOHO&&ZOHO.CREATOR&&typeof ZOHO.CREATOR.init==="function")ZOHO.CREATOR.init().then(function(){S.live=true;if(window.LMCriticalErrors)LMCriticalErrors.markReady();load()}).catch(function(e){setMode("Creator connection failed","error");notice("This widget must run inside Zoho Creator. "+errText(e));if(window.LMCriticalErrors)LMCriticalErrors.breadcrumb("error","Creator SDK initialization failed",{error:errText(e)},true)});else{setMode("Creator SDK unavailable","error");notice("Open this page inside Zoho Creator to load live lots.")}
  })();
  </script>
</body>
</html>
