<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Pro Forma Manager</title>
<script src="https://static.zohocdn.com/creator/widgets/version/1.0/widgetsdk-min.js"></script>
<style>
/* â”€â”€ TOKENS â”€â”€ matches Budget Manager chrome â”€â”€ */
:root{
  --bg:#f0f3f7; --surface:#e8ecf1; --card:#fff;
  --line:#dde4ef; --line-strong:#c8d4e5;
  --text:#0f2744; --muted:#5c7394; --faint:#8ea0bd;
  --navy:#0b2345; --navy-soft:rgba(11,35,69,.08);
  --primary:#1e40af; --primary-2:#2563eb; --ptint:#eef4ff; --psoft:#e8f0fb;
  --green:#047857; --green-bg:#ecfdf5;
  --amber:#b45309; --amber-bg:#fffbeb;
  --red:#b91c1c;   --red-bg:#fef2f2;
  --violet:#3730a3;--violet-bg:#e0e7ff;
  --r:10px; --rsm:6px;
  --shadow:0 2px 8px rgba(30,64,175,.06),0 1px 2px rgba(0,0,0,.03);
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;overflow:hidden}
body{display:flex;flex-direction:column;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:13px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit}
.mono{font-family:"SF Mono",ui-monospace,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--primary-2);outline-offset:1px}

/* â”€â”€ TOPBAR â”€â”€ */
.topbar{display:flex;align-items:center;gap:0;height:48px;padding:0 18px;background:var(--card);border-bottom:1px solid var(--line);flex-shrink:0}
.topbar-brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:14px;letter-spacing:-.2px;color:var(--navy);margin-right:20px;flex-none}
.topbar-brand svg{width:16px;height:16px;color:var(--primary)}
.topbar-brand small{font-size:9.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-left:2px}
.tabs{display:flex;align-items:center;gap:4px;background:#eef2f8;border:1px solid #dde5f0;border-radius:999px;padding:3px}
.tabs a{display:inline-flex;align-items:center;gap:7px;padding:0 16px;height:30px;font-size:12px;font-weight:700;color:#5a6b85;text-decoration:none;border-radius:999px;transition:all .13s;white-space:nowrap;cursor:pointer}
.tabs a:hover{color:var(--navy);background:rgba(255,255,255,.6)}
.tabs a.active{color:#fff;background:var(--navy);box-shadow:0 1px 3px rgba(11,31,58,.25)}
.tabs a.disabled{opacity:.4;pointer-events:none}
.spacer{flex:1}
.statusline{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;color:var(--muted)}
.statusline .dot{width:7px;height:7px;border-radius:50%;background:var(--green)}
.statusline .dot.warn{background:var(--amber)} .statusline .dot.err{background:var(--red)}

/* â”€â”€ LAYOUT â”€â”€ */
.main{flex:1;overflow:auto;padding:16px 18px 18px;display:flex;flex-direction:column;min-height:0}
.view{display:none}.view.show{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}

/* â”€â”€ BUTTONS â”€â”€ */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-strong);background:#fff;color:var(--text);
  font-size:12px;font-weight:700;padding:7px 14px;border-radius:8px;cursor:pointer;transition:all .12s;white-space:nowrap}
.btn:hover{border-color:var(--primary-2);color:var(--primary)}
.btn.primary{background:var(--primary-2);border-color:var(--primary-2);color:#fff}
.btn.primary:hover{background:var(--primary);color:#fff}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--primary)}
.btn.danger{color:var(--red)} .btn.danger:hover{border-color:var(--red);background:var(--red-bg)}
.btn:disabled{opacity:.5;pointer-events:none}
.btn.sm{padding:4px 10px;font-size:11px}

/* â”€â”€ LIST VIEW â”€â”€ */
.list-head{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.list-head h1{font-size:18px;font-weight:800;letter-spacing:-.3px;margin:0;color:var(--navy)}
.list-head .ct{display:inline-grid;place-items:center;min-width:22px;height:20px;padding:0 7px;font-size:10.5px;font-weight:800;border-radius:999px;background:var(--psoft);color:var(--primary)}
.searchbox{display:flex;align-items:center;gap:7px;background:#eef2f8;border:1px solid transparent;border-radius:8px;padding:6px 11px;min-width:230px;transition:background .12s,border-color .12s,box-shadow .12s}
.searchbox:hover{background:#e6edf7}
.searchbox:focus-within{background:#fff;border-color:var(--primary-2);box-shadow:0 0 0 3px rgba(37,99,235,.12)}
.searchbox input{border:0;outline:0;font-size:12.5px;flex:1;background:transparent;color:var(--text)}
.searchbox svg{width:13px;height:13px;color:var(--faint)}
select.filter{border:1px solid transparent;border-radius:8px;background:#eef2f8;font-size:12px;font-weight:600;color:var(--text);padding:6px 8px;cursor:pointer;transition:background .12s}
select.filter:hover{background:#e6edf7}
select.filter:focus{background:#fff;border-color:var(--primary-2);outline:0;box-shadow:0 0 0 3px rgba(37,99,235,.12)}


.list-title-stack{display:flex;flex-direction:column;gap:4px}
.list-kicker{font-size:10.5px;font-weight:850;letter-spacing:.12em;text-transform:uppercase;color:#6b7f9f}
.list-sub{font-size:12px;font-weight:600;color:#71829d}

.sales-pace-grid{grid-template-columns:repeat(2,minmax(0,1fr));max-width:620px}
@media(max-width:760px){.sales-pace-grid{grid-template-columns:1fr}}

.addl-toolbar{
  display:flex;
  align-items:center;
  justify-content:flex-start;
  gap:12px;
  margin:4px 0 14px;
  flex-wrap:nowrap;
}
.addl-pills{
  margin:0;
  display:inline-flex;
  align-items:center;
  gap:4px;
  padding:4px;
  border:1px solid #d7e2f0;
  border-radius:12px;
  background:linear-gradient(180deg,#f8fbff 0%,#eef4fb 100%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.9), 0 4px 14px rgba(15,23,42,.05);
}
.addl-pills button{
  min-width:136px;
  padding:9px 16px;
  border-radius:9px;
  border:0;
  background:transparent;
  color:#51627d;
  font-size:12px;
  font-weight:800;
  letter-spacing:.02em;
  transition:background .14s,color .14s,box-shadow .14s,transform .14s;
}
.addl-pills button:hover{
  background:rgba(255,255,255,.7);
  color:#23314f;
}
.addl-pills button.active{
  color:#fff;
  background:linear-gradient(180deg,#3d7bfd 0%,#2f66df 100%);
  box-shadow:0 8px 18px rgba(37,99,235,.24), inset 0 1px 0 rgba(255,255,255,.18);
}
.addl-search{
  margin:0 !important;
  height:42px;
  min-width:320px;
  max-width:420px !important;
  width:420px;
  padding:0 13px;
  gap:10px;
  background:#fff;
  border:1px solid #d7e2f0;
  border-radius:12px;
  box-shadow:0 3px 12px rgba(15,23,42,.05);
}
.addl-search input{
  font-size:12.75px;
  font-weight:600;
  color:#0f172a;
}
.addl-search input::placeholder{
  color:#7c8da5;
  opacity:1;
}
.addl-search svg{
  width:15px;
  height:15px;
  color:#7b8dad;
  flex:none;
}
.addl-search:hover{background:#fff;border-color:#bfd3f3;box-shadow:0 4px 14px rgba(37,99,235,.08)}
.addl-search:focus-within{background:#fff;border-color:#3b82f6;box-shadow:0 0 0 4px rgba(59,130,246,.10), 0 8px 18px rgba(59,130,246,.08)}
@media(max-width:900px){
  .addl-toolbar{align-items:stretch;flex-wrap:wrap}
  .addl-search{width:100%;max-width:none !important}
}

/* â”€â”€ LIST HEADER REFRESH â”€â”€ */
.list-head.modern-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
  margin-bottom:16px;
  padding:14px 16px;
  border:1px solid #e4ebf5;
  border-radius:14px;
  background:linear-gradient(180deg,#fbfcff 0%,#f6f9fd 100%);
  box-shadow:0 8px 24px rgba(15,23,42,.05);
}
.list-head-left{display:flex;align-items:center;min-width:0}
.list-title-wrap{display:flex;align-items:center;gap:10px;min-width:0}
.list-head.modern-head h1{
  font-size:20px;
  font-weight:850;
  letter-spacing:-.35px;
  margin:0;
  color:var(--navy);
}
.list-head.modern-head .ct{
  min-width:28px;
  height:28px;
  padding:0 8px;
  font-size:11px;
  font-weight:850;
  background:#ecf3ff;
  color:#1d4ed8;
  box-shadow:inset 0 0 0 1px #d9e7ff;
}
.list-head-right{
  margin-left:auto;
  display:flex;
  align-items:center;
  justify-content:flex-end;
  gap:10px;
  flex-wrap:wrap;
}
.searchbox.list-search{
  min-width:320px;
  width:380px;
  max-width:100%;
  height:40px;
  padding:0 12px;
  gap:9px;
  background:#fff;
  border:1px solid #d7e2f0;
  border-radius:11px;
  box-shadow:0 2px 10px rgba(37,99,235,.06);
}
.searchbox.list-search:hover{
  background:#fff;
  border-color:#bfd3f3;
  box-shadow:0 4px 14px rgba(37,99,235,.10);
}
.searchbox.list-search:focus-within{
  background:#fff;
  border-color:#3b82f6;
  box-shadow:0 0 0 4px rgba(59,130,246,.10), 0 8px 18px rgba(59,130,246,.10);
}
.searchbox.list-search input{
  font-size:12.75px;
  font-weight:600;
  color:#0f172a;
}
.searchbox.list-search input::placeholder{
  color:#7c8da5;
  opacity:1;
}
.searchbox.list-search svg{
  width:15px;
  height:15px;
  color:#7b8dad;
  flex:none;
}
select.filter{
  height:40px;
  min-width:150px;
  padding:0 34px 0 12px;
  background:#fff;
  border:1px solid #d7e2f0;
  border-radius:11px;
  box-shadow:0 2px 10px rgba(15,23,42,.04);
  font-size:12.25px;
  font-weight:700;
  color:#23314f;
}
select.filter:hover{
  background:#fff;
  border-color:#bfd3f3;
  box-shadow:0 4px 14px rgba(37,99,235,.08);
}
select.filter:focus{
  background:#fff;
  border-color:#3b82f6;
  box-shadow:0 0 0 4px rgba(59,130,246,.10), 0 8px 18px rgba(59,130,246,.08);
}
#btnNew{
  position:relative;
  height:42px;
  padding:0 17px 0 8px;
  border:1px solid #1756c9;
  border-radius:12px;
  background:linear-gradient(135deg,#164ea6 0%,#2563eb 58%,#3b82f6 100%);
  color:#fff;
  font-weight:850;
  letter-spacing:-.01em;
  gap:9px;
  box-shadow:0 8px 18px rgba(37,99,235,.24),inset 0 1px 0 rgba(255,255,255,.22);
  overflow:hidden;
}
#btnNew:hover{
  background:linear-gradient(135deg,#123f89 0%,#1d4ed8 58%,#3275e5 100%);
  box-shadow:0 12px 24px rgba(37,99,235,.30),inset 0 1px 0 rgba(255,255,255,.24);
  transform:translateY(-2px);
}
#btnNew:active{transform:translateY(0);box-shadow:0 5px 12px rgba(37,99,235,.22)}
#btnNew:focus-visible{outline:0;box-shadow:0 0 0 4px rgba(59,130,246,.20),0 9px 20px rgba(37,99,235,.24)}
#btnNew .btn-new-icon{width:27px;height:27px;border-radius:9px;display:grid;place-items:center;background:rgba(255,255,255,.16);box-shadow:inset 0 0 0 1px rgba(255,255,255,.18)}
#btnNew .btn-new-icon svg{width:15px;height:15px;stroke:#fff}
@media (max-width:1180px){
  .list-head.modern-head{align-items:flex-start}
  .list-head-right{width:100%;justify-content:flex-start}
}
@media (max-width:860px){
  .searchbox.list-search{min-width:240px;width:100%}
  .list-head-right > *{flex:1 1 auto}
  .list-head-right #btnNew{flex:0 0 auto}
}

table.pf-list{width:100%;border-collapse:collapse;font-size:12.5px}
table.pf-list th{position:sticky;top:0;background:#f6f8fc;z-index:2;text-align:left;font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:9px 12px;border-bottom:1px solid var(--line)}
table.pf-list th.num, table.pf-list td.num{text-align:right}
table.pf-list td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
table.pf-list tbody tr{cursor:pointer;transition:background .1s}
table.pf-list tbody tr:hover{background:var(--ptint)}
table.pf-list tr.grp-row td{background:#f3f6fb;color:var(--muted);font-size:9.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:6px 12px;cursor:default;border-bottom:1px solid var(--line)}
table.pf-list tr.grp-row:hover td{background:#f3f6fb}
#vList.show{display:flex;flex-direction:column;min-height:100%}
#vList .list-card{flex:1;min-height:0;overflow:auto}
.pf-name{font-weight:800;color:var(--navy)} .pf-sub{font-size:11px;color:var(--muted);font-weight:600}
.chip{display:inline-flex;align-items:center;padding:2px 9px;border-radius:999px;font-size:10.5px;font-weight:800;letter-spacing:.02em}
.chip.na{background:#eef2f7;color:var(--muted)} .chip.low{background:var(--amber-bg);color:var(--amber)}
.chip.medium{background:var(--violet-bg);color:var(--violet)} .chip.high{background:var(--green-bg);color:var(--green)}
.chip.won{background:#dcfce7;color:#15803d} .chip.lost{background:var(--red-bg);color:var(--red)}
.pos{color:var(--green)} .neg{color:var(--red)}
.empty{padding:44px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;font-size:14px;color:var(--navy);margin-bottom:5px}

/* â”€â”€ DASHBOARD â”€â”€ */
.card.mb{margin-bottom:13px}
.dash-head{display:flex;align-items:flex-start;gap:12px;margin-bottom:13px}
.dash-head h1{font-size:19px;font-weight:800;letter-spacing:-.3px;margin:0 0 3px;color:var(--navy)}
.dash-head .meta{font-size:11.5px;color:var(--muted);font-weight:600}
.dash-head .meta b{color:var(--primary)}
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:11px;margin-bottom:13px}
@media(max-width:1100px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi{position:relative;border-radius:var(--r);padding:13px 15px 12px;min-height:122px;display:flex;flex-direction:column;background:#fff;border:1px solid var(--line);box-shadow:var(--shadow);overflow:hidden}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px}
.kpi .k-label{font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;margin-bottom:6px}
.kpi .k-big{font-size:22px;font-weight:800;letter-spacing:-.5px;line-height:1.12;color:var(--navy);font-variant-numeric:tabular-nums}
.kpi .k-rows{margin-top:auto;padding-top:9px;font-size:10.5px;font-weight:600;color:var(--muted)}
.kpi .k-rows div{display:flex;justify-content:space-between;gap:8px;line-height:1.75}
.kpi .k-rows span:last-child{font-weight:800;color:var(--navy);font-variant-numeric:tabular-nums}
.kpi .k-list{font-size:12px;font-weight:800;line-height:1.9;color:var(--navy);font-variant-numeric:tabular-nums}
.kpi.slate::before{background:#64748b}
.kpi.slate .k-label{color:#64748b}
.kpi.green::before{background:var(--green)}
.kpi.green .k-label{color:#15803d}
.kpi.green .k-big{color:#15803d}
.kpi.red::before{background:var(--red)}
.kpi.red .k-label{color:#b91c1c}
.kpi.red .k-big{color:#b91c1c}
.kpi.blue{background:linear-gradient(150deg,#0b2345,#1e3a6e);border-color:transparent;box-shadow:0 4px 14px rgba(11,35,69,.22)}
.kpi.blue::before{display:none}
.kpi.blue .k-label{color:rgba(255,255,255,.75)}
.kpi.blue .k-big{color:#fff;font-size:24px}
.kpi.violet::before{background:#7c3aed}
.kpi.violet .k-label{color:#6d28d9}
.kpi.violet .k-list{font-size:11.5px}
.assump{display:grid;grid-template-columns:repeat(4,1fr);gap:0 26px;padding:12px 16px 13px}
@media(max-width:1000px){.assump{grid-template-columns:repeat(2,1fr)}}
.assump .a-row{display:flex;justify-content:space-between;gap:10px;padding:2.5px 0;border-bottom:1px dashed #edf1f8;font-size:11px}
.assump .a-row:last-child{border-bottom:0}
