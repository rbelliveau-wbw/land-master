<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Subdivision Milestone Gantt</title>
  <script src="https://static.zohocdn.com/creator/widgets/version/1.0/widgetsdk-min.js"></script>
  <script src="critical-error-reporter.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #eef1f7;
      --surface: #ffffff;
      --surface-2: #f5f7fb;
      --line: #dde3ef;
      --line-strong: #bec9dd;
      --text: #0f1b30;
      --text-2: #253858;
      --muted: #5a6e8c;
      --muted-2: #8fa0b8;
      /* Primary: deep navy from the app */
      --primary: #1e3a6e;
      --primary-dark: #152d56;
      --primary-bright: #2563eb;
      --primary-soft: #eaf0fb;
      --green: #0d7c52;
      --green-soft: #ecfdf5;
      /* Unsaved/dirty: teal instead of amber â€” complements navy */
      --dirty: #0e6674;
      --dirty-dark: #0a4f5a;
      --dirty-soft: #e6f6f8;
      --dirty-border: #a0d9e3;
      --red: #991b1b;
      --red-soft: #fef2f2;
      --today-tint: rgba(239, 68, 68, 0.05);
      --shadow-sm: 0 1px 3px rgba(15,23,42,.06), 0 1px 2px rgba(15,23,42,.04);
      --shadow: 0 4px 16px rgba(15,23,42,.07), 0 1px 4px rgba(15,23,42,.04);
      --radius: 12px;
      --side: 300px;
      --row-h: 56px;
      --day-w: 6px;
      --axis-h: 60px;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 14px;
      line-height: 1.5;
    }
    body { padding: 20px 24px 40px; }
    button, input, select { font: inherit; }
    button { border: 0; cursor: pointer; }

    /* â”€â”€ Page header â”€â”€ */
    .page-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 18px;
    }
    .title-block h1 {
      margin: 0;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -.3px;
      color: var(--text);
    }
    .title-block p {
      margin: 3px 0 0;
      font-size: 12.5px;
      color: var(--muted);
    }
    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #fff;
      color: var(--muted);
      font-size: 12px;
      font-weight: 500;
      white-space: nowrap;
      box-shadow: var(--shadow-sm);
    }
    .status-pill .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--muted-2); flex-shrink: 0; }
    .status-pill.ok { color: var(--green); background: var(--green-soft); border-color: #a7f3d0; }
    .status-pill.ok .dot { background: var(--green); }
    .status-pill.err { color: var(--red); background: var(--red-soft); border-color: #fca5a5; }
    .status-pill.err .dot { background: var(--red); }
    .status-pill.warn { color: var(--dirty); background: var(--dirty-soft); border-color: var(--dirty-border); }
    .status-pill.warn .dot { background: var(--dirty); }

    /* â”€â”€ Toolbar â”€â”€ */
    .toolbar {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      margin-bottom: 14px;
      overflow: hidden;
    }
    .toolbar-top {
      display: flex;
      align-items: flex-end;
      gap: 12px;
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
    }
    .field { flex: 1; min-width: 0; max-width: 360px; }
    .field label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .06em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 5px;
    }
    select {
      width: 100%;
      height: 36px;
      border: 1px solid var(--line-strong);
      border-radius: 8px;
      background: var(--surface-2);
      color: var(--text);
      padding: 0 10px;
      outline: none;
      font-size: 13.5px;
    }
    select:focus { border-color: #93b4fd; box-shadow: 0 0 0 3px rgba(29,78,216,.10); }

    /* Button groups */
    .btn-group {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-left: auto;
      flex-shrink: 0;
    }
    .btn-divider { width: 1px; height: 24px; background: var(--line); margin: 0 2px; }
    .btn {
      height: 36px;
      border-radius: 8px;
      padding: 0 14px;
      font-weight: 600;
      font-size: 13px;
      background: var(--surface-2);
      color: var(--text-2);
      border: 1px solid var(--line-strong);
      box-shadow: var(--shadow-sm);
      white-space: nowrap;
      transition: background .12s, box-shadow .12s;
    }
    .btn:hover { background: #edf2f7; }
    .btn.ghost {
      background: transparent;
      border-color: transparent;
      color: var(--muted);
      box-shadow: none;
    }
    .btn.ghost:hover { background: #eef2f7; color: var(--text); }
    .btn.primary {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
      box-shadow: 0 1px 4px rgba(30,58,110,.30);
    }
    .btn.primary:hover { background: var(--primary-dark); }
    .btn:disabled { opacity: .45; cursor: not-allowed; pointer-events: none; }

    .toolbar-bottom {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 16px;
      gap: 12px;
      flex-wrap: wrap;
    }
    .segmented {
      display: inline-flex;
      padding: 3px;
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: 9px;
      gap: 2px;
    }
    .segmented button {
      height: 28px;
      border-radius: 6px;
      padding: 0 12px;
      background: transparent;
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
      transition: background .1s, color .1s;
    }
    .segmented button.active {
      background: #fff;
      color: var(--primary);
      box-shadow: 0 1px 4px rgba(15,23,42,.09);
    }
    
    .summary {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }
    .summary .tag {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 999px;
      padding: 3px 10px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-2);
    }
    .summary .tag.blue { color: var(--primary); background: var(--primary-soft); border-color: #b3c6e8; }
    .summary .tag.amber { color: var(--dirty); background: var(--dirty-soft); border-color: var(--dirty-border); }
    .summary .tag.green { color: var(--green); background: var(--green-soft); border-color: #a7f3d0; }

    /* â”€â”€ Panel â”€â”€ */
    .panel {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
    }
    .panel-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
      padding: 12px 16px;
      border-bottom: 1px solid var(--line);
    }
    .panel-title-block { min-width: 0; }
    .panel-title { font-weight: 700; font-size: 13.5px; }
    .panel-sub { font-size: 12px; color: var(--muted); margin-top: 1px; }
    .legend {
      display: flex;
      gap: 14px;
      align-items: center;
      flex-wrap: wrap;
      color: var(--muted);
      font-size: 11.5px;
      font-weight: 500;
    }
    .legend-item { display: inline-flex; gap: 5px; align-items: center; }
    .legend-swatch {
      width: 22px; height: 8px; border-radius: 4px;
      background: var(--primary);
    }
    .legend-swatch.dirty { background: var(--dirty); }
    .legend-swatch.sync { background: linear-gradient(90deg, var(--primary), #7c3aed); }

    /* â”€â”€ Gantt shell â”€â”€ */
    .gantt-shell {
      position: relative;
      overflow: auto;
      max-height: calc(100vh - 240px);
      background: #fff;
    }
    .gantt-inner { min-width: 100%; position: relative; }
    .axis-row, .gantt-row {
      display: grid;
      grid-template-columns: var(--side) 1fr;
      min-width: max-content;
    }
    .sticky-left {
      position: sticky;
      left: 0;
      z-index: 5;
      background: #fff;
      border-right: 2px solid var(--line);
    }

    /* Axis */
    .axis-left {
      height: var(--axis-h);
      padding: 0 12px;
      border-bottom: 1px solid var(--line);
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: .07em;
      text-transform: uppercase;
      color: var(--muted-2);
      display: flex;
      align-items: flex-end;
      padding-bottom: 10px;
    }
    .axis {
      position: relative;
      height: var(--axis-h);
      border-bottom: 1px solid var(--line);
      background: #fff;
    }
    .months { height: 34px; position: relative; border-bottom: 1px solid var(--line); }
    .month {
      position: absolute;
      top: 0;
      height: 34px;
      border-right: 1px solid var(--line);
      display: flex;
      align-items: center;
      padding-left: 10px;
      font-size: 12.5px;
      font-weight: 700;
      color: var(--text-2);
      white-space: nowrap;
      overflow: hidden;
    }
    .ticks { position: relative; height: 26px; }
    .tick {
      position: absolute;
      top: 0;
      height: 26px;
      border-left: 1px solid var(--line);
      font-size: 10px;
      color: var(--muted-2);
      padding-left: 4px;
      display: flex;
      align-items: center;
      font-weight: 500;
      font-variant-numeric: tabular-nums;
    }

    /* Today */
    .today-col {
      position: absolute;
      top: 0;
      bottom: 0;
      z-index: 1;
      pointer-events: none;
    }
    .today-col-tint {
      position: absolute;
      top: 0; bottom: 0;
      background: var(--today-tint);
      width: calc(var(--day-w));
    }
    .today-line {
      position: absolute;
      top: 0; bottom: 0;
      width: 2px;
      background: #ef4444;
      z-index: 4;
    }
    .today-label {
      position: absolute;
      top: -26px;
      transform: translateX(-50%);
      background: #ef4444;
      color: #fff;
      font-size: 9.5px;
      font-weight: 700;
      padding: 2px 5px;
      border-radius: 4px;
      white-space: nowrap;
      letter-spacing: .04em;
    }

    /* Rows */
    .gantt-row {
      height: var(--row-h);
      min-height: var(--row-h);
      border-bottom: 1px solid #edf1f7;
    }
    .gantt-row:hover .row-label { background: #f8faff; }
    .gantt-row:hover .track { background-color: #fbfcff; }

    .row-label {
      height: var(--row-h);
      display: flex;
      align-items: center;
      padding: 0 12px;
      gap: 8px;
      overflow: hidden;
      transition: background .1s;
    }
    .row-index {
      flex: 0 0 24px;
      height: 24px;
      border-radius: 6px;
      background: var(--bg);
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .row-label.dirty .row-index { background: var(--dirty-soft); color: var(--dirty); }

    .link-btn {
      flex: 0 0 22px;
      width: 22px; height: 22px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fff;
      border: 1px solid var(--line);
      color: var(--muted-2);
      transition: all .12s;
    }
    .link-btn:hover:not(:disabled) { color: var(--primary); border-color: #8aaad0; background: var(--primary-soft); }
    .link-btn.active { color: #fff; background: var(--primary); border-color: var(--primary); box-shadow: 0 2px 6px rgba(30,58,110,.28); }
    .link-btn:disabled { opacity: .2; cursor: not-allowed; background: var(--surface-2); }
    .link-btn svg { width: 12px; height: 12px; display: block; }

    .sync-btn {
      flex: 0 0 22px; width: 22px; height: 22px;
      border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
      background: #f5f3ff; border: 1px solid #ddd6fe; color: #7c3aed;
    }
    .sync-btn svg { width: 13px; height: 13px; display: block; }

    .row-text { min-width: 0; flex: 1; }
    .row-name {
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--text);
      line-height: 1.3;
    }
    .row-sub {
      font-size: 11px;
      color: var(--muted);
      margin-top: 1px;
      font-variant-numeric: tabular-nums;
    }

    /* Track & bars */
    .track {
      position: relative;
      height: var(--row-h);
      background-image: linear-gradient(to right, rgba(210,220,235,.5) 1px, transparent 1px);
      background-size: calc(var(--day-w) * 7) 100%;
      transition: background-color .1s;
    }
    .bar {
      position: absolute;
      top: 10px;
      height: 32px;
      border-radius: 7px;
      background: linear-gradient(135deg, #2a5298, #1e3a6e);
      box-shadow: 0 2px 8px rgba(29,78,216,.20);
      color: #fff;
      display: flex;
      align-items: center;
      min-width: 24px;
      touch-action: none;
      user-select: none;
      cursor: grab;
      overflow: hidden;
      z-index: 3;
      transition: box-shadow .12s, filter .1s;
    }
    .bar:hover { box-shadow: 0 4px 14px rgba(30,58,110,.32); filter: brightness(1.07); }
    .bar:active { cursor: grabbing; filter: brightness(.97); }
    .bar.dirty {
      background: linear-gradient(135deg, #1a8fa8, #0e6674);
      box-shadow: 0 2px 8px rgba(14,102,116,.28);
    }
    .bar.dirty:hover { box-shadow: 0 4px 14px rgba(14,102,116,.40); }
    .bar.sync { outline: 2px solid rgba(124,58,237,.3); outline-offset: 1px; }

    .bar-text {
      font-size: 11.5px;
      font-weight: 600;
      padding: 0 10px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      pointer-events: none;
      display: flex;
      align-items: center;
      gap: 7px;
      min-width: 0;
      flex: 1;
    }
    .bar-name { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
    .bar-date {
      font-size: 10px;
      font-weight: 500;
      opacity: .85;
      padding-left: 7px;
      border-left: 1px solid rgba(255,255,255,.3);
      flex-shrink: 0;
      font-variant-numeric: tabular-nums;
    }
    .bar-sync {
      display: inline-flex; align-items: center; justify-content: center;
      width: 16px; height: 16px;
      border-radius: 999px;
      background: rgba(255,255,255,.2);
      border: 1px solid rgba(255,255,255,.35);
      font-size: 10px;
      flex-shrink: 0;
