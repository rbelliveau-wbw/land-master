<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Land Master Settings</title>
<script src="https://static.zohocdn.com/creator/widgets/version/2.0/widgetsdk-min.js"></script>
<script src="runtime-context.js"></script>
<script src="creator-data.js"></script>
<script src="settings-controller.js"></script>
<script src="critical-error-reporter.js"></script>
<style>
/* ── TOKENS ── aligned with Contract Management / Pro Forma Manager ── */
:root{
  --bg:#f0f3f7; --surface:#e8ecf1; --card:#fff;
  --line:#dde4ef; --line-strong:#c8d4e5;
  --text:#0f2744; --muted:#5c7394; --faint:#8ea0bd;
  --navy:#0b2345; --navy-soft:rgba(11,35,69,.08);
  --primary:#1e40af; --primary-2:#2563eb; --ptint:#eef4ff; --psoft:#e8f0fb;
  --green:#047857; --green-bg:#ecfdf5;
  --amber:#b45309; --amber-bg:#fffbeb;
  --red:#b91c1c; --red-bg:#fef2f2;
  --violet:#3730a3; --violet-bg:#e0e7ff;
  --r:10px; --rsm:6px;
  --shadow:0 2px 8px rgba(30,64,175,.06),0 1px 2px rgba(0,0,0,.03);
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;overflow:hidden}
body{display:flex;flex-direction:column;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:13px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}

/* ── HEADER ── */
.hdr{flex:0 0 auto;background:var(--navy);color:#fff;padding:12px 18px;
  display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.hdr h1{margin:0;font-size:15px;font-weight:650;letter-spacing:.2px}
.hdr .sub{font-size:11.5px;color:#a9bcd6;font-weight:400}
.spacer{flex:1 1 auto}
.dot{width:8px;height:8px;border-radius:50%;background:#64748b;display:inline-block;flex:0 0 auto}
.dot.live{background:#34d399;box-shadow:0 0 0 3px rgba(52,211,153,.2)}
.dot.error{background:#f87171;box-shadow:0 0 0 3px rgba(248,113,113,.2)}
.dot.saving{background:#fbbf24;box-shadow:0 0 0 3px rgba(251,191,36,.2)}
.mode{display:flex;align-items:center;gap:7px;font-size:11.5px;color:#c9d8ea}
.hbtn{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);color:#fff;
  padding:5px 11px;border-radius:var(--rsm);cursor:pointer;font-size:12px;
  display:inline-flex;align-items:center;gap:6px;transition:background .15s}
.hbtn:hover{background:rgba(255,255,255,.2)}
.hbtn:disabled{opacity:.45;cursor:default}

/* ── SECTION TABS ── segmented control, house style (docs/widget-ui-style.md) ── */
.navbar{flex:0 0 auto;background:var(--card);border-bottom:1px solid var(--line);
  padding:9px 18px;overflow-x:auto;scrollbar-width:thin;white-space:nowrap}
.tabs{display:inline-flex;border:1px solid;border-radius:9px;gap:3px;padding:4px;background:linear-gradient(180deg,#f7f9fc 0%,#e9eef6 100%);border-color:#d4deeb;box-shadow:inset 0 1px 0 rgba(255,255,255,.96),0 3px 10px rgba(15,39,68,.07)}
.tab{border:0;background:none;border-radius:6px;padding:6px 13px;cursor:pointer;color:var(--muted);
  font-size:12.5px;white-space:nowrap;font-weight:750;transition:background-color .18s ease,color .18s ease,box-shadow .18s ease,transform .18s ease}
.tab:hover{color:var(--navy);background:rgba(255,255,255,.88);box-shadow:0 2px 5px rgba(15,39,68,.08);transform:translateY(-1px)}
.tab.active{color:#fff;background:linear-gradient(145deg,#163f77,#0b2345);box-shadow:0 4px 10px rgba(11,35,69,.25),inset 0 1px 0 rgba(255,255,255,.18);text-shadow:0 1px 1px rgba(0,0,0,.12);transform:translateY(-1px)}
.tab:active{transform:translateY(0)}
.tab:focus-visible{outline:2px solid var(--primary-2);outline-offset:2px}

/* ── SCROLL CONTAINER (must be a sized flex column with its own overflow) ── */
#view{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;padding:18px;
  display:flex;flex-direction:column;gap:16px;scroll-behavior:smooth}
.wrap{max-width:1080px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:16px}

/* ── BANNERS ── */
.banner{border-radius:var(--r);padding:12px 15px;display:flex;gap:11px;align-items:flex-start;
  font-size:12.5px;border:1px solid}
.banner .ico{flex:0 0 auto;font-size:15px;line-height:1.25}
.banner b{display:block;margin-bottom:2px;font-size:13px}
.banner.ok{background:var(--green-bg);border-color:#a7f3d0;color:var(--green)}
.banner.warn{background:var(--amber-bg);border-color:#fde68a;color:var(--amber)}
.banner.bad{background:var(--red-bg);border-color:#fecaca;color:var(--red)}
.banner.info{background:var(--ptint);border-color:#c7d9f5;color:var(--primary)}
.banner code{background:rgba(0,0,0,.06);padding:1px 5px;border-radius:4px;font-size:11.5px}
.banner ul{margin:6px 0 0;padding-left:18px}
.banner a{color:inherit}

/* ── CARDS ── */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--shadow);overflow:hidden}
.card>header{padding:13px 16px;border-bottom:1px solid var(--line);background:#fbfcfe;
  display:flex;align-items:center;gap:10px}
.card>header h2{margin:0;font-size:13.5px;font-weight:650;color:var(--navy)}
.card>header .blurb{font-size:11.5px;color:var(--muted);font-weight:400}
.card .body{padding:16px}

/* ── FIELD ROWS ── */
.frow{display:grid;grid-template-columns:230px 1fr 26px;gap:14px;align-items:start;
  padding:11px 0;border-bottom:1px dashed var(--line)}
.frow:last-child{border-bottom:0}
.frow>.lab{padding-top:6px}
.frow .lab .name{font-weight:600;font-size:12.5px;color:var(--text);display:flex;align-items:center;gap:6px}
.frow .lab .hint{font-size:11px;color:var(--muted);margin-top:3px;line-height:1.45}
.frow .ctl{min-width:0}
.frow .tick{padding-top:8px;text-align:center}

input[type=text],input[type=number],input[type=date],select,textarea{
  width:100%;padding:7px 10px;border:1px solid var(--line-strong);border-radius:var(--rsm);
  background:#fff;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--primary-2);
  box-shadow:0 0 0 3px rgba(37,99,235,.12)}
input:disabled,select:disabled,textarea:disabled{background:var(--surface);color:var(--faint)}
textarea{resize:vertical;min-height:70px}
textarea.tall{min-height:320px;line-height:1.55;overflow:hidden;resize:none}
.affix{position:relative;display:block}
.affix>input{padding-left:26px}
.affix.suf>input{padding-left:10px;padding-right:28px}
.affix>.sym{position:absolute;top:50%;transform:translateY(-50%);left:10px;
  color:var(--faint);font-size:12px;pointer-events:none}
.affix.suf>.sym{left:auto;right:11px}
.narrow{max-width:210px}
.mid{max-width:340px}

/* ── TOGGLE ── */
.tog{display:inline-flex;align-items:center;gap:10px;cursor:pointer;user-select:none}
.tog input{position:absolute;opacity:0;width:0;height:0}
.tog .track{width:40px;height:22px;border-radius:11px;background:#cbd5e1;position:relative;
  transition:background .18s;flex:0 0 auto}
.tog .track::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;
  border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .18s}
.tog input:checked+.track{background:var(--primary-2)}
.tog input:checked+.track::after{transform:translateX(18px)}
.tog input:focus-visible+.track{box-shadow:0 0 0 3px rgba(37,99,235,.25)}
.tog .txt{font-size:12.5px;color:var(--muted)}
.tog.danger input:checked+.track{background:var(--amber)}
.frow.hot{background:var(--amber-bg);margin:0 -16px;padding-left:16px;padding-right:16px}

/* ── EMAIL CHIPS ── */
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:6px;border:1px solid var(--line-strong);
  border-radius:var(--rsm);background:#fff;min-height:38px;align-items:center}
.chips:focus-within{border-color:var(--primary-2);box-shadow:0 0 0 3px rgba(37,99,235,.12)}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--psoft);color:var(--primary);
  border:1px solid #c7d9f5;border-radius:20px;padding:3px 5px 3px 10px;font-size:11.5px;max-width:100%}
.chip.bad{background:var(--red-bg);border-color:#fecaca;color:var(--red)}
.chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip button{background:rgba(0,0,0,.08);border:0;border-radius:50%;width:16px;height:16px;
  cursor:pointer;line-height:1;font-size:11px;color:inherit;flex:0 0 auto;padding:0}
.chip button:hover{background:rgba(0,0,0,.18)}
.chips input{border:0;flex:1 1 120px;min-width:120px;padding:4px 6px;background:none}
.chips input:focus{outline:0;box-shadow:none}

/* ── MULTI-SELECT (searchable) ── */
.msel{border:1px solid var(--line-strong);border-radius:var(--rsm);background:#fff;overflow:hidden}
.msel .selbar{display:flex;flex-wrap:wrap;gap:6px;padding:7px 9px;cursor:pointer;
  align-items:center;min-height:38px}
.msel .selbar:hover{background:#fbfcfe}
.msel .ph{color:var(--faint);font-size:12px}
.msel .caret{margin-left:auto;color:var(--faint);font-size:10px;transition:transform .18s}
.msel.open .caret{transform:rotate(180deg)}
.msel .pop{display:none;border-top:1px solid var(--line);background:#fff}
.msel.open .pop{display:block}
.msel .pop .search{padding:8px 9px;border-bottom:1px solid var(--line);background:#fbfcfe}
.msel .pop .search input{padding:6px 9px}
.msel .opts{max-height:240px;overflow-y:auto}
.msel .opt{display:flex;gap:9px;align-items:flex-start;padding:8px 11px;cursor:pointer;
  border-bottom:1px solid #f1f5f9;font-size:12.5px}
.msel .opt:last-child{border-bottom:0}
.msel .opt:hover,.msel .opt.cur{background:var(--ptint)}
.msel .opt .box{width:15px;height:15px;border:1.5px solid var(--line-strong);border-radius:4px;
  flex:0 0 auto;margin-top:1px;display:flex;align-items:center;justify-content:center;
  font-size:10px;color:#fff;line-height:1}
.msel .opt.on .box{background:var(--primary-2);border-color:var(--primary-2)}
.msel .opt .meta{font-size:11px;color:var(--muted);margin-top:1px}
.msel .empty{padding:14px;text-align:center;color:var(--faint);font-size:12px}

/* ── TABLE (Construction Curve) ── */
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--rsm)}
table{border-collapse:collapse;width:100%;min-width:720px;font-size:12.5px}
th{background:#f6f8fb;text-align:left;padding:8px 10px;font-weight:600;color:var(--muted);
  font-size:11px;text-transform:uppercase;letter-spacing:.4px;border-bottom:1px solid var(--line);
  white-space:nowrap;position:sticky;top:0;z-index:1}
td{padding:6px 10px;border-bottom:1px solid #f1f5f9;vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:#fbfcfe}
td input,td select{padding:5px 8px}
.grp td{background:var(--surface);font-weight:600;color:var(--navy);font-size:11.5px;
  border-top:1px solid var(--line-strong)}
.pill{display:inline-block;padding:1px 8px;border-radius:20px;font-size:10.5px;font-weight:600;
  border:1px solid}
.pill.ok{background:var(--green-bg);border-color:#a7f3d0;color:var(--green)}
.pill.off{background:var(--amber-bg);border-color:#fde68a;color:var(--amber)}
.iconbtn{background:none;border:1px solid transparent;border-radius:var(--rsm);width:26px;height:26px;
  cursor:pointer;color:var(--faint);line-height:1;font-size:13px;padding:0}
.iconbtn:hover{background:var(--red-bg);color:var(--red);border-color:#fecaca}

/* ── BUTTONS ── */
.btn{background:var(--card);border:1px solid var(--line-strong);border-radius:var(--rsm);
  padding:6px 13px;cursor:pointer;font-size:12.5px;font-weight:500;
  display:inline-flex;align-items:center;gap:6px;transition:background .15s,border-color .15s}
.btn:hover{background:var(--ptint);border-color:var(--primary-2);color:var(--primary)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.primary:hover{background:var(--primary-2);border-color:var(--primary-2);color:#fff}
.btn:disabled{opacity:.45;cursor:default}
.btn:disabled:hover{background:var(--card);border-color:var(--line-strong);color:inherit}

/* ── SAVE TICK ── distinct names: `.ok` is already a banner/pill modifier ── */
.stick{display:inline-block;width:18px;height:18px;border-radius:50%;background:var(--green);
  color:#fff;text-align:center;line-height:18px;font-size:11px;
  opacity:0;transform:scale(.5);transition:opacity .2s,transform .2s}
.stick.show{opacity:1;transform:scale(1);animation:pop .35s ease-out}
@keyframes pop{0%{transform:scale(.5)}55%{transform:scale(1.18)}100%{transform:scale(1)}}
.sfail{display:inline-block;width:18px;height:18px;border-radius:50%;background:var(--red);
  color:#fff;text-align:center;line-height:18px;font-size:11px}
.frow.failed input,.frow.failed select,.frow.failed textarea,
.frow.failed .chips,.frow.failed .msel{border-color:var(--red)}

/* ── TOAST ── */
#toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,16px);
  background:var(--navy);color:#fff;padding:10px 18px;border-radius:22px;font-size:12.5px;
  box-shadow:0 8px 24px rgba(11,35,69,.28);opacity:0;pointer-events:none;
  transition:opacity .2s,transform .2s;max-width:80%;text-align:center;z-index:60}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast.bad{background:var(--red)}

/* ── MISC ── */
.skel{background:linear-gradient(90deg,#e9eef5 25%,#f3f6fa 50%,#e9eef5 75%);
  background-size:200% 100%;animation:sh 1.3s infinite;border-radius:var(--rsm);height:14px}
@keyframes sh{0%{background-position:200% 0}100%{background-position:-200% 0}}
.muted{color:var(--muted)}
.tiny{font-size:11px}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px}
.jobs{margin:8px 0 0;padding-left:16px;columns:2;column-gap:22px}
.jobs li{margin-bottom:2px;break-inside:avoid}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:12px 20px}
.pcell .name{font-weight:600;font-size:12px;margin-bottom:4px;display:flex;align-items:center;
  justify-content:space-between;gap:6px}
.foot{padding:4px 2px 20px;text-align:center;color:var(--faint);font-size:11px}
@media(max-width:760px){
  .frow{grid-template-columns:1fr 26px;gap:6px}
  .frow>.lab{padding-top:0;grid-column:1/2}
  .frow .ctl{grid-column:1/2}
  .frow .tick{grid-column:2/3;grid-row:1/2}
  .jobs{columns:1}
}

#settings-recovery{flex:0 0 auto;display:flex;align-items:center;gap:12px;padding:8px 18px;background:var(--amber-bg);border-top:1px solid #fde68a;color:var(--amber)}
#settings-recovery[hidden],#curve-dialog[hidden]{display:none}
.chip button,.iconbtn,.stick{display:inline-flex;align-items:center;justify-content:center}
.chip button svg{width:11px;height:11px}.stick svg{width:12px;height:12px}.iconbtn svg{width:16px;height:16px}
.msel[aria-disabled=true]{opacity:.6}.msel[aria-disabled=true] .selbar,.msel[aria-disabled=true] .opt{cursor:default}
.settings-overlay{position:fixed;inset:0;background:rgba(11,35,69,.4);display:flex;align-items:center;justify-content:center;padding:20px;z-index:100}
.settings-dialog{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 20px 60px rgba(11,35,69,.24);width:min(450px,100%);padding:20px}
.settings-dialog header{display:flex;align-items:center;justify-content:space-between;gap:12px}.settings-dialog h2{font-size:16px;margin:0}.settings-dialog footer{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}
.settings-dialog .iconbtn{color:var(--muted)}
</style>
</head>
<body>

<div class="hdr">
  <h1>Settings</h1>
  <span class="sub" id="hsub">Land Master · single configuration record</span>
  <span class="spacer"></span>
  <span class="mode"><span class="dot" id="dot"></span><span id="mode">Starting…</span></span>
  <button class="hbtn" id="reload" title="Read a fresh snapshot after local edits are verified">↻ Reload</button>
  <button class="hbtn" id="openrec" title="Open this record in Creator's native form">↗ Open in Creator</button>
</div>

<div class="navbar"><div class="tabs" id="nav"></div></div>

<div id="view">
  <div class="wrap" id="wrap">
    <div class="card"><div class="body">
      <div class="skel" style="width:40%;margin-bottom:10px"></div>
      <div class="skel" style="width:75%;margin-bottom:10px"></div>
      <div class="skel" style="width:60%"></div>
    </div></div>
  </div>
</div>

<div id="toast"></div>
<div id="settings-recovery" role="status" aria-live="polite" hidden></div>
<div id="curve-dialog" hidden></div>

<script>
(function(){
"use strict";

var SMW_VERSION = "1.3.7";

/* ══════════════ CONFIG ══════════════ */
var CFG = {
  version: SMW_VERSION,
  form: "Settings",
  report: "All_Settings",
  curveForm: "Construction_Curve",
  curveReport: "All_Construction_Curves",
  curveParentField: "Settings",
  approvalsReport: "All_Contract_Approvals",
  actionsReport: "All_Contract_Actions",
  proformaReport: "All_Pro_Formas",
  pageSize: 200,
  maxPages: 25,
  saveDebounceMs: 700,
  /* Scheduled workflows anchored on Settings.Next_Workflow_Run — surfaced in the UI so
     nobody edits that field without knowing what it reschedules. */
  jobs: [
    "Test Add Hours",
    "Set Close Date - Lots",
    "Update Sold/Contracted - Forecast Year",
    "Update Actual Lots - Forecast",
    "Check for Stuck Budget Approvals",
    "Update Budgets w/ Projects Info - Budget"
  ]
};

/* ══════════════ FIELD SCHEMA ══════════════
   Verified live 2026-08-27 against the Settings record-edit DOM. Anything on the record
   that is NOT listed here still renders, under "Other fields" — so a field added to the
   Creator form later is never silently hidden by this widget.                            */
var GROUPS = [
  { key:"automation", title:"Automation & Scheduling",
    blurb:"Next Workflow Run is the anchor every nightly job starts from.",
    fields:[
      { n:"Next_Workflow_Run", l:"Next Workflow Run", t:"datetime", jobs:true,
        hint:"Start anchor for the daily scheduled workflows (America/Chicago)." },
      { n:"Approval_Reminder_Interval_Days", l:"Approval Reminder Interval", t:"int", suffix:"days",
        hint:"How long to wait between approval reminder emails. Falls back to 3 when blank or 0." },
      { n:"Next_Approval_Reminder_Date", l:"Next Approval Reminder Date", t:"date",
        hint:"The daily reminder job stays silent until this date, then pushes it forward by the interval." }
    ]},
  { key:"forecasting", title:"Forecasting",
    blurb:"Global unlock switches. Both are off in normal operation.",
    fields:[
      { n:"Open_Forecasting_Window", l:"Open Forecasting Window", t:"bool", danger:true,
        hint:"Allows editing for current and future month forecasting." },
      { n:"Unlock_All_Forecasts", l:"Unlock All Forecasts", t:"bool", danger:true,
        hint:"Unlocks all the fields in Forecasts and Forecast Years, also prevents hiding." }
    ]},
  { key:"contracts", title:"Contracts & Legal",
    blurb:"Who gets legal mail, and which rows seed a new builder contract.",
    fields:[
      { n:"Receive_Legal_Notifications", l:"Legal Notification Recipients", t:"emails",
        hint:"Stored as one comma-separated string. Type an address and press Enter." },
      { n:"Builder_Approval_Template", l:"Builder Approval Template", t:"multi", src:"approvals",
        hint:"Contract Approvals rows (template = Builder) copied onto a new builder contract." },
      { n:"Builder_Contract_Action_Template", l:"Builder Contract Action Template", t:"multi", src:"actions",
        hint:"Checked Template Action rows copied onto a new builder contract." }
    ]},
  { key:"budget", title:"Budget",
    fields:[
      { n:"COO_Approval_Threshold", l:"COO Approval Threshold", t:"money",
        hint:"Spend above this amount requires COO approval." },
      { n:"Multi_Line", l:"Multi Line", t:"text",
        hint:"Free-text field on the Budget section of the form." }
    ]},
  { key:"defaults", title:"Pro Forma Defaults", percentGrid:true,
    blurb:"Percentage defaults applied to new pro formas.",
    fields:[
      { n:"Capital_Cost",           l:"Capital Cost",           t:"pct" },
      { n:"Points",                 l:"Points",                 t:"pct" },
      { n:"Admin_Cost",             l:"Admin Cost",             t:"pct" },
      { n:"Engineering_Markup",     l:"Engineering Markup",     t:"pct" },
      { n:"Engineering_Sub_Markup", l:"Engineering Sub Markup", t:"pct" },
      { n:"Construction_Markup",    l:"Construction Markup",    t:"pct" },
      { n:"Construction_Sub_Markup",l:"Construction Sub Markup",t:"pct" },
      { n:"Profit_Share",           l:"Profit Share",           t:"pct" }
    ]},
  { key:"aireview", title:"AI Review",
    blurb:"What the AI Check button on a pro forma measures against.",
    fields:[
      { n:"PF_Review_Criteria", l:"Review Criteria", t:"text", tall:true,
        placeholder:"Deal killers. Must-haves. Thresholds. The questions you always ask.",
        hint:"Sent to the model verbatim on every check. Bullets welcome; the box grows as you type." },
      { n:"PF_Review_Provider", l:"Provider", t:"line", placeholder:"openai",
        hint:"openai is the only provider wired so far." },
      { n:"PF_Review_Model", l:"Model", t:"line", placeholder:"gpt-5.6-luna",

/* ══════════════ VALUE COERCION ══════════════ */
function relId(v){
  /* A Creator lookup arrives as {ID,zc_display_value}, a bare id, or a display string. */
  if(v==null||v==="") return "";
  if(typeof v==="object"){ return str(v.ID||v.id||""); }
  return str(v);
}
function relLabel(v){
  if(v&&typeof v==="object") return str(v.zc_display_value||v.display_value||v.ID||"");
  return str(v);
}
function multiIds(v){
  /* Multi-select lookups come back as an array, or a @#zoho-comma#@ / comma delimited string. */
  if(v==null||v==="") return [];
  if(Array.isArray(v)) return v.map(relId).filter(Boolean);
  var s=String(v);
  var parts = s.indexOf("@#zoho-comma#@")>=0 ? s.split("@#zoho-comma#@") : s.split(",");
  return parts.map(function(x){ return x.trim(); }).filter(Boolean);
}
function numStr(v){
  /* Strip currency/percent formatting so Creator gets a clean number. */
  var s=str(v).replace(/[,$%\s]/g,"");
  return s;
}
function boolOf(v){
  if(v===true||v===false) return v;
  var s=str(v).trim().toLowerCase();
  return s==="true"||s==="yes"||s==="1";
}
function fmtMoney(v){
  var s=numStr(v);
  if(s==="") return "";
  var n=Number(s);
  if(!isFinite(n)) return str(v);
  return n.toLocaleString("en-US",{minimumFractionDigits:0,maximumFractionDigits:2});
}
/* Creator's date inputs use MM/dd/yyyy; <input type=date> needs yyyy-MM-dd. */
function toIsoDate(v){
  var s=str(v).trim(); if(!s) return "";
  var m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  if(m) return m[3]+"-"+("0"+m[1]).slice(-2)+"-"+("0"+m[2]).slice(-2);
  m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  return m?m[0]:"";
}
function fromIsoDate(v){
  var s=str(v).trim(); if(!s) return "";
  var m=s.match(/^(\d{4})-(\d{2})-(\d{2})$/);
  return m?(m[2]+"/"+m[3]+"/"+m[1]):s;
}
/* Datetime round-trip: Creator stores "MM/dd/yyyy hh:mm:ss AM/PM". */
function splitDateTime(v){
  var s=str(v).trim();
  var m=s.match(/^(\d{1,2}\/\d{1,2}\/\d{4})\s+(.*)$/);
  if(m) return {d:m[1], t:m[2]};
  return {d:s, t:""};
}
function to24(t){
  var m=str(t).trim().match(/^(\d{1,2}):(\d{2})(?::(\d{2}))?\s*([AaPp][Mm])?$/);
  if(!m) return "";
  var h=parseInt(m[1],10), mi=m[2], ap=m[4]?m[4].toUpperCase():"";
  if(ap==="PM"&&h<12) h+=12;
  if(ap==="AM"&&h===12) h=0;
  return ("0"+h).slice(-2)+":"+mi;
}
function to12(hhmm,secs){
  var m=str(hhmm).match(/^(\d{1,2}):(\d{2})$/);
  if(!m) return "";
  var h=parseInt(m[1],10), mi=m[2], ap=h>=12?"PM":"AM";
  var h12=h%12; if(h12===0) h12=12;
  return h12+":"+mi+":"+(secs||"00")+" "+ap;
}

/* Creator stores datetimes as "MM/dd/yyyy hh:mm:ss AM/PM" — build one for right now. */
function nowStamp(){
  var d=new Date(), p=function(n){ return ("0"+n).slice(-2); };
  var h=d.getHours(), ap=h>=12?"PM":"AM", h12=h%12||12;
  return p(d.getMonth()+1)+"/"+p(d.getDate())+"/"+d.getFullYear()
    + " "+h12+":"+p(d.getMinutes())+":"+p(d.getSeconds())+" "+ap;
}
/* Tall textareas grow with their content (a criteria list can run to dozens of bullets),
   so nothing is ever hidden behind a scrollbar. Height is re-measured on every keystroke,
   paste, render and window resize. */
function grow(el){
  if(!el) return;
  el.style.height="auto";
  el.style.height=(el.scrollHeight+2)+"px";
}
function growAll(){
  Array.prototype.forEach.call(document.querySelectorAll("textarea.tall"),grow);
}
window.addEventListener("resize",growAll);

/* queue() does not re-render, so push the new stamp into its own two inputs by hand. */
function syncStampRow(field,val){
  var row=document.querySelector('[data-frow="'+field+'"]'); if(!row) return;
  var p=splitDateTime(val);
  var d=row.querySelector('[data-t="dt-d"]'), t=row.querySelector('[data-t="dt-t"]');
  if(d) d.value=toIsoDate(p.d);
  if(t) t.value=to24(p.t);
}

var CHECK_SVG='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><path d="m5 12 4 4L19 6"/></svg>';
var CLOSE_SVG='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>';
var inferredFields={};
var Controller=LMSettings.create({state:S,config:CFG,field:findField,date:toIsoDate,
  curveField:function(n){return CURVE_COLS.filter(function(c){return c.n===n;})[0];},
  onChange:function(event,detail){
    if(event==="resource-error")console.warn("Settings resource unavailable "+JSON.stringify(detail));
    if(event==="saved") showTick(detail);
    if(event==="queued") patchFieldStatus(detail);
    if(event==="save-error"){
      Object.keys(S.drafts).forEach(patchFieldStatus);
      toast(detail.message,true);
      if(window.LMCriticalErrors&&!detail.validation)LMCriticalErrors.breadcrumb("error","Settings save unverified",{error:detail.message,code:detail.code},true);
    }
    if(event==="blocked") toast(detail,true);
    if(event==="loaded"){
      $("hsub").textContent="Land Master · record "+S.recId;
      var missing=missingFields();if(missing.length)S.loadError+=(S.loadError?" · ":"")+"Unavailable fields: "+missing.join(", ");
      LMPerf.mark("settings:data-ready",{records:S.recCount,curves:S.curve.length});
      render();LMPerf.mark("first-usable");
      if(S.recCount>1&&window.LMCriticalErrors)LMCriticalErrors.breadcrumb("error","Multiple Settings records detected",{count:S.recCount},true);
    }
    if(event==="load-error"){
      if(S.rec)render();else $("wrap").innerHTML='<div class="banner bad"><div><b>Could not load Settings</b>'+esc(detail.message)+'</div></div>';
      diag("Settings load failed",detail);
    }
    if(event==="curve-error")toast(detail.message,true);
    if(event==="curve-saved"){render();toast(detail.kind==="delete"?"Row deleted":detail.kind==="add"?"Row added":"Curve row saved");}
    if(event==="discarded"){
      if(!Controller.hasDrafts())render();
      else detail.forEach(patchPersistedField);
    }
    syncControls();syncRecovery();syncMode();
  }
});
function queue(field,value){return Controller.queue(field,value);}
function flush(){return Controller.flush();}
function patchFieldStatus(field){
  var row=document.querySelector('[data-frow="'+field+'"]');if(!row)return;
  var draft=S.drafts[field],t=row.querySelector(".tick");
  row.classList.toggle("failed",!!(draft&&draft.error));
  if(t)t.innerHTML=draft?'<span class="'+(draft.error?'sfail':'muted')+'" title="'+esc(draft.error||"Unsaved")+'">'+(draft.error?'!':'…')+'</span>':"";
}
function showTick(field){
  var row=document.querySelector('[data-frow="'+field+'"]');if(!row)return;
  row.classList.remove("failed");var t=row.querySelector(".tick");if(!t)return;
  t.innerHTML='<span class="stick show" title="Verified saved">'+CHECK_SVG+'</span>';
  setTimeout(function(){var s=t.querySelector(".stick");if(s)s.classList.remove("show");},1900);
}
function patchPersistedField(field){
  var row=document.querySelector('[data-frow="'+field+'"]');if(!row)return;
  var definition=findField(field)||{},value=curVal(field),control=row.querySelector('[data-f]');
  if(definition.t==="multi"&&definition.src)row.querySelector(".ctl").innerHTML=multiSelect(definition,value);
  else if(definition.t==="emails")row.querySelector(".ctl").innerHTML=emailChips(definition,value);
  else if(definition.t==="datetime")syncStampRow(field,value);
  else if(control){
    if(definition.t==="bool")control.checked=boolOf(value);
    else control.value=definition.t==="money"?fmtMoney(value):definition.t==="date"?toIsoDate(value):Array.isArray(value)?multiIds(value).join(","):value&&typeof value==="object"?relId(value):str(value);
  }
  patchFieldStatus(field);
}
function syncMode(){
  if(S.refreshing){setMode("Loading…","");return;}
  if(S.curveBusy||S.inflight){setMode("Checking save…","saving");return;}
  if(S.uncertain||S.curveUncertain){setMode("Needs recheck","error");return;}
  if(Object.keys(S.failed).length){setMode("Save failed","error");return;}
  if(Object.keys(S.drafts).length){setMode("Unsaved changes","saving");return;}
  if(S.demo){setMode("Preview (read only)","");return;}
  if(!S.live||S.loadBlocked){setMode("Unavailable","error");return;}
  setMode(S.recCount>1?"Duplicate records":"Connected",S.recCount>1?"error":"live");
}
function syncControls(){
  var editable=Controller.canEdit();
  Array.prototype.forEach.call(document.querySelectorAll('[data-f],[data-chipinput]'),function(el){
    var field=el.getAttribute("data-f")||el.getAttribute("data-chipinput");el.disabled=!Controller.canEdit(field);
  });
  Array.prototype.forEach.call(document.querySelectorAll('[data-msel]'),function(el){var disabled=!Controller.canEdit(el.getAttribute("data-msel"));el.setAttribute("aria-disabled",String(disabled));if(disabled)el.classList.remove("open");});
  Array.prototype.forEach.call(document.querySelectorAll('[data-unpick],[data-rmchip]'),function(el){var row=el.closest('[data-frow]');el.disabled=!row||!Controller.canEdit(row.getAttribute("data-frow"));});
  Array.prototype.forEach.call(document.querySelectorAll('[data-cf],[data-delcurve],#addCurve'),function(el){
    var field=el.getAttribute("data-cf"),definition=CURVE_COLS.filter(function(c){return c.n===field;})[0];
    el.disabled=!Controller.curveAllowed()||!!(definition&&definition.t==="look"&&S.resources[definition.src]!=="ready");
  });
  var starter=document.querySelector('[data-import-starter]');if(starter)starter.disabled=!Controller.canEdit("Plat_Review_Criteria");
  $("reload").disabled=S.refreshing||!!S.inflight||!!S.curveBusy||Controller.hasDrafts();
  $("openrec").disabled=!editable||!!S.inflight||Controller.hasDrafts();
  Array.prototype.forEach.call($("nav").querySelectorAll("button"),function(button){button.disabled=S.refreshing||!!S.curveBusy;});
}
function syncRecovery(){
  var host=$("settings-recovery"),needs=!!(S.uncertain||S.curveUncertain||Object.keys(S.failed).length);
  host.hidden=!needs;if(!needs)return;
  var discard=!S.uncertain&&(!S.curveUncertain||S.curveUncertain.outcome==="rejected");
  host.innerHTML='<span>Unverified edits are retained.</span><button class="btn" data-recheck '+((S.inflight||S.curveBusy)?'disabled':'')+'>Recheck saved values</button>'+(discard?'<button class="btn" data-discard-rejected '+((S.inflight||S.curveBusy)?'disabled':'')+'>Discard rejected edits</button>':'');
  host.querySelector('[data-recheck]').onclick=function(){var task=S.curveUncertain?Controller.recheckCurve():Controller.recheck();task.catch(function(e){toast(e.message,true);});};
  if(discard)host.querySelector('[data-discard-rejected]').onclick=function(){Controller.discardRejected();};
}

  html+='<div class="foot">Settings Manager v'+esc(CFG.version)
      + ' · record <span class="mono">'+esc(S.recId||"—")+'</span>'
      + ' · changes save automatically</div>';

  growAll();

function guardBanner(){

    return '<div class="banner bad"><span class="ico">⛔</span><div>'
      + '<b>'+S.recCount+' Settings records exist — only one is allowed</b>'

      + 'record and will now pick one arbitrarily.'
      + '<ul>'+S.extras.map(function(r){
          return '<li><span class="mono">'+esc(r.ID)+'</span>'+(String(r.ID)===String(S.recId)?' — being edited here':' — <b>delete this one</b>')+'</li>';
        }).join("")+'</ul>'

      + '</div></div>';

  return '<div class="banner ok"><span class="ico">✓</span><div>'
    + '<b>One Settings record — as it should be</b>'

function groupCard(g){
  var h='<div class="card" id="sec-'+esc(g.key)+'"><header><h2>'+esc(g.title)+'</h2>'
       + (g.blurb?'<span class="blurb">'+esc(g.blurb)+'</span>':'')
       + '</header><div class="body">';
  if(g.percentGrid){
    var blank=g.fields.filter(function(f){ return numStr(curVal(f.n))===""; }).length;
    if(blank) h+='<div class="banner warn" style="margin-bottom:14px"><span class="ico">•</span><div>'
      + '<b>'+blank+' of '+g.fields.length+' defaults are blank</b>'
      + 'Blank defaults are read as zero wherever a pro forma falls back to them.</div></div>';
    h+='<div class="grid2">'+g.fields.map(pctCell).join("")+'</div>';
  } else {
    h+=g.fields.map(fieldRow).join("");
  }
  return h+'</div></div>';

function curVal(name){ return Controller.value(name); }

function fieldRow(f){
  var ctl="";
  var v=curVal(f.n);
  switch(f.t){
    case "bool":{
      var on=boolOf(v);
      ctl='<label class="tog'+(f.danger?" danger":"")+'"><input type="checkbox" data-f="'+esc(f.n)+'" data-t="bool"'
        + (on?" checked":"")+'/><span class="track"></span>'
        + '<span class="txt">'+(on?(f.danger?"On — unlocked":"On"):"Off")+'</span></label>';
      break; }
    case "date":
      ctl='<input class="narrow" type="date" data-f="'+esc(f.n)+'" data-t="date" value="'+esc(toIsoDate(v))+'"/>';
      break;
    case "datetime":{
      var p=splitDateTime(v);
      ctl='<div style="display:flex;gap:8px;flex-wrap:wrap">'
        + '<input class="narrow" type="date" data-f="'+esc(f.n)+'" data-t="dt-d" value="'+esc(toIsoDate(p.d))+'" style="max-width:170px"/>'
        + '<input class="narrow" type="time" data-f="'+esc(f.n)+'" data-t="dt-t" value="'+esc(to24(p.t))+'" style="max-width:130px"/>'
        + '</div>';
      if(f.jobs) ctl+='<div class="tiny muted" style="margin-top:7px">Reschedules these daily jobs:'
        + '<ul class="jobs">'+CFG.jobs.map(function(j){ return '<li>'+esc(j)+'</li>'; }).join("")+'</ul></div>';
      break; }
    case "int":
      ctl='<label class="affix suf" style="max-width:170px"><input type="text" inputmode="numeric" data-f="'+esc(f.n)+'" data-t="int" value="'+esc(numStr(v))+'"/>'
        + '<span class="sym tiny">'+esc(f.suffix||"")+'</span></label>';
      break;
    case "money":
      ctl='<label class="affix" style="max-width:210px"><span class="sym">$</span>'
        + '<input type="text" inputmode="decimal" data-f="'+esc(f.n)+'" data-t="money" value="'+esc(fmtMoney(v))+'"/></label>';
      break;
    case "pct":
      ctl='<label class="affix suf narrow"><input type="text" inputmode="decimal" data-f="'+esc(f.n)+'" data-t="pct" value="'+esc(numStr(v))+'"/><span class="sym">%</span></label>';
      break;
    case "text":
      ctl='<textarea'+(f.tall?' class="tall"':"")+' data-f="'+esc(f.n)+'" data-t="text"'
        + (f.placeholder?' placeholder="'+esc(f.placeholder)+'"':"")+'>'+esc(v)+'</textarea>';
      if(f.n==="Plat_Review_Criteria") ctl+='<button type="button" class="btn" data-import-starter>Use starter instructions</button>';
      break;
    case "line":
      ctl='<input type="text" data-f="'+esc(f.n)+'" data-t="raw" value="'+esc(v)+'"'
        + (f.placeholder?' placeholder="'+esc(f.placeholder)+'"':"")+'/>';
      break;
    case "emails":
      ctl=emailChips(f,v);
      break;
    case "multi":
      ctl=multiSelect(f,v);
      break;
    default:
      ctl='<input type="text" data-f="'+esc(f.n)+'" data-t="raw" value="'+esc(v)+'"/>';
  }
  return '<div class="frow'+(f.danger&&boolOf(v)?" hot":"")+'" data-frow="'+esc(f.n)+'">'
    + '<div class="lab"><div class="name">'+esc(f.l)+'</div>'
    + (f.hint?'<div class="hint">'+esc(f.hint)+'</div>':'')+'</div>'
    + '<div class="ctl">'+ctl+'</div><div class="tick"></div></div>';
}

  var groups={}, order=[];

  order.forEach(function(k){

/* ── Schema fields the report never sent back (not on the layout, or unpublished) ──

   back, so we call them out instead of letting them read as "empty on purpose".        */
function missingFields(){
  if(!S.rec) return [];
  var out=[];
  GROUPS.forEach(function(g){ g.fields.forEach(function(f){
    if(!S.rec.hasOwnProperty(f.n)) out.push(f.l);

}

/* ── Fields on the record that this widget does not explicitly model ── */
function otherFields(){
  if(!S.rec) return [];

  GROUPS.forEach(function(g){ g.fields.forEach(function(f){ known[f.n]=1; }); });

    var v=S.rec[k];

/* ══════════════ EVENT WIRING ══════════════ */
function readControl(el){
  var t=el.getAttribute("data-t"), f=el.getAttribute("data-f");
  switch(t){
    case "bool":  return {f:f, v:el.checked};
    case "date":  return {f:f, v:fromIsoDate(el.value)};
    case "dt-d":
    case "dt-t":{
      var row=el.closest("[data-frow]");
      var d=row.querySelector('[data-t="dt-d"]').value;
      var tm=row.querySelector('[data-t="dt-t"]').value;
      if(!d) return {f:f, v:""};
      var prev=splitDateTime(curVal(f));
      var secs=(prev.t.match(/:(\d{2})\s*[AaPp]/)||[])[1]||"00";
      return {f:f, v:fromIsoDate(d)+(tm?(" "+to12(tm,secs)):" 12:00:00 AM")};
    }
    case "int":   return {f:f, v:numStr(el.value)};
    case "money":
    case "pct":   return {f:f, v:numStr(el.value)};
    default:      return {f:f, v:el.value};
  }
}
var wired=false;
function wire(){
  /* Section jump */
  $("nav").onclick=function(e){
    var b=e.target.closest("[data-jump]"); if(!b) return;
    var k=b.getAttribute("data-jump");
    S.section=k; renderNav();
    var el=$("sec-"+k); if(el) el.scrollIntoView({block:"start"});
  };

  /* Scroll-spy: keep the active tab in step with what is on screen. Assignment (not
     addEventListener) because wire() re-runs on every render and must not stack listeners. */
  var view=$("view");
  view.onscroll=function(){
    var edge=view.getBoundingClientRect().top+70, cur=null;
    Array.prototype.forEach.call(document.querySelectorAll("[id^=sec-]"),function(el){
      if(el.getBoundingClientRect().top<=edge) cur=el.id.slice(4);
    });
    if(cur&&cur!==S.section){ S.section=cur; renderNav(); }
  };

  var wrap=$("wrap");

  if(wired)return;wired=true;

  /* Plain controls — commit on change (and on input for text so typing feels live) */
  wrap.addEventListener("change",function(e){
    var el=e.target;
    if(el.hasAttribute("data-f")){
      var r=readControl(el);
      queue(r.f,r.v);
      if(el.getAttribute("data-t")==="bool"){
        var row=el.closest("[data-frow]");
        var lab=el.parentNode.querySelector(".txt");
        var fdef=findField(r.f);
        if(lab) lab.textContent=r.v?(fdef&&fdef.danger?"On — unlocked":"On"):"Off";
        if(row&&fdef&&fdef.danger) row.classList.toggle("hot",!!r.v);
      }
      return;
    }
    if(el.hasAttribute("data-cf")) curveEdit(el);
  });
  wrap.addEventListener("input",function(e){
    var el=e.target;
    if(!el.hasAttribute("data-f")) return;
    var t=el.getAttribute("data-t");
    if(t==="pct"||t==="money"||t==="int"||t==="raw"||t==="text"){
      if(el.classList.contains("tall")) grow(el);
      var r=readControl(el); queue(r.f,r.v);

        var stamp=nowStamp();
        queue(CRITERIA_STAMP,stamp);
        syncStampRow(CRITERIA_STAMP,stamp);
      }
    }
  });
  /* Re-format money only once the user leaves the box, so typing isn't fought. */
  wrap.addEventListener("blur",function(e){
    var el=e.target;
    if(el.getAttribute&&el.getAttribute("data-t")==="money") el.value=fmtMoney(el.value);
  },true);

  /* Email chips */
  wrap.addEventListener("keydown",function(e){
    var inp=e.target.closest?e.target.closest("[data-chipinput]"):null;
    if(!inp||!Controller.canEdit(inp.getAttribute("data-chipinput"))) return;
    var f=inp.getAttribute("data-chipinput");
    if(e.key==="Enter"||e.key===","||e.key===";"||e.key==="Tab"){
      var val=inp.value.trim().replace(/[,;]$/,"");
      if(!val){ if(e.key!=="Tab") e.preventDefault(); return; }
      e.preventDefault();
      var list=emailList(curVal(f)); list.push(val);
      commitEmails(f,list);
    } else if(e.key==="Backspace"&&!inp.value){
      var l2=emailList(curVal(f));
      if(l2.length){ l2.pop(); commitEmails(f,l2); }
    }
  });
  wrap.addEventListener("click",function(e){
    var targetField=e.target.closest("[data-frow]");
    if(targetField&&!Controller.canEdit(targetField.getAttribute("data-frow")))return;
    if(e.target.closest("[data-crow]")&&!Controller.curveAllowed())return;
    var rm=e.target.closest("[data-rmchip]");
    if(rm){
      var box=rm.closest("[data-chips]"), f=box.getAttribute("data-chips");
      var list=emailList(curVal(f));
      list.splice(Number(rm.getAttribute("data-rmchip")),1);
      commitEmails(f,list);
      return;
    }
    var un=e.target.closest("[data-unpick]");
    if(un){
      e.stopPropagation();
      var ms=un.closest("[data-msel]");

      return;
    }
    var tg=e.target.closest("[data-toggle]");
    if(tg){
      var m=tg.closest("[data-msel]");
      var wasOpen=m.classList.contains("open");
      closeMsels();
      if(!wasOpen){ m.classList.add("open"); var s=m.querySelector("[data-msearch]"); if(s){ s.value=""; s.focus(); } }
      return;
    }
    var pk=e.target.closest("[data-pick]");
    if(pk){
      var m2=pk.closest("[data-msel]");
      togglePick(m2.getAttribute("data-msel"),pk.getAttribute("data-pick"));
      return;
    }
    var del=e.target.closest("[data-delcurve]");
    if(del){ deleteCurve(del.getAttribute("data-delcurve")); return; }
    if($("addCurve")&&e.target.closest("#addCurve")){ addCurve(); return; }
    if(!e.target.closest("[data-msel]")) closeMsels();
  });
  wrap.addEventListener("input",function(e){
    var s=e.target.closest?e.target.closest("[data-msearch]"):null;
    if(!s) return;
    var m=s.closest("[data-msel]");
    var f=m.getAttribute("data-msel"), src=m.getAttribute("data-src");
    m.querySelector("[data-opts]").innerHTML=msOptions(optionsFor(src),multiIds(curVal(f)),s.value);
  });

  document.addEventListener("click",function(e){
    if(!e.target.closest("[data-msel]")) closeMsels();
  },{capture:false});
}
function findField(n){
  for(var i=0;i<GROUPS.length;i++){
    for(var j=0;j<GROUPS[i].fields.length;j++) if(GROUPS[i].fields[j].n===n) return GROUPS[i].fields[j];
  }
  if(inferredFields[n])return inferredFields[n];
  if(S.rec&&Object.prototype.hasOwnProperty.call(S.rec,n)){
    var value=S.rec[n];
    if(Array.isArray(value)&&value.length&&value.every(function(v){return /^\d+$/.test(relId(v));}))return inferredFields[n]={n:n,t:"multi"};
    if(value&&typeof value==="object"&&!Array.isArray(value)&&/^\d+$/.test(relId(value)))return inferredFields[n]={n:n,t:"look"};
  }
  return null;
}
function closeMsels(){
  Array.prototype.forEach.call(document.querySelectorAll(".msel.open"),function(m){ m.classList.remove("open"); });
}
function commitEmails(f,list){
  var clean=[],seen={};
  list.forEach(function(e){ var v=e.trim(); if(v&&!seen[v.toLowerCase()]){ seen[v.toLowerCase()]=1; clean.push(v); } });
  var joined=clean.join(",");
  if(!queue(f,joined))return;
  var row=document.querySelector('[data-frow="'+f+'"]');
  if(row){
    var host=row.querySelector(".ctl");
    host.innerHTML=emailChips(findField(f)||{n:f},joined);
    var inp=host.querySelector("[data-chipinput]"); if(inp) inp.focus();
  }
}
function togglePick(f,id){
  var sel=multiIds(curVal(f));
  var at=sel.indexOf(id);
  if(at>=0) sel.splice(at,1); else sel.push(id);
  /* Creator accepts an array of ids for a multi-select lookup. */
  if(!queue(f,sel.slice()))return;
  var m=document.querySelector('[data-msel="'+f+'"]');
  if(!m) return;
  var wasOpen=m.classList.contains("open");
  var q=(m.querySelector("[data-msearch]")||{}).value||"";
  var row=m.closest("[data-frow]");
  row.querySelector(".ctl").innerHTML=multiSelect(findField(f),sel);
  var m2=row.querySelector("[data-msel]");
  if(wasOpen){
    m2.classList.add("open");
    var s=m2.querySelector("[data-msearch]");
    if(s){ s.value=q; s.focus(); }
    m2.querySelector("[data-opts]").innerHTML=msOptions(optionsFor(m2.getAttribute("data-src")),sel,q);
  }
}

/* Native handshake deadline: a stalled/late bridge cannot start business reads. */
var bootGeneration=0,booting=false;
function nativeContext(generation){
  return new Promise(function(resolve,reject){
    var finished=false,timer=setTimeout(function(){finish(new Error("Creator connection timed out. Reload to retry."));},5000);
    function finish(error,value){if(finished)return;finished=true;clearTimeout(timer);if(generation!==bootGeneration){reject(new Error("Connection was superseded."));return;}if(error)reject(error);else resolve(value);}
    Promise.resolve().then(function(){return ZOHO.CREATOR.UTIL.getInitParams();}).then(function(params){
      if(finished||generation!==bootGeneration)return;
      try{var runtime=LMRuntime.apply(params);Controller.bind(runtime);finish(null,runtime);}catch(error){finish(error);}
    },function(error){finish(error);});
  });
}
function boot(){
  if(booting)return Promise.resolve(false);
  if(S.ready&&(S.inflight||S.curveBusy||Controller.hasDrafts())){toast("Local edits are retained. Finish or recheck them before reconnecting.",true);return Promise.resolve(false);}
  var creator=window.ZOHO&&ZOHO.CREATOR;
  if(!creator||!creator.DATA||!creator.UTIL||typeof creator.UTIL.getInitParams!=="function"){
    var embedded=false;try{embedded=window.parent!==window;}catch(error){embedded=true;}
    if(!embedded){fallbackDemo();return Promise.resolve(false);}
    S.live=false;S.loadBlocked=true;setMode("Connection unavailable","error");$("wrap").innerHTML='<div class="banner bad"><div><b>Creator connection unavailable</b>Reload to retry.</div></div>';return Promise.resolve(false);
  }
  booting=true;var generation=++bootGeneration;S.live=false;setMode("Connecting…","");$("reload").disabled=true;LMPerf.start("settings:startup");LMPerf.start("settings:init");
  return nativeContext(generation).then(function(){
    if(generation!==bootGeneration)return false;
    LMPerf.end("settings:init",{ok:true});S.live=true;S.demo=false;
    if(window.LMCriticalErrors){LMCriticalErrors.configure({widget:"Settings Manager",version:CFG.version,code:"SMW",getContext:function(){var runtime=LMRuntime.current();return {environment:runtime.environment,user:runtime.user,sdkMode:S.live?"LIVE":"NO-SDK",records:S.recCount};}});LMCriticalErrors.markReady();}
    return loadData();
  }).catch(function(error){
    if(generation!==bootGeneration)return false;
    S.live=false;S.loadBlocked=true;LMPerf.end("settings:init",{ok:false});setMode("Connection failed","error");$("wrap").innerHTML='<div class="banner bad"><div><b>Could not connect to Creator</b>'+esc(errText(error))+'</div></div>';diag("Creator init error",error);return false;
  }).finally(function(){if(generation===bootGeneration){booting=false;syncControls();syncMode();LMPerf.end("settings:startup",{ok:S.live&&S.ready&&!S.loadBlocked});}});
}
boot();


})();
</script>
