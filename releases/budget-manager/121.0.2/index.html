<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Budget Manager V117</title>
<script src="https://static.zohocdn.com/creator/widgets/version/1.0/widgetsdk-min.js"></script>
<script src="critical-error-reporter.js"></script>
<style>
/* â”€â”€ TOKENS â”€â”€ Combined: Tax Center chrome + Budget page content â”€â”€ */
:root{
  --bg:#f0f3f7; --surface:#e8ecf1; --card:#fff;
  --line:#dde4ef; --line-strong:#c8d4e5;
  --text:#0f2744; --muted:#5c7394; --faint:#8ea0bd;
  /* Tax Center nav chrome */
  --navy:#0b2345; --navy-soft:rgba(11,35,69,.08);
  /* Budget page brand accent */
  --primary:#1e40af; --ptint:#eef4ff; --psoft:#e8f0fb;
  /* Status */
  --green:#047857; --green-bg:#ecfdf5;
  --amber:#b45309; --amber-bg:#fffbeb;
  --red:#b91c1c;   --red-bg:#fef2f2;
  --violet:#3730a3;--violet-bg:#e0e7ff;
  --r:10px; --rsm:6px;
  --shadow:0 2px 8px rgba(30,64,175,.06),0 1px 2px rgba(0,0,0,.03);
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;overflow:hidden}
body{display:flex;flex-direction:column;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:13px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit}
.mono{font-family:"SF Mono",ui-monospace,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}

/* â”€â”€ TOPBAR â”€â”€ */
.topbar{display:flex;align-items:center;gap:0;height:48px;padding:0 18px;background:var(--card);border-bottom:1px solid var(--line);flex-shrink:0}
.topbar-brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:14px;letter-spacing:-.2px;color:var(--navy);margin-right:20px;flex-none}
.build-badge{display:inline-flex;align-items:center;height:18px;padding:0 6px;margin-left:6px;border-radius:999px;background:#e8f0ff;border:1px solid #bfd1f6;color:#234a8b;font-size:9px;font-weight:800;letter-spacing:.05em;vertical-align:middle}

.topbar-brand svg{width:16px;height:16px;color:var(--primary)}
.topbar-brand small{font-size:9.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-left:2px}
/* Tab bar */
.tabs{display:flex;align-items:center;gap:4px;background:#eef2f8;border:1px solid #dde5f0;border-radius:999px;padding:3px}
.tabs a{display:inline-flex;align-items:center;gap:7px;padding:0 16px;height:30px;font-size:12px;font-weight:700;color:#5a6b85;text-decoration:none;border-radius:999px;transition:all .13s;white-space:nowrap}
.tabs a:hover{color:var(--navy);background:rgba(255,255,255,.6)}
.tabs a.active{color:#fff;background:var(--navy);box-shadow:0 1px 3px rgba(11,31,58,.25)}
.tabs a svg{width:13px;height:13px;flex:none}
.tabs a .ct{display:inline-grid;place-items:center;min-width:17px;height:17px;padding:0 5px;font-size:9px;font-weight:800;border-radius:999px;background:var(--amber);color:#fff}
.tabs a.active .ct{background:#fff;color:var(--navy)}
.spacer{flex:1}
/* autosave */
.autosave{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;color:var(--muted)}
.autosave .dot{width:7px;height:7px;border-radius:50%;background:var(--green)}
.autosave.saving .dot{background:var(--amber);animation:pulse .8s infinite alternate}
@keyframes pulse{from{opacity:.4}to{opacity:1}}

/* â”€â”€ MAIN SCROLL AREA â”€â”€ */
.main{flex:1;overflow-y:auto;overflow-x:hidden}
.wrap{max-width:1440px;margin:0 auto;padding:20px 22px 48px}

/* â”€â”€ BUTTONS â”€â”€ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;height:30px;padding:0 12px;border-radius:var(--rsm);border:1px solid var(--line);background:var(--card);color:var(--text);font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;transition:all .12s}
.btn:hover{border-color:var(--line-strong);background:var(--surface)}
.btn svg{width:12px;height:12px;flex-none}
.btn.sm{height:26px;padding:0 9px;font-size:11px}
.btn.navy{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.navy:hover{background:#12345d}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.primary:hover{background:#1e3a8a}
.btn.approve{background:var(--green);border-color:var(--green);color:#fff}
.btn.approve:hover{background:#065f46}
.btn.savenote{background:var(--amber-bg);color:#92400e;border-color:#fcd34d}
.btn.savenote:hover{background:#fef3c7}
.btn.deny{color:var(--red)}
.btn.deny:hover{border-color:var(--red);background:var(--red-bg)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover{background:var(--surface);color:var(--text)}
.btn.warn{background:var(--amber-bg);border-color:#fcd34d;color:#92400e}
.btn.warn:hover{background:#fef3c7;border-color:#f59e0b}
.btn.danger{background:var(--red-bg);border-color:#fecaca;color:var(--red)}
.btn.danger:hover{border-color:var(--red);background:#fee2e2}
.btn[disabled]{opacity:.55;cursor:not-allowed;filter:grayscale(.25)}
.btn[disabled]:hover{background:var(--card);border-color:var(--line)}

/* â”€â”€ CFO APPROVAL MANAGEMENT â”€â”€ */
.cfo-tools{background:linear-gradient(135deg,#ffffff 0%,#f7fafd 100%);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);margin-bottom:14px;overflow:hidden}
.cfo-tools-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);background:#f5f7fb}
.cfo-tools-title{font-size:13px;font-weight:900;color:var(--navy);letter-spacing:-.01em}
.cfo-tools-sub{font-size:11px;color:var(--muted);margin-top:1px}
.cfo-tools-actions{display:flex;align-items:center;gap:7px;flex-wrap:wrap;justify-content:flex-end}
.cfo-status-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px 16px}
.cfo-status-card{border:1px solid var(--line);border-radius:10px;background:#fff;padding:10px 12px;display:flex;align-items:center;justify-content:space-between;gap:10px;min-width:0}
.cfo-status-card .ctxt{min-width:0}
.cfo-status-card .cl{font-size:10px;font-weight:900;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-bottom:3px}
.cfo-status-card .cv{font-size:13px;font-weight:900;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cfo-inline-actions{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:10px}
.appr-admin-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);background:#fff}
.appr-admin-bar .left{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.appr-admin-title{font-size:12px;font-weight:900;color:var(--navy)}
.appr-admin-actions{display:flex;align-items:center;gap:7px;flex-wrap:wrap;justify-content:flex-end}

.arh-right{display:flex;align-items:center;gap:8px;flex:none}
@media(max-width:760px){.cfo-tools-head,.appr-admin-bar{align-items:flex-start;flex-direction:column}.cfo-status-grid{grid-template-columns:1fr}.cfo-tools-actions,.appr-admin-actions{justify-content:flex-start}}

/* â”€â”€ STICKY EDITOR BAR (3 columns) â”€â”€ */
.stbar{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:8px 22px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;flex-shrink:0}
.stbar-left{display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-width:0}
.stbar-center{display:flex;align-items:center;gap:10px;justify-content:center;white-space:nowrap}
.stbar-right{display:flex;align-items:center;gap:8px;justify-content:flex-end}
.crumbs{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)}
.crumbs .sep{color:var(--faint)}
.crumbs .cur{color:var(--text);font-weight:700}
#backBtn,#backApprBtn{cursor:pointer}
#backBtn{font-size:13px;font-weight:700;padding:0 14px;height:32px;border:1px solid #c7d2e0;background:#fff;color:var(--navy);border-radius:9px;box-shadow:0 1px 2px rgba(15,39,68,.06);transition:all .13s}
#backBtn:hover{background:var(--navy);border-color:var(--navy);color:#fff}
#backBtn svg{width:15px;height:15px}
.crumbs{cursor:default}
/* mode switch with Approvals + Attachments tabs */
.mode-tsw button[data-mode=approvals],.mode-tsw button[data-mode=attachments]{position:relative}
.mode-tsw button[data-mode=approvals].active,.mode-tsw button[data-mode=attachments].active{background:var(--card);color:var(--primary)}
.mode-tsw button[data-mode=approvals].active svg,.mode-tsw button[data-mode=attachments].active svg{stroke:var(--primary)}
#modeSwitch button svg{width:11px;height:11px;flex:none}
/* Enlarged editor status/mode controls */
.stbar-center .editor-status-save{font-size:13.75px;font-weight:750;gap:7px}
.stbar-center .editor-status-save .dot{width:9px;height:9px}
.stbar-center .editor-mode-switch{padding:4px;gap:3px;box-shadow:0 1px 3px rgba(15,39,68,.08)}
.stbar-center .editor-mode-switch button{font-size:14px;padding:6px 13px;gap:7px}
.stbar-center .editor-mode-switch button svg{width:14px!important;height:14px!important}
.editor-action-controls{display:flex;align-items:center;gap:8px;margin-left:4px;flex-wrap:wrap;justify-content:center}
.editor-action-controls .btn.sm{height:30px;padding:0 11px;font-size:11.5px}
.editor-action-controls .btn.navy.sm{padding:0 12px}
.editor-action-controls .btn svg{width:13px;height:13px}
.editor-action-controls .btn.is-hidden{display:none!important}
@media(max-width:900px){.stbar{grid-template-columns:1fr}.stbar-left,.stbar-center,.stbar-right{justify-content:center}.stbar-center{flex-wrap:wrap}.editor-action-controls{margin-left:0}}
/* tier switch */
.tsw{display:inline-flex;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px}
.tsw button{font-family:inherit;cursor:pointer;border:none;background:transparent;padding:4px 10px;border-radius:999px;font-size:11.5px;font-weight:700;color:var(--muted);display:inline-flex;align-items:center;gap:5px;transition:all .12s;white-space:nowrap}
.tsw button:hover{background:rgba(255,255,255,.7);color:var(--text)}
.tsw button .d{width:6px;height:6px;border-radius:50%}
.tsw button[data-tier=prelim] .d{background:#5c7394}
.tsw button[data-tier=final] .d{background:var(--primary)}
.tsw button.active{background:var(--card);color:var(--text);box-shadow:0 1px 3px rgba(15,39,68,.12)}
.tsw button.active .d{opacity:1}

/* â”€â”€ SUMMARY KPIS â”€â”€ */
.skpis{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);border-radius:var(--r);background:var(--card);overflow:hidden;box-shadow:var(--shadow);margin-bottom:16px}
.skpi{padding:14px 18px;border-right:1px solid var(--line)}
.skpi:last-child{border-right:none}
.skpi .l{font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-bottom:5px}
.skpi .v{font-family:"SF Mono",ui-monospace,Menlo,Consolas,monospace;font-size:20px;font-weight:700;letter-spacing:-.02em;color:var(--text)}
.skpi .s{font-size:11px;color:var(--muted);margin-top:3px}

/* â”€â”€ FILTER PILLS â”€â”€ */
.frow{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:14px}
.frow .fl{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.fpill{display:inline-flex;align-items:center;gap:5px;padding:4px 11px;border:1px solid var(--line);border-radius:999px;background:var(--card);font-size:11px;font-weight:700;color:var(--muted);cursor:pointer;transition:all .12s}
.fpill:hover{border-color:var(--navy);color:var(--text)}
.fpill.active{background:var(--navy);border-color:var(--navy);color:#fff}
.fpill .dot{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.7}
.fpill.status-filter{background:var(--sf-bg,var(--card));color:var(--sf-color,var(--muted));border-color:var(--sf-border,var(--line))}
.fpill.status-filter:hover{border-color:var(--sf-color,var(--navy));color:var(--sf-color,var(--text))}
.fpill.status-filter.active{background:var(--sf-color,var(--navy));border-color:var(--sf-color,var(--navy));color:#fff}
.fpill.status-filter.active .dot{background:#fff;opacity:.9}
.fpill .x{font-size:12px;line-height:1;margin-left:3px;opacity:.8}

/* â”€â”€ PROJECT CARDS â”€â”€ */
.proj-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow);margin-bottom:12px}
.proj-head{display:flex;align-items:center;gap:16px;padding:14px 18px;background:linear-gradient(180deg,#f8fafd 0%,#f1f5fa 100%);border-bottom:1px solid var(--line);flex-wrap:wrap}
.proj-head-main{display:flex;flex-direction:column;gap:7px;min-width:0;flex:0 1 auto;margin-right:8px}
.proj-title-row{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.proj-head .pn{font-size:15.5px;font-weight:800;letter-spacing:-.015em;color:var(--navy)}
.ph-chip{font-size:10px;font-weight:800;color:#44597a;background:#e9eff9;border:1px solid #d2deee;border-radius:999px;padding:2.5px 10px;letter-spacing:.02em;white-space:nowrap}
.proj-stats{display:flex;gap:16px;flex-wrap:wrap}
.pstat{display:inline-flex;align-items:baseline;gap:5px}
.pstat .k{font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:#8a9cb8}
.pstat .v{font-family:"SF Mono",monospace;font-size:12px;font-weight:700;color:#1d3354}
.proj-status-row{display:flex;gap:6px;flex-wrap:wrap}
.proj-status-row .st{font-size:9.5px;padding:2px 8px}
.proj-pf{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:10px 22px;min-width:275px;max-width:360px;border-left:1px solid var(--line);text-align:center;background:transparent}
.proj-pf label{font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--faint)}
.pf-combo{position:relative;width:100%;max-width:275px;text-align:left}
.pf-combo-btn{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;height:31px;border:1px solid #cfd8e6;border-radius:8px;background:#fff;color:var(--navy);font-family:inherit;font-size:11.5px;font-weight:750;padding:0 9px 0 10px;outline:none;box-shadow:0 1px 2px rgba(15,39,68,.04);cursor:pointer}
.pf-combo-btn:hover{border-color:#b8c7dc;background:#fbfdff}
.pf-combo-btn:focus,.pf-combo.open .pf-combo-btn{border-color:var(--primary);box-shadow:0 0 0 3px rgba(44,111,229,.10)}
.pf-combo-btn:disabled{background:#f3f6fa;color:#8290a4;cursor:not-allowed}
.pf-combo-text{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.pf-combo-chevron{width:13px;height:13px;flex:none;color:#60738f;transition:transform .14s}
.pf-combo.open .pf-combo-chevron{transform:rotate(180deg)}
.pf-combo-menu{display:none;width:100%;margin-top:5px;border:1px solid #cfd8e6;border-radius:9px;background:#fff;box-shadow:0 8px 22px rgba(15,39,68,.16);overflow:hidden}
.pf-combo.open .pf-combo-menu{display:block}
.pf-combo-search{position:relative;padding:7px;border-bottom:1px solid #e7edf5;background:#f8fafd}
