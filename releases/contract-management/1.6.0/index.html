};

if(window.LMCriticalErrors)window.LMCriticalErrors.configure({
  widget:"Contract Management",version:CFG.version,code:"CMW",
  apiCandidates:[CFG.customApis.errorReport,"reportProformaWidgetError"],
  getContext:function(){return{sdkMode:S.liveSDK?"LIVE":(S.demo?"DEMO":"NO-SDK"),view:S.view,section:S.homeSection,contractId:String(S.selId||""),loiReviewId:String(S.loiSelId||"")};}
});

/* ---------------- tiny utils ---------------- */
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }
function attr(s){ return esc(s).replace(/\n/g,"&#10;"); }
function num(v){ var n=parseFloat(v); return isNaN(n)?0:n; }
function truthy(v){ return v===true||v==="true"; }
function asList(v){ if(v==null||v==="") return []; if(Array.isArray(v)) return v; return [v]; }
function lookupId(v){ var l=asList(v); if(!l.length) return ""; var f=l[0]; if(typeof f==="object") return String(f.ID||f.id||""); return String(f); }
function displayValue(v){ var l=asList(v); if(!l.length) return ""; var f=l[0]; if(typeof f==="object") return String(f.display_value||""); return String(f); }
function listDisplay(v){ return asList(v).map(function(x){ return typeof x==="object"?String(x.display_value||""):String(x); }).filter(Boolean).join(", "); }
function diag(label,obj){
  var isError=/error|fail|failed|exception|invalid|denied/i.test(String(label||"")) || (obj&&obj.error);
  try{ console.log("[Contracts]",label,obj||""); }catch(e){}
  if(window.LMCriticalErrors)window.LMCriticalErrors.breadcrumb(isError?"error":"info",label,obj,isError);
}
function money(v){ var n=parseFloat(String(v==null?"":v).replace(/[$,]/g,"")); if(isNaN(n)) return "—"; return n.toLocaleString("en-US",{style:"currency",currency:"USD",maximumFractionDigits:0}); }
function plain(v){ if(v==null||v==="") return "—"; var d=displayValue(v); return d||String(v); }
function readPageParams(){
  var out={};
  function absorb(raw){
    if(!raw) return;
    var q=String(raw), qi=q.indexOf("?"); if(qi>=0) q=q.slice(qi+1);
    var hi=q.indexOf("#"); if(hi>=0) q=q.slice(0,hi);
    try{ new URLSearchParams(q).forEach(function(v,k){ if(out[k]==null) out[k]=v; }); }catch(e){}
  }
  absorb(window.location.search);
  absorb(window.location.hash);
  absorb(document.referrer);
  return out;
}
function resolvePageParams(){
  var fallback=readPageParams();
  try{
    if(S.liveSDK && window.ZOHO && ZOHO.CREATOR && ZOHO.CREATOR.UTIL && typeof ZOHO.CREATOR.UTIL.getQueryParams==="function"){
      return ZOHO.CREATOR.UTIL.getQueryParams().then(function(resp){
        var p=(resp&&resp.data)||resp||{};
        Object.keys(fallback).forEach(function(k){if(p[k]==null)p[k]=fallback[k];});
        return p;
      },function(){return fallback;});
    }
  }catch(e){}
  return Promise.resolve(fallback);
}

/* dates: Creator app format is MM/dd/yyyy; date inputs need yyyy-MM-dd */
function toInput(v){
  if(!v) return "";
  var s=String(v).trim(); if(!s) return "";
  var m=s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})/); if(m) return m[3]+"-"+("0"+m[1]).slice(-2)+"-"+("0"+m[2]).slice(-2);
  m=s.match(/^(\d{4})-(\d{2})-(\d{2})/); if(m) return m[1]+"-"+m[2]+"-"+m[3];
  var d=new Date(s); if(!isNaN(d)) return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2);
  return "";
}
function toZoho(inputVal){
  if(!inputVal) return "";
  var m=String(inputVal).match(/^(\d{4})-(\d{2})-(\d{2})/); if(!m) return String(inputVal);
  return m[2]+"/"+m[3]+"/"+m[1];
}
function fmtDate(v){ var i=toInput(v); if(!i) return ""; var p=i.split("-"); return p[1]+"/"+p[2]+"/"+p[0]; }
function todayInput(){ var d=new Date(); return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2); }
function isOverdue(a){ if(truthy(a.Complete)) return false; var d=toInput(a.Due_Date); return !!d && d<todayInput(); }

/* ---------------- status / banners ---------------- */
function setStatus(mode,text){ $("statusdot").className="dot"+(mode==="ok"?"":mode==="warn"?" warn":" err"); $("statustext").textContent=text; }
function banner(kind,msg){
  var b=$("banners");
  b.innerHTML='<div class="'+(kind==="err"?"err-banner":"ok-banner")+'">'+esc(msg)+(kind==="err"?'<button onclick="document.getElementById(\'banners\').innerHTML=\'\'">×</button>':'')+'</div>';
  if(kind!=="err") setTimeout(function(){ b.innerHTML=""; },3500);
}

/* ---------------- SDK layer (envelope machinery, proven in v7 widget) ---------------- */
function responseBad(resp){
  if(!resp) return true;
  var code=resp.code||(resp.result&&resp.result.code);
  if(code && code!==3000 && code!=="3000") return true;
  if(resp.error||(resp.result&&resp.result.error)) return true;
  return false;
}
function isEmptyCode(resp){ var code=resp&&(resp.code||(resp.result&&resp.result.code)); return String(code)==="3100"||String(code)==="9280"; }
function sdkGetAll(reportName,criteria){
  if(!S.liveSDK) return Promise.resolve([]);
  var all=[];
  function page(p){
    var payload={reportName:reportName,page:p,pageSize:CFG.pageSize};
    if(criteria) payload.criteria=criteria;
    return ZOHO.CREATOR.API.getAllRecords(payload).then(function(resp){
      if(isEmptyCode(resp)) return all;
      if(responseBad(resp)) return Promise.reject(resp);
      var rows=(resp&&resp.data)||[];
      all=all.concat(rows);
      if(rows.length===CFG.pageSize && p<CFG.maxPages) return page(p+1);
      diag("Read complete: "+reportName,{rows:all.length});
      return all;
    },function(err){
      var msg=(err&&(err.message||err.responseText||""))+"";
      if(err&&typeof err.responseText==="string"){ try{ if(isEmptyCode(JSON.parse(err.responseText))) return all; }catch(e){} }
      if(isEmptyCode(err)) return all;
      if(/9280|3100|no records|no data available|record(s)? not found/i.test(msg)) return all;
      return Promise.reject(err);
    });
  }
  return page(1);
}

function sdkInvoke(config){
  if(!S.liveSDK) return Promise.resolve({details:{output:JSON.stringify({success:true,decision:config.payload&&config.payload.decision,contractId:"demo_loi_contract"})}});
  if(ZOHO.CREATOR.API && typeof ZOHO.CREATOR.API.invokeCustomApi==="function") return ZOHO.CREATOR.API.invokeCustomApi(config);
  if(ZOHO.CREATOR.DATA && typeof ZOHO.CREATOR.DATA.invokeCustomApi==="function") return ZOHO.CREATOR.DATA.invokeCustomApi(config);
  return Promise.reject({message:"invokeCustomApi unavailable"});
}
function unwrapApi(resp){
  var c=[resp,resp&&resp.details,resp&&resp.details&&resp.details.output,resp&&resp.output,resp&&resp.result,resp&&resp.response];
  for(var i=0;i<c.length;i++){
    var v=c[i]; if(v==null) continue;
    if(typeof v==="string"){
      var t=v.trim(); if(t.charAt(0)==="{"||t.charAt(0)==="["){ try{return JSON.parse(t);}catch(e){} }
    }else if(typeof v==="object" && (v.success!=null||v.contractId||v.message||v.error)) return v;
  }
  return resp;
}
function loadPendingLOIs(){
  var criteria='LOI_Legal_Status == "Pending Approval"';
  return sdkGetAll(CFG.reports.proformas,criteria).catch(function(){
    return sdkGetAll(CFG.reports.proformas).then(function(rows){
      return rows.filter(function(r){ return String(r.LOI_Legal_Status||"")==="Pending Approval"; });
    });
  }).then(function(rows){
    return rows.filter(function(r){ return String(r.LOI_Legal_Status||"")==="Pending Approval"; });
  });
}
function isSuccess(resp){
  var code=resp&&resp.code;
  var hasErr=!!(resp&&(resp.error||(resp.result&&resp.result.error)));
  var hasId=!!(resp&&((resp.data&&(resp.data.ID||resp.data.id))||(resp.result&&resp.result.data&&(resp.result.data.ID||resp.result.data.id))));
  return ((code===3000||(resp&&resp.result&&resp.result.code===3000))&&!hasErr)||(!hasErr&&hasId&&code==null);
}
function buildEnvelopes(recordId,fieldData,reportName){
  var rid=String(recordId);
  var appName=(window.ZOHO&&ZOHO.CREATOR&&ZOHO.CREATOR.appName)||undefined;
  return [
    {label:"data:{data}",args:{reportName:reportName,id:rid,data:{data:fieldData}}},
    {label:"data",args:{reportName:reportName,id:rid,data:fieldData}},
    {label:"data:{input}",args:{reportName:reportName,id:rid,data:{input:fieldData}}},
    {label:"input",args:{reportName:reportName,id:rid,input:fieldData}},
    {label:"payload",args:{reportName:reportName,id:rid,payload:{data:fieldData}}},
    {label:"appName+data",args:{appName:appName,reportName:reportName,id:rid,data:fieldData}}
  ];
}
function tryEnvelopes(recordId,fieldData,envelopes,idx){
  if(idx>=envelopes.length) return Promise.reject({message:"No envelope accepted for "+recordId});
  var env=envelopes[idx];
  return ZOHO.CREATOR.API.updateRecord(env.args).then(function(resp){
    if(isSuccess(resp)) return resp;
    throw resp;
  }).catch(function(err){
    var code=err&&err.code;
    if(!code&&err&&typeof err.responseText==="string"){ try{ code=JSON.parse(err.responseText).code; }catch(e){} }
    if(code===2945) return tryEnvelopes(recordId,fieldData,envelopes,idx+1);
    diag("Update failed",{recordId:String(recordId),fields:fieldData,error:err});
    return Promise.reject(err);
  });
}
function updateRecord(recordId,fieldData,reportName){
  if(S.demo) return Promise.resolve({code:3000});
  return tryEnvelopes(recordId,fieldData,buildEnvelopes(recordId,fieldData,reportName),0);
}
function isCreateSuccess(resp){
  var code=resp&&resp.code;
  var hasErr=!!(resp&&(resp.error||(resp.result&&resp.result.error)));
  var hasId=!!(resp&&((resp.data&&(resp.data.ID||resp.data.id))||(resp.result&&resp.result.data&&(resp.result.data.ID||resp.result.data.id))));
  return (!hasErr&&(code===3000||hasId));
}
function buildCreateEnvelopes(formName,fieldData){
  var appName=(window.ZOHO&&ZOHO.CREATOR&&ZOHO.CREATOR.appName)||undefined;
  return [
    {label:"data:{data}",args:{formName:formName,data:{data:fieldData}}},
    {label:"data",args:{formName:formName,data:fieldData}},
    {label:"appName+data:{data}",args:{appName:appName,formName:formName,data:{data:fieldData}}},
    {label:"appName+data",args:{appName:appName,formName:formName,data:fieldData}},
    {label:"input",args:{formName:formName,input:fieldData}}
  ];
}
function tryCreateEnvelopes(formName,fieldData,envelopes,idx){
  if(idx>=envelopes.length) return Promise.reject({message:"No create envelope accepted for "+formName});
  return ZOHO.CREATOR.API.addRecord(envelopes[idx].args).then(function(resp){
    if(isCreateSuccess(resp)||isSuccess(resp)) return resp;
    throw resp;
  }).catch(function(err){
    var code=err&&err.code;
    if(!code&&err&&typeof err.responseText==="string"){ try{ code=JSON.parse(err.responseText).code; }catch(e){} }
    if(code===2945) return tryCreateEnvelopes(formName,fieldData,envelopes,idx+1);
    return Promise.reject(err);
  });
}
function createRecord(formName,fieldData){
  if(S.demo) return Promise.resolve({code:3000,data:{ID:"demo_"+Date.now()}});
  return tryCreateEnvelopes(formName,fieldData,buildCreateEnvelopes(formName,fieldData),0);
}
function openParent(url){
  try{ ZOHO.CREATOR.UTIL.navigateParentURL({action:"open",url:url,window:"popup"}); }
  catch(e){ banner("err","Available inside Creator only."); }
}
function errText(e){
  if(!e) return "Unknown error";
  if(typeof e==="string") return e;
  return e.message||e.responseText||JSON.stringify(e).slice(0,200);
}

/* ---------------- derived data ---------------- */
function findContract(id){ for(var i=0;i<S.contracts.length;i++) if(String(S.contracts[i].ID)===String(id)) return S.contracts[i]; return null; }
function findAction(id){ for(var i=0;i<S.actions.length;i++) if(String(S.actions[i].ID)===String(id)) return S.actions[i]; return null; }
/* Sort_Order can be blank on older rows. num() would map every blank to 0, which
   collapses the whole list to "equal" and leaves the order at whatever the API
   returned. Blanks therefore sort last, and ID breaks any remaining tie, so the
   order is always deterministic and matches the native subform. */
function sortKey(a){
  var v=a.Sort_Order;
  if(v==null||String(v).trim()==="") return Number.MAX_SAFE_INTEGER;
  var n=parseFloat(v);
  return isNaN(n)?Number.MAX_SAFE_INTEGER:n;
}
/* Exactly one open action may be Current. Rendering trusts the first one only,
   and the data is repaired once after load so the record matches what is shown. */
function currentIdFor(cid){
  var list=actionsFor(cid);
  for(var i=0;i<list.length;i++){
    if(truthy(list[i].Current_Action)&&!truthy(list[i].Complete)) return String(list[i].ID);
  }
  return "";
}
function repairSingleCurrent(){
  if(S.demo||!S.liveSDK) return;
  var byContract={};
  S.actions.forEach(function(a){
    if(!truthy(a.Current_Action)||truthy(a.Complete)) return;
    var cid=lookupId(a.Contract1);
    (byContract[cid]=byContract[cid]||[]).push(a);
  });
  var updates=[];
  Object.keys(byContract).forEach(function(cid){
    var rows=byContract[cid];
    if(rows.length<2) return;
    var keep=currentIdFor(cid);
    rows.forEach(function(a){
      if(String(a.ID)!==keep) updates.push([String(a.ID),{Current_Action:false}]);
    });
  });
  if(!updates.length) return;
  diag("Repairing duplicate current actions",{rows:updates.length});
  var p=Promise.resolve();
  updates.forEach(function(u){
    p=p.then(function(){ return updateRecord(u[0],u[1],CFG.reports.actions).then(function(){ applyLocal(u[0],u[1]); }); });
  });
  p.then(function(){ renderAll(); }).catch(function(){});
}
function actionsFor(cid){
  return S.actions.filter(function(a){ return lookupId(a.Contract1)===String(cid); })
    .sort(function(a,b){
      var d=sortKey(a)-sortKey(b);
      if(d) return d;
      return String(a.ID).localeCompare(String(b.ID),undefined,{numeric:true});
    });
}
/* Renumber a contract's actions 1..n from an explicit id order and persist only
   the rows that actually changed. Self-heals blank or duplicated Sort_Order. */
function applyOrder(orderedIds){
  var updates=[];
  orderedIds.forEach(function(rid,i){
    var r=findAction(rid);
    if(!r) return;
    if(sortKey(r)!==i+1) updates.push([String(rid),{Sort_Order:i+1}]);
  });
  if(updates.length) runUpdates(updates);
  return updates.length;
}
function versionsFor(cid){
  return S.versions.filter(function(v){ return lookupId(v.Contract1)===String(cid); })
    .sort(function(a,b){ return toInput(b.Date_field1)<toInput(a.Date_field1)?-1:1; });
}
function statsFor(cid){
  var list=actionsFor(cid),st={open:0,done:0,current:0,overdue:0,total:list.length,pct:0};
  list.forEach(function(a){
    if(truthy(a.Complete)) st.done++;
    else { st.open++; if(isOverdue(a)) st.overdue++; }
    if(truthy(a.Current_Action)) st.current++;
  });
  if(st.total) st.pct=Math.round(st.done*100/st.total);
  return st;
}
function currentActionText(cid){
  var list=actionsFor(cid);
  for(var i=0;i<list.length;i++) if(truthy(list[i].Current_Action)&&!truthy(list[i].Complete)) return String(list[i].Contract_Action||"");
  var c=findContract(cid);
  return c?String(c.Current_Action||""):"";
}
function approvalsFor(cid){
  return S.approvals.filter(function(a){ return lookupId(a.Contract1)===String(cid); })
    .sort(function(a,b){ return num(a.Approval_Sequence)-num(b.Approval_Sequence); });
}
/* whole days from inputA to inputB (yyyy-MM-dd); positive when B is later */
function daysBetween(inputA,inputB){
  if(!inputA||!inputB) return null;
  var a=new Date(inputA+"T00:00:00"), b=new Date(inputB+"T00:00:00");
  if(isNaN(a)||isNaN(b)) return null;
  return Math.round((b-a)/86400000);
}
function daysSince(v){
  var i=toInput(v); if(!i) return null;
  var d=new Date(i+"T00:00:00"); if(isNaN(d)) return null;
  return Math.round((new Date(todayInput()+"T00:00:00")-d)/86400000);
}
/* record-edit popup, pattern proven by the Contract_Window workflow */
function openRecord(formLink,reportLink,id){
  openParent("#Form:"+formLink+"?recLinkID="+id+"&viewLinkName="+reportLink);
}
function openContractRecord(){ openRecord(CFG.forms.contract,CFG.reports.contracts,S.selId); }
/* upload-file fields come back as an API download path; anything path-like is openable */
function fileUrl(v){
  var s=String(v==null?"":v).trim();
  if(!s) return "";
  if(/^https?:\/\//i.test(s)) return s;
  if(s.charAt(0)==="/") return "https://creatorapp.zoho.com"+s;
  return "";
}
function fileDisplayName(v){
  var raw=String(v&&v.File_field1||"");
  var m=raw.match(/[?&]filepath=([^&]+)/);
  if(m){ try{ return decodeURIComponent(m[1]).replace(/^\d+_/,""); }catch(e){ return m[1]; } }
  var last=raw.split("?")[0].split("/").pop();
  if(last&&last.toLowerCase()!=="download") return last;
  return "Contract file"+(v&&toInput(v.Date_field1)?" · "+fmtDate(v.Date_field1):"");
}
function findVersion(id){ for(var i=0;i<S.versions.length;i++) if(String(S.versions[i].ID)===String(id)) return S.versions[i]; return null; }
function openVersionFile(id){
  var v=findVersion(id); if(!v) return;
  var u=fileUrl(v.File_field1);
  if(u) openParent(u);
  else openRecord(CFG.forms.version,CFG.reports.versions,id);
}
/* LOI queue age — the approval token embeds its creation time: <pfId>-<ms>-<rand> */
function loiQueueDays(r){
  var t=String(r.LOI_Approval_Token||""), m=t.match(/^[^-]+-(\d{12,14})-\d+$/);
  if(!m) return null;
  var d=new Date(parseInt(m[1],10));
  if(isNaN(d)) return null;
  return Math.max(0,Math.round((Date.now()-d.getTime())/86400000));
}
/* Lot contracts carry Creator form workflows that only run on a real form submit:
   - "Lot Contract Required Fields" (on validate) blocks Complete unless every takedown
     detail is filled in
   - "Create Takedown Schedule 2" (on success) inserts the Takedown_Schedule record
   A widget Data-API write does not run form validation, so completing a Lot contract is
   routed to the native form rather than written directly. */
var LOT_TAKEDOWN_FIELDS=[
  ["Number_of_Lots","Lot Total"],
  ["Initial_Takedown","Initial Take (Lots)"],
  ["Initial_Takedown_Days","Initial Take (Days)"],
  ["Subsequent_Takedown_Lots","Cont'd Take (Lots)"],
  ["Subsequent_Takedown_Days","Cont'd Take (Days)"]
];
function isLotContract(c){ return String(c&&c.Contract_Type||"")==="Lot"; }
function lotCompletionBlockers(c){
  if(!isLotContract(c)) return [];
  return LOT_TAKEDOWN_FIELDS.filter(function(f){
    var v=c[f[0]];
    return v==null||String(v).trim()==="";
  }).map(function(f){ return f[1]; });
}
/* returns true when the caller should stop because completion was handled here */
function guardLotCompletion(c,status){
  if(status!=="Complete"||!isLotContract(c)) return false;
  var missing=lotCompletionBlockers(c);
  if(missing.length){
    banner("err","Add all Lot Takedown details before moving this contract to Complete — missing: "+missing.join(", ")+".");
    renderAll();
    return true;
  }
  if(window.confirm("Completing a Lot contract also creates its Takedown Schedule.\n\nThat automation only runs on the contract form, so this will open the contract in Creator — set Status to Complete there and save.")){
    openRecord(CFG.forms.contract,CFG.reports.contracts,String(c.ID));
  }
  renderAll();
  return true;
}
function setContractStatus(id,status){
  if(S.busy) return;
  var target=findContract(id);
  if(target&&guardLotCompletion(target,status)) return;
  /* mirrors the "Set Completion Date - Contract" workflow, which a Data API write skips */
  var payload={Status:status};
  if(status==="Complete"&&target&&!toInput(target.Completion_Date)) payload.Completion_Date=toZoho(todayInput());
  if(S.demo){ var dc=findContract(id); if(dc){ dc.Status=status; if(payload.Completion_Date) dc.Completion_Date=payload.Completion_Date; } banner("ok","Status updated."); renderAll(); return; }
  S.busy=true; setStatus("warn","Saving…");
  updateRecord(String(id),payload,CFG.reports.contracts).then(function(){
    var c=findContract(id); if(c){ c.Status=status; if(payload.Completion_Date) c.Completion_Date=payload.Completion_Date; }
    S.busy=false; setStatus("ok","Connected"); banner("ok","Status updated to "+status+"."); renderAll();
  }).catch(function(e){
    S.busy=false; setStatus("err","Save failed"); banner("err","Status update failed: "+errText(e)); renderAll();
  });
}
/* every status that exists: shared vocabulary plus anything stray in the data */
function allContractStatuses(){
  var out=CONTRACT_STATUSES.slice();
  S.contracts.forEach(function(c){
    var s=String(c.Status||"");
    if(s && out.indexOf(s)<0) out.push(s);
  });
  return out;
}

function mselOptions(kind){

    var out=TYPES.slice();

  return allContractStatuses();

function mselBtn(kind,label){
  var sel=mselSelected(kind);
  var txt=sel.length===0?("All "+label):(sel.length===1?sel[0]:sel.length+" selected");
  return '<button class="msel-btn'+(sel.length?" on":"")+'" onclick="mselOpen(event,\'' + kind + '\')" title="Filter by '+label+'">'
    +'<span class="msel-txt">'+esc(txt)+'</span>'
    +(sel.length>1?'<span class="msel-n">'+sel.length+'</span>':'')

function mselClosePop(){ var p=document.querySelector(".msel-pop"); if(p) p.remove(); }
function mselRows(kind){
  var sel=mselSelected(kind);
  return mselOptions(kind).map(function(o){
    var dot=kind==="status"?'<span class="msel-dot" style="background:'+((STATUS_COLORS[o]||["#eef2f7","#5c7394"])[1])+'"></span>':'';
    return '<div class="msel-opt'+(sel.indexOf(o)>=0?" on":"")+'" data-val="'+attr(o)+'" onclick="mselToggle(\'' + kind + '\',this.getAttribute(\'data-val\'))">'
      +'<span class="msel-box">\u2713</span>'+dot+'<span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis">'+esc(o)+'</span></div>';
  }).join("");
}
function mselOpen(ev,kind){
  ev.stopPropagation();
  var existing=document.querySelector(".msel-pop");
  var same=existing&&existing.getAttribute("data-kind")===kind;
  mselClosePop();
  if(same) return;
  var pop=document.createElement("div");
  pop.className="msel-pop"; pop.setAttribute("data-kind",kind);
  pop.innerHTML='<div class="msel-search"><input id="mselSearch" placeholder="Search '+esc(kind==="type"?"types":"statuses")+'\u2026" autocomplete="off"/></div>'
    +'<div class="msel-list" id="mselList">'+mselRows(kind)+'</div>'
    +'<div class="msel-foot"><button onclick="mselAll(\'' + kind + '\')">Select all</button><button onclick="mselClear(\'' + kind + '\')">Clear</button></div>';
  document.body.appendChild(pop);
  var r=ev.currentTarget.getBoundingClientRect();
  var top=r.bottom+6, left=r.left;
  if(left+288>window.innerWidth) left=Math.max(8,window.innerWidth-296);
  if(top+340>window.innerHeight) top=Math.max(8,window.innerHeight-348);
  pop.style.top=top+"px"; pop.style.left=left+"px";
  var si=pop.querySelector("#mselSearch");
  si.addEventListener("input",function(){
    var q=si.value.toLowerCase(), any=false;
    pop.querySelectorAll(".msel-opt").forEach(function(row){
      var hit=row.textContent.toLowerCase().indexOf(q)>=0;
      row.style.display=hit?"":"none";
      if(hit) any=true;
    });
    var empty=pop.querySelector(".msel-empty");
    if(!any&&!empty){ var d=document.createElement("div"); d.className="msel-empty"; d.textContent="No matches"; pop.querySelector("#mselList").appendChild(d); }
    else if(any&&empty) empty.remove();
  });
  si.focus();
}
function mselRefresh(kind){
  var list=document.getElementById("mselList");
  if(list) list.innerHTML=mselRows(kind);
  renderAll();
}
function mselToggle(kind,val){
  var arr=mselSelected(kind), i=arr.indexOf(val);
  if(i>=0) arr.splice(i,1); else arr.push(val);
  mselRefresh(kind);
}
function mselAll(kind){
  var arr=mselSelected(kind);
  arr.length=0; mselOptions(kind).forEach(function(o){ arr.push(o); });
  mselRefresh(kind);
}
function mselClear(kind){ mselSelected(kind).length=0; mselRefresh(kind); }

function filteredContracts(){

  return S.contracts.filter(function(c){
    /* archived hidden by default; the Archived pill toggles them into the list */

    if(S.fStatuses.length && S.fStatuses.indexOf(String(c.Status||""))<0) return false;

      var hay=(String(c.Contract_Name||"")+" "+displayValue(c.Subdivision1)+" "+displayValue(c.Builder)+" "+String(c.Contract_Type||"")+" "+currentActionText(c.ID)).toLowerCase();
      if(hay.indexOf(q)<0) return false;

function sortContracts(list){
  var k=S.sortKey,d=S.sortDir;
  return list.slice().sort(function(a,b){
    var va,vb;
    if(k==="Subdivision1"){ va=displayValue(a.Subdivision1); vb=displayValue(b.Subdivision1); }
    else if(k==="Builder"){ va=displayValue(a.Builder); vb=displayValue(b.Builder); }
    else if(k==="pct"){ va=statsFor(a.ID).pct; vb=statsFor(b.ID).pct; return (va-vb)*d; }
    else { va=String(a[k]||""); vb=String(b[k]||""); }
    return String(va).localeCompare(String(vb))*d;
  });
}
function sortBy(k){ if(S.sortKey===k) S.sortDir*=-1; else { S.sortKey=k; S.sortDir=1; } renderAll(); }

function findApproval(id){ for(var i=0;i<S.approvals.length;i++) if(String(S.approvals[i].ID)===String(id)) return S.approvals[i]; return null; }
function aprSelect(f,id,val,opts,blank){
  return '<select class="apr-in" data-f="'+f+'" data-id="'+id+'" onchange="aprSave(this)">'
    +(blank?'<option value="">—</option>':'')
    +opts.map(function(o){ return '<option'+(o===val?" selected":"")+'>'+esc(o)+'</option>'; }).join("")+'</select>';
}
function aprSave(el){
  var id=el.getAttribute("data-id"), f=el.getAttribute("data-f");
  var a=findApproval(id); if(!a) return;
  var val=el.value;
  if(String(val)===String(a[f]||"")) return;
  var data={}; data[f]=(f==="Approval_Sequence")?num(val):val;
  if(f==="Status"&&val==="Approved"&&!toInput(a.Approval_Date)) data.Approval_Date=toZoho(todayInput());
  function apply(){
    Object.keys(data).forEach(function(k){ a[k]=data[k]; });
    el.classList.add("saved"); setTimeout(function(){ el.classList.remove("saved"); },1200);
    if(f==="Status") showApprovalsModal(lookupId(a.Contract1));
  }
  if(S.demo){ apply(); return; }
  updateRecord(String(id),data,CFG.reports.approvals).then(apply)
    .catch(function(e){ banner("err","Approval save failed: "+errText(e)); });
}
function aprToggleEmail(id){
  var a=findApproval(id); if(!a) return;
  var next=!truthy(a.Approval_Email);
  function apply(){ a.Approval_Email=next; showApprovalsModal(lookupId(a.Contract1)); }
  if(S.demo){ apply(); return; }
  updateRecord(String(id),{Approval_Email:next},CFG.reports.approvals).then(apply)
    .catch(function(e){ banner("err","Save failed: "+errText(e)); });
}
function aprAdd(cid){
  var email=($("na_email")&&$("na_email").value||"").trim();
  var type=$("na_type")&&$("na_type").value;
  var seq=num($("na_seq")&&$("na_seq").value);
  if(!email||!type){ banner("err","Enter an approver email and type."); return; }
  if(!seq){ var mx=0; approvalsFor(cid).forEach(function(a){ if(num(a.Approval_Sequence)>mx) mx=num(a.Approval_Sequence); }); seq=mx+1; }
  var fieldData={ Contract1:String(cid), Approver:email, Type1:type, Approval_Sequence:seq, Approval_Email:true };
  createRecord(CFG.forms.approval,fieldData).then(function(resp){
    banner("ok","Approver added.");
    if(S.demo){
      var local=JSON.parse(JSON.stringify(fieldData));
      local.ID=String((resp&&resp.data&&resp.data.ID)||("demo_"+Date.now()));
      local.Contract1={ID:String(cid),display_value:""}; local.Status="Not Sent";
      S.approvals.push(local); showApprovalsModal(cid);
    } else {
      sdkGetAll(CFG.reports.approvals).then(function(rows){ S.approvals=rows; showApprovalsModal(cid); }).catch(function(){ showApprovalsModal(cid); });
    }
  }).catch(function(e){ banner("err","Could not add the approver: "+errText(e)); });
}

/* ---------------- attachment upload + preview (pattern from Budget Manager) ---------------- */
function runtimeEnv(){
  var sources=[];
  try{ if(document.referrer) sources.push(document.referrer); }catch(e){}
  try{ sources.push(String(window.location.href||"")); }catch(e){}
  for(var i=0;i<sources.length;i++){
    var m=String(sources[i]).match(/environment\/(development|stage)\b/i);
    if(m) return m[1].toLowerCase();
    m=String(sources[i]).match(/\/(dev|stage)\/contract-management\//i);
    if(m) return m[1].toLowerCase()==="dev"?"development":"stage";
  }
  return "";
}
function versionFilePath(v){
  var raw=String(v&&v.File_field1||"");
  var m=raw.match(/[?&]filepath=([^&]+)/);
  if(m){ try{ return decodeURIComponent(m[1]).replace(/^\/+/,""); }catch(e){ return m[1].replace(/^\/+/,""); } }
  return "";
}
/* Creator's stock report preview URL — isPreview=true keeps it from downloading */
function versionPreviewUrl(v){
  var fp=versionFilePath(v);
  if(!fp) return "";
  var env=runtimeEnv();
  var envApp=CFG.creatorApp+(env?"-"+env:"");
  return CFG.creatorHost+"/"+encodeURIComponent(CFG.creatorOwner)+"/"+encodeURIComponent(envApp)
    +"/report/"+encodeURIComponent(CFG.reports.versions)+"/"+encodeURIComponent(String(v.ID))
    +"/"+encodeURIComponent(CFG.fileField)+"/download-file?filepath=/"+encodeURIComponent(fp)
    +"&digestValue=eyJsYW5ndWFnZSI6ImVuIn0=&isPreview=true";
}
function attachmentExt(name){ var m=String(name||"").toLowerCase().match(/\.([a-z0-9]+)$/); return m?m[1]:""; }
function attachmentMime(name){
  var map={pdf:"application/pdf",png:"image/png",jpg:"image/jpeg",jpeg:"image/jpeg",gif:"image/gif",webp:"image/webp",svg:"image/svg+xml",
    txt:"text/plain",csv:"text/csv",json:"application/json",html:"text/html",htm:"text/html",
    mp3:"audio/mpeg",wav:"audio/wav",mp4:"video/mp4",webm:"video/webm",mov:"video/quicktime"};
  return map[attachmentExt(name)]||"application/octet-stream";
}
function sdkReadVersionFile(recordId){
  if(!S.liveSDK) return Promise.reject({message:"Preview requires the live Creator widget."});
  if(!window.ZOHO||!ZOHO.CREATOR||!ZOHO.CREATOR.API||typeof ZOHO.CREATOR.API.readFile!=="function")
    return Promise.reject({message:"Creator file read API unavailable."});
  return ZOHO.CREATOR.API.readFile({reportName:CFG.reports.versions,id:String(recordId),fieldName:CFG.fileField});
}
function sdkUploadVersionFile(recordId,file){
  if(S.demo) return Promise.resolve({code:3000});
  if(!window.ZOHO||!ZOHO.CREATOR||!ZOHO.CREATOR.API||typeof ZOHO.CREATOR.API.uploadFile!=="function")
    return Promise.reject({message:"Creator file upload API unavailable."});
  return ZOHO.CREATOR.API.uploadFile({reportName:CFG.reports.versions,id:String(recordId),fieldName:CFG.fileField,file:file});
}
function base64ToBlob(b64,mime){
  var bin=atob(b64),len=bin.length,bytes=new Uint8Array(len);
  for(var i=0;i<len;i++) bytes[i]=bin.charCodeAt(i);
  return new Blob([bytes],{type:mime||"application/octet-stream"});
}
/* Creator readFile returns a JS byte string — Blob([string]) would UTF-8 encode and
   corrupt binary files, so preserve each character's low byte (Budget Manager pattern) */
function binaryStringToBlob(text,mime){
  var len=text.length,bytes=new Uint8Array(len);
  for(var i=0;i<len;i++) bytes[i]=text.charCodeAt(i)&0xff;
  return new Blob([bytes],{type:mime||"application/octet-stream"});
}
function looksLikeBase64(text){
  var t=String(text||"").replace(/\s+/g,"");
  if(t.length<80||t.length%4!==0||!/^[A-Za-z0-9+/]+={0,2}$/.test(t)) return false;
  try{
    var head=atob(t.slice(0,96));
    return head.indexOf("%PDF-")===0||head.indexOf("PK\x03\x04")===0||head.indexOf("\x89PNG")===0||head.indexOf("GIF8")===0||head.indexOf("RIFF")===0;
  }catch(e){ return false; }
}
function fileResponseToBlob(resp,mime){
  function convert(value,depth){
    if(depth>5||value==null) return null;
    if(typeof Blob!=="undefined"&&value instanceof Blob) return value.type?value:value.slice(0,value.size,mime);
    if(typeof ArrayBuffer!=="undefined"&&value instanceof ArrayBuffer) return new Blob([value],{type:mime});
    if(typeof value==="string"){
      var dm=value.match(/^data:([^;,]+)?(;base64)?,(.*)$/);
      if(dm) return dm[2]?base64ToBlob(dm[3],dm[1]||mime):new Blob([decodeURIComponent(dm[3])],{type:dm[1]||mime});
      if(looksLikeBase64(value)) return base64ToBlob(value.replace(/\s+/g,""),mime);
      return binaryStringToBlob(value,mime);
    }
    if(typeof value==="object"){
      var keys=["filecontent","file_content","content","body","value","response","responseText","payload","data","result"];
      for(var i=0;i<keys.length;i++){
        if(Object.prototype.hasOwnProperty.call(value,keys[i])){
          var found=convert(value[keys[i]],depth+1);
          if(found) return found;
        }
      }
    }
    return null;
  }
  var blob=convert(resp,0);
  if(!blob||!blob.size) return null;
  return blob.type?blob:blob.slice(0,blob.size,mime);
}
var PREV_URL="", PREV_TOKEN=0, PREV_MSG=null;
function closePreview(){
  var el=$("prevpane"); if(el) el.remove();
  if(PREV_URL){ try{ URL.revokeObjectURL(PREV_URL); }catch(e){} PREV_URL=""; }
  if(PREV_MSG){ try{ window.removeEventListener("message",PREV_MSG); }catch(e){} PREV_MSG=null; }
  PREV_TOKEN++;
}
/* ---- PDF preview: exact Budget Manager pipeline ----
   Creator's download-file URL cannot be iframed from a widget (blank/blocked frame),
   so PDF bytes are fetched as base64 (custom API first, widget readFile fallback)
   and rendered by the isolated PDF.js viewer packaged with this widget. */
function parsePreviewResponse(resp){
  var value=resp;
  for(var depth=0;depth<5;depth++){
    if(value==null) break;
    if(typeof value==="string"){
      var text=value.trim(); if(!text) break;
      try{ value=JSON.parse(text); continue; }catch(e){ break; }
    }
    if(typeof value==="object"){
      if(value.ok===true||value.base64||value.message) return value;
      if(Object.prototype.hasOwnProperty.call(value,"result")){ value=value.result; continue; }
      if(Object.prototype.hasOwnProperty.call(value,"data")){ value=value.data; continue; }
      if(Object.prototype.hasOwnProperty.call(value,"response")){ value=value.response; continue; }
    }
    break;
  }
  return value&&typeof value==="object"?value:null;
}
function normalizePdfBase64(value){
  var text=String(value||"").trim();
  var dm=text.match(/^data:application\/pdf;base64,(.*)$/i);
  if(dm) text=dm[1];
  text=text.replace(/\s+/g,"").replace(/-/g,"+").replace(/_/g,"/");
  while(text.length%4) text+="=";
  if(!text) throw {message:"Creator returned an empty PDF preview payload."};
  var head=atob(text.slice(0,Math.min(text.length,120)));
  if(head.indexOf("%PDF-")!==0) throw {message:"Creator did not return PDF bytes."};
  return text;
}
function blobToBase64(blob){
  return blob.arrayBuffer().then(function(buf){
    var bytes=new Uint8Array(buf), out="", CH=8192;
    for(var i=0;i<bytes.length;i+=CH){
      out+=String.fromCharCode.apply(null,bytes.subarray(i,Math.min(i+CH,bytes.length)));
    }
    return btoa(out);
  });
}
function getVersionPdfBase64(v){
  var cid=lookupId(v.Contract1);
  return sdkInvoke({api_name:CFG.customApis.attachmentPreview,http_method:"POST",content_type:"application/json",
    payload:{contractId:String(cid),attachmentId:String(v.ID)}})
    .then(function(resp){
      var payload=parsePreviewResponse(resp);
      if(!payload||payload.ok!==true) throw {message:(payload&&payload.message)||"Preview API unavailable."};
      return normalizePdfBase64(payload.base64);
    })
    .catch(function(apiErr){
      diag("Preview custom API unavailable, falling back to readFile",apiErr);
      return sdkReadVersionFile(v.ID).then(function(resp){
        var blob=fileResponseToBlob(resp,"application/pdf");
        if(!blob) throw {message:"Creator did not return readable file content."};
        return blobToBase64(blob).then(normalizePdfBase64);
      });
    });
}
function renderPdfIsolated(base64,name,vid){
  var body=$("prevBody"); if(!body) return;
  var token=PREV_TOKEN;
  body.innerHTML='<iframe id="cmPdfFrame" class="prev-frame" title="'+attr(name)+'" src="pdf-preview.html" allow="fullscreen"></iframe>';
  var frame=$("cmPdfFrame");
  var timeout=setTimeout(function(){
    if(token!==PREV_TOKEN) return;
    var b=$("prevBody");
    if(b) b.innerHTML='<div class="prev-state"><h3>Preview timed out</h3><p>The PDF viewer did not initialize.</p><button class="btn primary" onclick="openVersionFile(\''+vid+'\')">Open the file ↗</button></div>';
  },20000);
  var sent=false;
  PREV_MSG=function(ev){
    if(token!==PREV_TOKEN||!frame||ev.source!==frame.contentWindow) return;
    var data=ev.data||{};
    if(data.type==="budget-pdf-preview-ready"&&!sent){
      sent=true;
      try{ frame.contentWindow.postMessage({type:"budget-pdf-preview-load",fileName:name,base64:base64},"*"); }
      catch(e){ clearTimeout(timeout); }
    } else if(data.type==="budget-pdf-preview-loaded"){
      clearTimeout(timeout);
    } else if(data.type==="budget-pdf-preview-error"){
      clearTimeout(timeout);
      var b=$("prevBody");
      if(b) b.innerHTML='<div class="prev-state"><h3>Could not preview PDF</h3><p>'+esc(String(data.message||"Unknown error"))+'</p><button class="btn primary" onclick="openVersionFile(\''+vid+'\')">Open the file ↗</button></div>';
    }
  };
  window.addEventListener("message",PREV_MSG);
}
function downloadVersion(vid){
  var v=findVersion(vid); if(!v) return;
  var name=fileDisplayName(v);
  sdkReadVersionFile(vid).then(function(resp){
    var blob=fileResponseToBlob(resp,attachmentMime(name));
    if(!blob) throw {message:"no content"};
    var url=URL.createObjectURL(blob);
    var a=document.createElement("a");
    a.href=url; a.download=name; a.style.display="none";
    document.body.appendChild(a); a.click();
    setTimeout(function(){ try{ a.remove(); URL.revokeObjectURL(url); }catch(e){} },800);
  }).catch(function(){ openVersionFile(vid); });
}
function deleteVersion(vid,cid){
  var v=findVersion(vid); if(!v||S.busy) return;
  if(!window.confirm("Delete this attachment?\n\n"+fileDisplayName(v))) return;
  if(S.demo){ S.versions=S.versions.filter(function(x){ return String(x.ID)!==String(vid); }); banner("ok","Attachment deleted."); showAttachmentsModal(cid); return; }
  S.busy=true; setStatus("warn","Deleting…");
  ZOHO.CREATOR.API.deleteRecord({reportName:CFG.reports.versions,id:String(vid)}).then(function(){
    S.versions=S.versions.filter(function(x){ return String(x.ID)!==String(vid); });
    S.busy=false; setStatus("ok","Connected"); banner("ok","Attachment deleted."); showAttachmentsModal(cid);
  }).catch(function(e){ S.busy=false; setStatus("err","Delete failed"); banner("err","Delete failed: "+errText(e)); });
}
function previewShell(name,inner,vid){
  closePreview();
  var wrap=document.createElement("div");
  wrap.id="prevpane";
  wrap.innerHTML='<div class="prev-back" onclick="if(event.target===this)closePreview()"><div class="prev-pane">'
    +'<div class="prev-head"><div class="prev-title"><div class="prev-kicker">Attachment preview</div><div class="prev-name">'+esc(name)+'</div></div>'
    +'<button class="btn sm" onclick="openVersionFile(\''+vid+'\')">Open ↗</button>'
    +'<button class="modal-x" style="background:#eef2f8;color:#5a6b85" onclick="closePreview()" title="Close">✕</button></div>'
    +'<div class="prev-body" id="prevBody">'+inner+'</div>'
    +'</div></div>';
  document.body.appendChild(wrap);
}
function prevSpinner(msg){
  return '<div class="prev-state"><div class="spinner"></div><h3>'+esc(msg||"Loading preview")+'</h3><p>Reading the file from Creator…</p></div>';
}
function previewVersion(vid){
  var v=findVersion(vid); if(!v) return;
  var name=fileDisplayName(v);
  var ext=attachmentExt(name), mime=attachmentMime(name);
  var noPreview='<div class="prev-state"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>'
    +'<h3>No inline preview for .'+esc(ext||"file")+'</h3><p>Word and Excel files open in Creator\'s own viewer instead.</p>'
    +'<button class="btn primary" onclick="openVersionFile(\''+vid+'\')">Open the file ↗</button></div>';
  if(mime==="application/pdf"||ext==="pdf"){
    previewShell(name,prevSpinner("Loading PDF"),vid);
    var token=PREV_TOKEN;
    getVersionPdfBase64(v).then(function(b64){
      if(token!==PREV_TOKEN) return;
      renderPdfIsolated(b64,name,vid);
    }).catch(function(e){
      if(token!==PREV_TOKEN) return;
      var b=$("prevBody");
      if(b) b.innerHTML='<div class="prev-state"><h3>Could not preview PDF</h3><p>'+esc(errText(e))+'</p><button class="btn primary" onclick="openVersionFile(\''+vid+'\')">Open the file ↗</button></div>';
    });
    return;
  }
  if(mime.indexOf("image/")===0){
    previewShell(name,prevSpinner("Loading image"),vid);
    previewImageViaRead(vid,name,mime);
    return;
  }
  if(["txt","csv","json","html","htm"].indexOf(ext)>=0){
    previewShell(name,prevSpinner("Loading file"),vid);
    sdkReadVersionFile(vid).then(function(resp){
      var blob=fileResponseToBlob(resp,mime);
      if(!blob) throw {message:"no content"};
      PREV_URL=URL.createObjectURL(blob);
      var b=$("prevBody"); if(b) b.innerHTML='<iframe class="prev-frame" title="'+attr(name)+'" src="'+attr(PREV_URL)+'"></iframe>';
    }).catch(function(){ var b=$("prevBody"); if(b) b.innerHTML=noPreview; });
    return;
  }
  previewShell(name,noPreview,vid);
}
function previewImageViaRead(vid,name,mime){
  sdkReadVersionFile(vid).then(function(resp){
    var blob=fileResponseToBlob(resp,mime);
    if(!blob) throw {message:"Creator did not return readable file content."};
    PREV_URL=URL.createObjectURL(blob);
    var body=$("prevBody"); if(body) body.innerHTML='<img class="prev-img" alt="'+attr(name)+'" src="'+attr(PREV_URL)+'"/>';
  }).catch(function(e){
    var body=$("prevBody");
    if(body) body.innerHTML='<div class="prev-state"><h3>Preview unavailable</h3><p>'+esc(errText(e))+'</p><button class="btn primary" onclick="openVersionFile(\''+vid+'\')">Open the file ↗</button></div>';
  });
}
function addVersionFiles(cid,fileList){
  var files=Array.prototype.slice.call(fileList||[]);
  if(!files.length||S.busy) return;
  var big=files.find(function(f){ return f&&f.size>50*1024*1024; });
  if(big){ attStatus(cid,big.name+" exceeds Zoho Creator's 50 MB limit.",true); return; }
  S.busy=true;
  var chain=Promise.resolve();
  files.forEach(function(file,i){
    chain=chain.then(function(){
      attStatus(cid,"Uploading "+(i+1)+" of "+files.length+": "+file.name);
      return createRecord(CFG.forms.version,{Contract1:String(cid),Date_field1:toZoho(todayInput())}).then(function(resp){
        var vid=(resp&&resp.data&&(resp.data.ID||resp.data.id))||(resp&&resp.result&&resp.result.data&&resp.result.data.ID);
        if(!vid) throw {message:"Version record was not created."};
        if(S.demo){
          S.versions.push({ID:String(vid),Contract1:[{ID:String(cid),display_value:""}],File_field1:"/file/"+file.name,Date_field1:toZoho(todayInput()),Email_Attachment:"false"});
          return;
        }
        return sdkUploadVersionFile(vid,file);
      });
    });
  });
  chain.then(function(){
    S.busy=false;
    banner("ok",files.length+" file"+(files.length===1?"":"s")+" uploaded.");
    if(S.demo){ showAttachmentsModal(cid); return; }
    sdkGetAll(CFG.reports.versions).then(function(rows){ S.versions=rows; showAttachmentsModal(cid); })
      .catch(function(){ showAttachmentsModal(cid); });
  }).catch(function(e){
    S.busy=false;
    attStatus(cid,"Upload failed: "+errText(e),true);
  });
}
function attStatus(cid,msg,isErr){
  var el=$("attStatus");
  if(el){ el.textContent=msg; el.className="att-status"+(isErr?" err":""); }
  else banner(isErr?"err":"ok",msg);
}
function showAttachmentsModal(cid){
  var km=document.querySelector(".kmenu"); if(km) km.remove();
  var c=findContract(cid); if(!c) return;
  var vers=versionsFor(cid);
  var rows=vers.map(function(v){
    var name=fileDisplayName(v);
    var lower=name.toLowerCase(), ic="", lbl="DOC";
    if(/\.pdf$/.test(lower)){ ic="pdf"; lbl="PDF"; }
    else if(/\.(xls|xlsx)$/.test(lower)){ ic="xls"; lbl="XLS"; }
    else if(/\.(doc|docx)$/.test(lower)){ ic="doc"; lbl="DOC"; }
    else if(/\.(png|jpe?g|gif|webp)$/.test(lower)){ lbl="IMG"; }
    return '<div class="att-row"><div class="attach-icon '+ic+'">'+lbl+'</div>'
      +'<div style="flex:1;min-width:0"><span class="att-open" onclick="previewVersion(\''+v.ID+'\')" title="Preview this file">'+esc(name)+'</span>'
      +'<div class="att-sub">'+esc(fmtDate(v.Date_field1)||"Added")
      +' \u00b7 Added by <b>'+esc(String(v.Added_User||v.Modified_User||"\u2014"))+'</b>'
      +(truthy(v.Email_Attachment)?' \u00b7 <b style="color:var(--green)">on approval email</b>':"")+'</div></div>'
      +'<span class="fbtns">'
      +'<button class="fbtn" title="Preview" onclick="previewVersion(\''+v.ID+'\')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg></button>'
      +'<button class="fbtn" title="Download" onclick="downloadVersion(\''+v.ID+'\')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg></button>'
      +'<button class="fbtn del" title="Delete" onclick="deleteVersion(\''+v.ID+'\',\''+cid+'\')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg></button>'
      +'</span></div>';
  }).join("");
  openModal(
    modalHead("Attachments · "+vers.length+" file"+(vers.length===1?"":"s"),c.Contract_Name||"Contract")
    +'<div class="modal-body">'
    +'<div class="att-drop" id="attDrop"><svg style="width:20px;height:20px;color:#7c9aca;flex:none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M17 8l-5-5-5 5"/><path d="M12 3v12"/></svg>'
    +'<div class="att-hint"><b>Drop files here or click to upload</b>Creates a Contract Version record per file · 50 MB max</div>'
    +'<button class="btn primary sm" onclick="document.getElementById(\'attFile\').click()">Choose Files</button>'
    +'<input type="file" id="attFile" multiple style="display:none"/></div>'
    +'<div class="att-status" id="attStatus"></div>'
    +(vers.length?rows:'<div class="empty" style="padding:22px"><b>No attachments yet</b>Drop the first contract file above.</div>')
    +'</div>'
    +'<div class="modal-foot"><span style="font-size:11px;color:var(--faint)">Click a file to preview it in place · ↗ opens Creator\'s viewer</span><div class="spacer"></div>'
    +'<button class="btn sm" onclick="closeOverlays();openRecord(CFG.forms.contract,CFG.reports.contracts,\''+cid+'\')">Open Contract ↗</button></div>'
  );
  var drop=$("attDrop"), fin=$("attFile");
  if(fin) fin.addEventListener("change",function(){ addVersionFiles(cid,fin.files); });
  if(drop){
    drop.addEventListener("dragover",function(e){ e.preventDefault(); drop.classList.add("dragover"); });
    drop.addEventListener("dragleave",function(){ drop.classList.remove("dragover"); });
    drop.addEventListener("drop",function(e){ e.preventDefault(); drop.classList.remove("dragover"); addVersionFiles(cid,e.dataTransfer.files); });
    drop.addEventListener("click",function(e){ if(e.target===drop||e.target.closest(".att-hint")) fin.click(); });
  }
}

function afSave(el){
  var id=el.getAttribute("data-aid"), f=el.getAttribute("data-af");
  var a=findAction(id); if(!a) return;
  var raw=el.value;
  var isDate=(f==="Start_Date"||f==="Due_Date"||f==="Complete_Date");
  var val=isDate?toZoho(raw):raw;
  var oldV=isDate?toZoho(toInput(a[f])):(a[f]==null?"":String(a[f]));
  if(String(val)===String(oldV)) return;
  var data={}; data[f]=val;
  var updates=[], needRender=false;
  if(f==="Status"&&raw==="Complete"&&!truthy(a.Complete)){
    data.Complete=true; data.Current_Action=false;
    if(!toInput(a.Complete_Date)) data.Complete_Date=toZoho(todayInput());
    updates.push([id,data]); advanceCurrent(id,updates); needRender=true;
  } else if(f==="Status"&&raw!=="Complete"&&truthy(a.Complete)){
    data.Complete=false; data.Complete_Date="";
    updates.push([id,data]);
    var pend={}; pend[id]=data;
    ensureCurrentUpdates(lookupId(a.Contract1),updates,pend);
    needRender=true;
  } else {
    updates.push([id,data]);
  }
  runUpdatesQuiet(updates).then(function(){
    flashSaved(el);
    afState(id,"ok");
    setTimeout(function(){
      if(needRender||document.activeElement!==el) renderAll();
    },needRender?900:1700);
  }).catch(function(e){
    el.classList.add("save-err");

function wireDrillDrag(){
  document.querySelectorAll("[data-ddrag]").forEach(function(h){
    h.addEventListener("dragstart",function(e){
      drillDragId=h.getAttribute("data-ddrag");
      var w=h.closest(".dact-wrap"); if(w) w.style.opacity=".4";
      e.dataTransfer.effectAllowed="move";
      try{ e.dataTransfer.setData("text/plain",drillDragId); }catch(err){}
    });
    h.addEventListener("dragend",function(){
      drillDragId=null;
      document.querySelectorAll(".dact-wrap").forEach(function(w){ w.style.opacity=""; w.classList.remove("dragover"); });
    });
  });
  document.querySelectorAll(".dact-wrap[data-drow]").forEach(function(w){
    w.addEventListener("dragover",function(e){
      if(!drillDragId||w.getAttribute("data-drow")===drillDragId) return;
      var a=findAction(drillDragId), b=findAction(w.getAttribute("data-drow"));
      if(!a||!b||lookupId(a.Contract1)!==lookupId(b.Contract1)) return;
      e.preventDefault(); e.dataTransfer.dropEffect="move"; w.classList.add("dragover");
    });
    w.addEventListener("dragleave",function(){ w.classList.remove("dragover"); });
    w.addEventListener("drop",function(e){
      e.preventDefault(); w.classList.remove("dragover");
      var t=w.getAttribute("data-drow");
      if(!drillDragId||t===drillDragId) return;
      dropReorder(drillDragId,t);
      drillDragId=null;
    });
  });
}

var STATUS_COURT={

  "Proposed":["\u25c0","#b45309","Ball with WBW"],
  "Feasibility":["\u25c0","#b45309","Ball with WBW"],

  "Approval Rejected":["!","#b91c1c","Rejected \u2014 blocked"],

};
function courtGlyph(status){
  var c=STATUS_COURT[status];
  /* unknown/renamed status: neutral dot, raw value in the tooltip - never a wrong label */
  return c||["\u2022","#94a3b8",String(status||"Unknown status")];
}
function mdShort(input){ if(!input) return ""; return String(parseInt(input.slice(5,7),10))+"/"+input.slice(8,10); }
/* short aging label under the due date */
function agingText(a){
  if(truthy(a.Complete)){
    var cd=toInput(a.Complete_Date);
    return cd?["\u2713 "+mdShort(cd),"#047857"]:["\u2713 no date","#b45309"];
  }
  var d=toInput(a.Due_Date);
  if(!d) return ["no due",truthy(a.Current_Action)?"#c2410c":"#8ea0bd"];
  var diff=daysBetween(todayInput(),d);
  if(diff==null) return ["",""];
  if(diff<0) return [(-diff)+"d late","#dc2626"];
  if(diff===0) return ["today","#b45309"];
  if(diff<=5) return ["in "+diff+"d","#b45309"];
  return [mdShort(d),"#8ea0bd"];
}
/* read-only sentence in the panel: the detail the 116px lane cannot hold */
function agingStrip(a){
  var parts=[], sd=toInput(a.Start_Date), dd=toInput(a.Due_Date), cd=toInput(a.Complete_Date);
  if(truthy(a.Complete)){
    if(sd) parts.push("Started "+mdShort(sd));
    if(cd&&sd){ var n=daysBetween(sd,cd); if(n!=null) parts.push("closed in "+n+"d"); }
    if(!cd) parts.push('<span class="warn">Completed: date not recorded</span>');
    return parts.length?parts.join(" \u00b7 "):"Completed";
  }
  if(dd) parts.push("Due "+fmtDate(a.Due_Date));
  if(sd){
    parts.push("Started "+fmtDate(a.Start_Date));
    var f=daysBetween(sd,todayInput());
    if(f!=null&&f>=0) parts.push(f+"d in flight");
  }
  if(dd){
    var late=daysBetween(dd,todayInput());
    if(late!=null&&late>0) parts.push('<span class="late">'+late+"d past due</span>");
  }
  if(!parts.length) return '<span class="warn">No dates set</span>';
  return parts.join(" \u00b7 ");
}

    var row='<div class="dact" onclick="toggleDact(event,\''+id+'\')" title="'+(open?"Collapse":"Expand to edit")+'">'

/* inline status change from the list; completing with open actions cascades after a warning */
function statusCellChange(cid,status){
  var c=findContract(cid); if(!c||S.busy){ renderAll(); return; }
  if(guardLotCompletion(c,status)) return;
  var openActs=actionsFor(cid).filter(function(a){ return !truthy(a.Complete); });
  if(status==="Complete"&&openActs.length){
    if(!window.confirm("This contract still has "+openActs.length+" unfinished action"+(openActs.length===1?"":"s")+".\n\nMarking the contract Complete will also mark ALL unfinished actions complete as of today. Continue?")){
      renderAll(); return;
    }
    var updates=openActs.map(function(a){
      return [String(a.ID),{Complete:true,Current_Action:false,Status:"Complete",Complete_Date:toZoho(todayInput())}];
    });
    S.busy=true; setStatus("warn","Saving…");
    var p=Promise.resolve();
    updates.forEach(function(u){ p=p.then(function(){ return updateRecord(u[0],u[1],CFG.reports.actions).then(function(){ applyLocal(u[0],u[1]); }); }); });
    var cPayload={Status:"Complete"};
    if(!toInput(c.Completion_Date)) cPayload.Completion_Date=toZoho(todayInput());
    p.then(function(){ return updateRecord(String(cid),cPayload,CFG.reports.contracts); })
     .then(function(){ c.Status="Complete"; S.busy=false; setStatus("ok",S.demo?"Demo data":"Connected"); banner("ok","Contract completed — "+openActs.length+" open action"+(openActs.length===1?"":"s")+" closed out."); renderAll(); })
     .catch(function(e){ S.busy=false; setStatus("err","Save failed"); banner("err","Save failed: "+errText(e)); reloadActions(); });
    return;
  }
  setContractStatus(cid,status);
}

function renderTable(list){
  if(!list.length) return '<div class="tablecard"><div class="empty"><b>No contracts match</b>Adjust the search or filters.</div></div>';
  /* grouped by contract type (declared order first, stray values after) */
  var order=TYPES.slice();
  list.forEach(function(c){ var t=String(c.Contract_Type||"Other"); if(order.indexOf(t)<0) order.push(t); });
  var body="";
  order.forEach(function(t){
    var group=list.filter(function(c){ return String(c.Contract_Type||"Other")===t; });
    if(!group.length) return;
    body+='<tr class="tgroup"><td colspan="7"><span class="tgroup-name">'+esc(t)+'</span><span class="tgroup-n">'+group.length+'</span></td></tr>';
    body+=group.map(contractRow).join("");
  });
  return '<div class="tablecard"><div class="tscroll"><table class="wtable">'
    +'<colgroup><col style="width:88px"/><col style="width:28%"/><col style="width:168px"/>'
    +'<col style="width:19%"/><col style="width:16%"/><col/><col style="width:136px"/></colgroup>'
    +'<thead><tr>'

    +th("Contract Name","Contract_Name")+th("Status","Status")

    +'</tr></thead><tbody>'+body+'</tbody></table></div></div>';
}

/* ---------------- persistence ---------------- */
function applyLocal(id,data){
  var a=findAction(id); if(!a) return;
  Object.keys(data).forEach(function(k){ a[k]=data[k]; });
}
function runUpdates(list){
  /* list: [[id, data], ...] — sequential, then re-render */
  S.busy=true; setStatus("warn","Saving…");
  var p=Promise.resolve();
  list.forEach(function(u){
    p=p.then(function(){ return updateRecord(u[0],u[1],CFG.reports.actions).then(function(){ applyLocal(u[0],u[1]); }); });
  });
  return p.then(function(){
    S.busy=false; setStatus("ok",S.demo?"Demo data":"Connected"); renderAll();
  }).catch(function(e){
    S.busy=false; setStatus("err","Save failed");
    banner("err","Save failed: "+errText(e));
    reloadActions();
  });
}
function reloadActions(){
  if(S.demo){ renderAll(); return; }
  sdkGetAll(CFG.reports.actions).then(function(rows){ S.actions=rows; renderAll(); }).catch(function(){ renderAll(); });
}

/* ensure exactly one open action is Current (Deluge parity) */
function ensureCurrentUpdates(cid,updates,already){
  var all=actionsFor(cid);
  var hasCurrent=all.some(function(a){
    var pend=(already||{})[String(a.ID)];
    var complete=pend&&"Complete" in pend?pend.Complete:truthy(a.Complete);
    var current=pend&&"Current_Action" in pend?pend.Current_Action:truthy(a.Current_Action);
    return !complete&&current;
  });
  if(!hasCurrent){
    for(var i=0;i<all.length;i++){
      var a=all[i], pend=(already||{})[String(a.ID)];
      var complete=pend&&"Complete" in pend?pend.Complete:truthy(a.Complete);
      if(!complete){ updates.push([String(a.ID),{Current_Action:true}]); break; }
    }
  }
}

function saveAction(id){
  var a=findAction(id); if(!a||S.busy) return;
  var dm=$("f_dm_"+id).value;
  if(!dm){ banner("err","Choose an assignee before saving or completing this action."); return; }
  var status=$("f_st_"+id).value;
  var data={
    Dev_Mgr:dm,
    Dev_Notes:$("f_nt_"+id).value,
    Start_Date:toZoho($("f_sd_"+id).value),
    Due_Date:toZoho($("f_dd_"+id).value),
    Complete_Date:toZoho($("f_cd_"+id).value),
    Status:status
  };
  var updates=[];
  if(status==="Complete"){
    data.Complete=true; data.Current_Action=false;
    if(!data.Complete_Date) data.Complete_Date=toZoho(todayInput());
    updates.push([id,data]);
    advanceCurrent(id,updates);
  } else {
    if(truthy(a.Complete)){ data.Complete=false; data.Complete_Date=""; }
    updates.push([id,data]);
    var pend={}; pend[id]=data;
    ensureCurrentUpdates(lookupId(a.Contract1),updates,pend);
  }
  banner("ok","Action updated.");
  runUpdates(updates);
}

function advanceCurrent(completedId,updates){
  var a=findAction(completedId); if(!a) return;
  var cid=lookupId(a.Contract1);
  var all=actionsFor(cid);
  all.forEach(function(r){
    if(String(r.ID)!==String(completedId)&&truthy(r.Current_Action)) updates.push([String(r.ID),{Current_Action:false}]);
  });
  var sort=num(a.Sort_Order), next=null;
  all.forEach(function(r){
    if(String(r.ID)===String(completedId)||truthy(r.Complete)) return;
    if(num(r.Sort_Order)>sort&&(next==null||num(r.Sort_Order)<num(next.Sort_Order))) next=r;
  });
  if(!next){ for(var i=0;i<all.length;i++){ var r=all[i]; if(String(r.ID)!==String(completedId)&&!truthy(r.Complete)){ next=r; break; } } }
  if(next) updates.push([String(next.ID),{Current_Action:true}]);
}

  var a=findAction(id); if(!a||S.busy) return;

/* reorder: arrows swap with visible neighbour; drag reinserts */
/* Move one row up/down. Renumbering the whole list beats swapping two values:
   a swap is a no-op when both rows have a blank or duplicated Sort_Order. */
function moveAction(id,dir){
  if(S.busy) return;
  var a=findAction(id); if(!a) return;
  var order=actionsFor(lookupId(a.Contract1)).map(function(r){ return String(r.ID); });
  var from=order.indexOf(String(id));
  var to=from+dir;
  if(from<0||to<0||to>=order.length) return;
  order.splice(to,0,order.splice(from,1)[0]);
  applyOrder(order);
}
var dragId=null;
function wireDrag(){
  var list=$("alist"); if(!list) return;
  list.querySelectorAll("[data-drag]").forEach(function(h){
    h.addEventListener("dragstart",function(e){
      dragId=h.getAttribute("data-drag");
      var row=h.closest(".arow"); if(row) row.classList.add("dragging");
      e.dataTransfer.effectAllowed="move";
      try{ e.dataTransfer.setData("text/plain",dragId); }catch(err){}
    });
    h.addEventListener("dragend",function(){
      dragId=null;
      list.querySelectorAll(".arow").forEach(function(r){ r.classList.remove("dragging","dragover"); });
    });
  });
  list.querySelectorAll(".arow[data-row]").forEach(function(row){
    row.addEventListener("dragover",function(e){
      if(!dragId||row.getAttribute("data-row")===dragId) return;
      e.preventDefault(); e.dataTransfer.dropEffect="move";
      row.classList.add("dragover");
    });
    row.addEventListener("dragleave",function(){ row.classList.remove("dragover"); });
    row.addEventListener("drop",function(e){
      e.preventDefault(); row.classList.remove("dragover");
      var targetId=row.getAttribute("data-row");
      if(!dragId||targetId===dragId) return;
      dropReorder(dragId,targetId);
      dragId=null;
    });
  });
}
function dropReorder(movedId,beforeId){
  if(S.busy) return;
  var a=findAction(movedId); if(!a) return;
  var cid=lookupId(a.Contract1);
  var all=actionsFor(cid);
  var order=all.map(function(r){ return String(r.ID); });
  var from=order.indexOf(String(movedId)), to=order.indexOf(String(beforeId));
  if(from<0||to<0) return;
  order.splice(from,1);
  to=order.indexOf(String(beforeId));
  order.splice(to,0,String(movedId));
  applyOrder(order);
}

  SCROLL_SELECTORS.forEach(function(sel){
    var el=document.querySelector(sel);
    if(el && el.scrollTop) out.inner[sel]=el.scrollTop;
  });
  return out;
}
function restoreScroll(st){
  var v=$("view");
  if(v && st.view) v.scrollTop=st.view;
  Object.keys(st.inner).forEach(function(sel){
    var el=document.querySelector(sel);
    if(el) el.scrollTop=st.inner[sel];
  });
}
function renderView(){
  if(S.view==="detail"&&S.selId) renderDetail();
  else if(S.view==="loiReview"&&S.loiSelId) renderLOIReview();
  else if(S.homeSection==="loi") renderLOIReviews();
  else { $("crumb").innerHTML='<a onclick="showContracts()">Contracts</a>'; renderHome(); }
}
/* Re-rendering replaces #view, which would reset every scroll container.
   Keep the scroll position whenever we stay on the same screen; only a real
   navigation (different record, section, or list/board mode) starts at the top. */
function renderAll(){
  var key=viewKey();
  var same=(key===LAST_VIEW_KEY);
  var st=same?captureScroll():null;
  renderView();
  LAST_VIEW_KEY=key;
  if(st){
    restoreScroll(st);
    if(window.requestAnimationFrame) requestAnimationFrame(function(){ restoreScroll(st); });
  }
}

/* ---------------- data load ---------------- */
function loadData(){
  setStatus("warn","Loading…");
  Promise.all([
    sdkGetAll(CFG.reports.contracts),
    sdkGetAll(CFG.reports.actions),
    sdkGetAll(CFG.reports.versions).catch(function(){ return []; }),
    loadPendingLOIs().catch(function(){ return []; }),
    sdkGetAll(CFG.reports.approvals).catch(function(){ return []; })
  ]).then(function(res){
    S.contracts=res[0]; S.actions=res[1]; S.versions=res[2]; S.loiReviews=res[3]; S.approvals=res[4];
    setStatus("ok","Connected");
    repairSingleCurrent();
    var qp=S.deepLink||readPageParams(); S.deepLink=qp;
    /* email links send `token=`; older links sent `tokenId=` — accept both */
    if(qp.loiReviewId && findLOI(qp.loiReviewId)){ openLOIReview(qp.loiReviewId,qp.token||qp.tokenId||""); }
    else if(qp.contractId && findContract(qp.contractId)){ openContract(qp.contractId); }
    else renderAll();
  }).catch(function(e){
    setStatus("err","Load failed");
    banner("err","Could not load data: "+errText(e));
    loadDemo();
  });
}

/* ---------------- demo data ---------------- */
function loadDemo(){
  S.demo=true;
  S.contracts=[];
  S.actions=[];
  S.versions=[];
  S.loiReviews=[];
  setStatus("warn","Preview mode — connect inside Creator to load records");
  renderAll();
}

/* ---------------- boot ---------------- */
var initDone=false;
function fallbackDemo(){ if(!initDone){ initDone=true; loadDemo(); } }
if(window.ZOHO && window.ZOHO.CREATOR && typeof ZOHO.CREATOR.init==="function"){
  var demoTimer=setTimeout(fallbackDemo,5000);
  ZOHO.CREATOR.init().then(function(){
    if(initDone) return;
    initDone=true; clearTimeout(demoTimer);
    S.liveSDK=true;
    if(window.LMCriticalErrors)window.LMCriticalErrors.markReady();
    resolvePageParams().then(function(p){ S.deepLink=p||{}; loadData(); });
  }).catch(function(err){ clearTimeout(demoTimer); diag("Creator init error",err); fallbackDemo(); });
} else {
  fallbackDemo();
}
window.addEventListener("error",function(e){diag("Unhandled widget error",{message:e.message,source:e.filename,line:e.lineno,column:e.colno,stack:e.error&&e.error.stack});});
window.addEventListener("unhandledrejection",function(e){diag("Unhandled promise rejection",{reason:e.reason});});
</script>
