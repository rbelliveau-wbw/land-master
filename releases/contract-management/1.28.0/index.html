var drillDragId=null;
function wireDrillDrag(){
  document.querySelectorAll("[data-ddrag]").forEach(function(h){
    h.addEventListener("dragstart",function(e){
      drillDragId=h.getAttribute("data-ddrag");
      var w=h.closest(".dact-wrap"); if(w) w.style.opacity=".4";
      e.dataTransfer.effectAllowed="move";
      try{ e.dataTransfer.setData("text/plain",drillDragId); }catch(err){}
    });
    h.addEventListener("dragend",function(){
      drillDragId=null;
      document.querySelectorAll(".dact-wrap").forEach(function(w){ w.style.opacity=""; w.classList.remove("dragover","dragover-after"); });
      document.querySelectorAll(".dadd").forEach(function(z){ z.classList.remove("dropend"); });
    });
  });
  function lowerHalf(el,e){
    var r=el.getBoundingClientRect();
    return (e.clientY-r.top)>r.height/2;
  }
  document.querySelectorAll(".dact-wrap[data-drow]").forEach(function(w){
    w.addEventListener("dragover",function(e){
      if(!drillDragId||w.getAttribute("data-drow")===drillDragId) return;
      var a=findAction(drillDragId), b=findAction(w.getAttribute("data-drow"));
      if(!a||!b||lookupId(a.Contract1)!==lookupId(b.Contract1)) return;
      e.preventDefault(); e.dataTransfer.dropEffect="move";
      var after=lowerHalf(w,e);
      w.classList.toggle("dragover",!after);
      w.classList.toggle("dragover-after",after);
    });
    w.addEventListener("dragleave",function(){ w.classList.remove("dragover","dragover-after"); });
    w.addEventListener("drop",function(e){
      e.preventDefault();
      var after=lowerHalf(w,e);
      w.classList.remove("dragover","dragover-after");
      var t=w.getAttribute("data-drow");
      if(!drillDragId||t===drillDragId) return;
      dropReorder(drillDragId,t,after);
      drillDragId=null;
    });
  });
  /* the add strip doubles as an explicit "move to the end" target */
  document.querySelectorAll(".dadd").forEach(function(z){
    z.addEventListener("dragover",function(e){
      if(!drillDragId) return;
      e.preventDefault(); e.dataTransfer.dropEffect="move"; z.classList.add("dropend");
    });
    z.addEventListener("dragleave",function(){ z.classList.remove("dropend"); });
    z.addEventListener("drop",function(e){
      e.preventDefault(); z.classList.remove("dropend");
      if(!drillDragId) return;
      var a=findAction(drillDragId);
      if(a){
        var order=actionsFor(lookupId(a.Contract1)).map(function(r){ return String(r.ID); });
        var from=order.indexOf(String(drillDragId));
        if(from>=0){ order.splice(from,1); order.push(String(drillDragId)); applyOrder(order,String(drillDragId)); }
      }
      drillDragId=null;
    });
  });
}

function courtGlyph(status){

function mdShort(input){ if(!input) return ""; return String(parseInt(input.slice(5,7),10))+"/"+input.slice(8,10); }
/* short aging label under the due date */
function agingText(a){
  if(truthy(a.Complete)){
    var cd=toInput(a.Complete_Date);
    return cd?["\u2713 "+mdShort(cd),"#047857"]:["\u2713 no date","#b45309"];
  }
  var d=toInput(a.Due_Date);
  if(!d) return ["no due",truthy(a.Current_Action)?"#c2410c":"#8ea0bd"];
  var diff=daysBetween(todayInput(),d);
  if(diff==null) return ["",""];
  if(diff<0) return [(-diff)+"d late","#dc2626"];
  if(diff===0) return ["today","#b45309"];
  if(diff<=5) return ["in "+diff+"d","#b45309"];
  return [mdShort(d),"#8ea0bd"];
}
/* read-only sentence in the panel: the detail the 116px lane cannot hold */
function agingStrip(a){
  var parts=[], sd=toInput(a.Start_Date), dd=toInput(a.Due_Date), cd=toInput(a.Complete_Date);
  if(truthy(a.Complete)){
    if(sd) parts.push("Started "+mdShort(sd));
    if(cd&&sd){ var n=daysBetween(sd,cd); if(n!=null) parts.push("closed in "+n+"d"); }
    if(!cd) parts.push('<span class="warn">Completed: date not recorded</span>');
    return parts.length?parts.join(" \u00b7 "):"Completed";
  }
  if(dd) parts.push("Due "+prettyDate(a.Due_Date));
  if(sd){
    parts.push("Started "+prettyDate(a.Start_Date));
    var f=daysBetween(sd,todayInput());
    if(f!=null&&f>=0) parts.push(f+"d in flight");
  }
  if(dd){
    var late=daysBetween(dd,todayInput());
    if(late!=null&&late>0) parts.push('<span class="late">'+late+"d past due</span>");
  }
  if(!parts.length) return '<span class="warn">No dates set</span>';
  return parts.join(" \u00b7 ");
}

function badgeClick(ev,id){
  if(ev) ev.stopPropagation();
  var a=findAction(id); if(!a||S.busy) return;
  if(truthy(a.Complete)){
    confirmDialog({
      kicker:"Reopen action",title:"Reopen this action?",
      lead:"Status resets to New, the completion date is cleared, and this becomes the contract’s current action.",
      detail:a.Contract_Action||"Untitled action",
      okLabel:"Reopen",
      onConfirm:function(){ reopenAction(id); }
    });
    return;
  }
  if(!requireOwner(id)) return;
  completeDrillAction(id);
}
function completeFromPanel(id){ if(requireOwner(id)) completeDrillAction(id); }
/* point the "current action" marker at this row */
/* Append a new action to the end of a contract's list. Sort_Order continues the
   existing sequence, so it lands last both here and in the native subform. */
function drillAdd(cid){
  var el=$("dadd_"+cid); if(!el||S.busy) return;
  var title=String(el.value||"").trim();
  if(!title){ el.focus(); return; }
  var maxSort=0;
  actionsFor(cid).forEach(function(r){
    var k=sortKey(r);
    if(k!==Number.MAX_SAFE_INTEGER && k>maxSort) maxSort=k;
  });
  var fieldData={ Contract1:String(cid), Contract_Action:title, Status:"Proposed", Complete:false, Sort_Order:maxSort+1 };
  S.busy=true; setStatus("warn","Saving\u2026");
  el.value="";
  createRecord(CFG.forms.action,fieldData).then(function(resp){
    S.busy=false; setStatus("ok",S.demo?"Demo data":"Connected"); banner("ok","Action added.");
    var newId=(resp&&resp.data&&(resp.data.ID||resp.data.id))||"";
    if(S.demo){
      var local=JSON.parse(JSON.stringify(fieldData));
      local.ID=String(newId||("demo_"+Date.now()));
      local.Contract1=[{ID:String(cid),display_value:""}];
      local.Current_Action="false";
      S.actions.push(local);
      queueFlip(local.ID,"justadded");
      renderAll();
      var again=$("dadd_"+cid); if(again) again.focus();
    } else {
      sdkGetAll(CFG.reports.actions).then(function(rows){
        S.actions=rows;
        if(newId) queueFlip(String(newId),"justadded");
        renderAll();
        var again=$("dadd_"+cid); if(again) again.focus();
      }).catch(function(){ renderAll(); });
    }
  }).catch(function(e){
    S.busy=false; setStatus("err","Save failed");
    banner("err","Could not add the action: "+errText(e));
    var back=$("dadd_"+cid); if(back) back.value=title;
  });
}
function confirmDeleteAction(id){
  var a=findAction(id); if(!a) return;
  openModal(
    modalHead("Delete action","Are you sure?")
    +'<div class="modal-body">'
    +'<p style="margin:0 0 12px;font-size:13px;color:var(--muted)">This permanently removes the action from the contract. It cannot be undone.</p>'
    +'<div style="padding:11px 13px;border:1px solid var(--line);border-radius:9px;background:#f8fafc;font-weight:750;font-size:12.5px;color:var(--text)">'
      +esc(a.Contract_Action||"Untitled action")+'</div>'
    +'</div>'
    +'<div class="modal-foot"><div class="spacer" style="flex:1"></div>'
    +'<button class="btn ghost sm" onclick="closeOverlays()">Cancel</button>'
    +'<button class="btn sm" style="background:var(--red);border-color:var(--red);color:#fff" onclick="closeOverlays();deleteAction(\''+id+'\',true)">Delete action</button>'
    +'</div>'

function makeCurrent(id){
  var a=findAction(id); if(!a||S.busy) return;
  var updates=[[String(id),{Current_Action:true}]];
  actionsFor(lookupId(a.Contract1)).forEach(function(r){
    if(String(r.ID)!==String(id)&&truthy(r.Current_Action)) updates.push([String(r.ID),{Current_Action:false}]);
  });
  banner("ok","Current action updated.");
  runUpdates(updates);
}
function afState(id,kind){
  var el=$("af_state_"+id); if(!el) return;
  clearTimeout(el._t);
  if(kind==="ok"){
    el.className="af-state ok"; el.textContent="\u2713 Saved";
    el._t=setTimeout(function(){ el.textContent=""; el.className="af-state"; },1600);
  } else {
    el.className="af-state bad"; el.textContent="Retry";
  }
}

/* inline status change from the list; completing with open actions cascades after a warning */
function statusCellChange(cid,status){
  var c=findContract(cid); if(!c||S.busy){ renderAll(); return; }
  if(!canEdit()){ banner("err","You do not have access to change contract status."); renderAll(); return; }
  if(guardLotCompletion(c,status)) return;
  var openActs=actionsFor(cid).filter(function(a){ return !truthy(a.Complete); });
  if(status==="Complete"&&openActs.length){
    confirmDialog({
      kicker:"Complete contract",
      title:openActs.length+" action"+(openActs.length===1?"":"s")+" still open",
      lead:"Completing the contract closes "+(openActs.length===1?"this action":"these actions")+" too — each is marked complete as of today. Reopening them afterwards is one click per action.",
      items:openActs.map(function(a){ return a.Contract_Action||"Untitled action"; }),
      okLabel:"Complete contract",
      onConfirm:function(){ completeContractCascade(cid,c,openActs); },
      /* the select already shows Complete - put it back if they back out */
      onDismiss:function(){ renderAll(); }
    });
    return;
  }
  setContractStatus(cid,status);
}
/* Close every open action as of today, then the contract itself. */
function completeContractCascade(cid,c,openActs){
  if(S.busy) return;
  var updates=openActs.map(function(a){
    return [String(a.ID),{Complete:true,Current_Action:false,Status:"Complete",Complete_Date:toZoho(todayInput())}];
  });
  S.busy=true; setStatus("warn","Saving…");
  var p=Promise.resolve();
  updates.forEach(function(u){ p=p.then(function(){ return updateRecord(u[0],u[1],CFG.reports.actions).then(function(){ applyLocal(u[0],u[1]); }); }); });
  var cPayload={Status:"Complete"};
  if(!toInput(c.Completion_Date)) cPayload.Completion_Date=toZoho(todayInput());
  p.then(function(){ return updateRecord(String(cid),cPayload,CFG.reports.contracts); })
   .then(function(){ c.Status="Complete"; S.busy=false; setStatus("ok",S.demo?"Demo data":"Connected"); banner("ok","Contract completed — "+openActs.length+" open action"+(openActs.length===1?"":"s")+" closed out."); renderAll(); })
   .catch(function(e){ S.busy=false; setStatus("err","Save failed"); banner("err","Save failed: "+errText(e)); reloadActions(); });
}

function renderTable(list){
  if(!list.length) return '<div class="tablecard"><div class="empty"><b>No contracts match</b>Adjust the search or filters.</div></div>';
  /* grouped by contract type, alphabetical, including any stray value in the data */
  var order=allTypes();
  list.forEach(function(c){ var t=String(c.Contract_Type||"Other"); if(order.indexOf(t)<0) order.push(t); });
  sortTypes(order);
  var body="";
  order.forEach(function(t){
    var group=list.filter(function(c){ return String(c.Contract_Type||"Other")===t; });
    if(!group.length) return;
    body+='<tr class="tgroup"><td colspan="9"><span class="tgroup-bar" style="background:'+typeColor(t)[1]+'"></span>'
      +'<span class="tgroup-name">'+esc(t)+'</span><span class="tgroup-n">'+group.length+'</span></td></tr>';
    body+=group.map(contractRow).join("");
  });
  return '<div class="tablecard"><div class="tscroll"><table class="wtable ctable">'
    +'<colgroup><col style="width:88px"/><col style="width:22%"/><col style="width:150px"/><col style="width:150px"/>'
    +'<col style="width:15%"/><col style="width:12%"/><col style="width:20%"/><col style="width:74px"/><col style="width:120px"/></colgroup>'
    +'<thead><tr>'
    +'<th style="cursor:default"></th>'
    +th("Contract Name","Contract_Name")+'<th style="cursor:default">Owner</th>'+th("Status","Status")
    +th("Subdivision","Subdivision1")+th("Builder","Builder")+"<th>Current Action</th>"
    +'<th style="cursor:default">Approvals</th>'+th("Progress","pct")
    +'</tr></thead><tbody>'+body+'</tbody></table></div></div>';
}

function renderBoard(list){
  /* the list is already free of Proposed, so its column would always be empty */
  var cols=allContractStatuses().filter(function(s){ return s!=="Proposed"; }).map(function(s){
    var cards=list.filter(function(c){ return String(c.Status||"New")===s; });
    var inner=cards.map(function(c){
      var st=statsFor(c.ID);
      return '<div class="bcard" onclick="openContract(\''+c.ID+'\')">'
        +'<div class="bcard-name">'+esc(c.Contract_Name||("Contract "+c.ID))+'</div>'
        +(currentActionText(c.ID)?'<div class="bcard-action">'+esc(currentActionText(c.ID))+'</div>':'')
        +'<div class="bcard-foot"><span class="bcard-builder">'+esc(displayValue(c.Builder)||displayValue(c.Subdivision1)||"—")+'</span><span class="bcard-type">'+esc(c.Contract_Type||"")+'</span></div>'
        +(st.total?'<div class="progress"><i style="width:'+st.pct+'%"></i></div>':'')
        +(approvalsFor(c.ID).length?approvalStrip(c.ID):'')
        +'</div>';
    }).join("");
    return '<div class="bcol"><div class="bcol-head"><span class="bar" style="background:'+(COL_BARS[s]||"#8ea0bd")+'"></span>'+esc(s)+'<span class="n">'+cards.length+'</span></div><div class="bcol-cards">'+inner+'</div></div>';
  }).join("");
  return '<div class="boardwrap">'+cols+'</div>';
}

function wireEditGrid(){
  var wrap=document.querySelector(".egrid-wrap"); if(!wrap) return;
  wrap.querySelectorAll("textarea.eg-in").forEach(function(t){ t.style.height="auto"; t.style.height=(t.scrollHeight)+"px"; t.addEventListener("input",function(){ t.style.height="auto"; t.style.height=(t.scrollHeight)+"px"; }); });
  wrap.querySelectorAll(".eg-in").forEach(function(el){
    var ev=(el.tagName==="SELECT"||el.type==="date")?"change":"blur";
    el.addEventListener(ev,function(){ gSaveField(el); });
  });
  var add=$("egAdd");
  if(add) add.addEventListener("keydown",function(e){ if(e.key==="Enter"){ e.preventDefault(); gAdd(add.value); } });
  wireGridDrag(wrap);
}
function gSaveField(el){
  var id=el.getAttribute("data-id"), f=el.getAttribute("data-f");
  var a=findAction(id); if(!a) return;
  var raw=el.value;
  var val=(f==="Start_Date"||f==="Due_Date"||f==="Complete_Date")?toZoho(raw):raw;
  var oldZ=(f==="Start_Date"||f==="Due_Date"||f==="Complete_Date")?toZoho(toInput(a[f])):(a[f]||"");
  if(String(val)===String(oldZ)) return;
  var data={}; data[f]=val;
  if(f==="Status"&&raw==="Complete"&&!truthy(a.Complete)){ data.Complete=true; data.Current_Action=false; if(!toInput(a.Complete_Date)) data.Complete_Date=toZoho(todayInput()); }
  if(f==="Status"&&raw!=="Complete"&&truthy(a.Complete)){ data.Complete=false; data.Complete_Date=""; }
  updateRecord(id,data,CFG.reports.actions).then(function(){
    applyLocal(id,data);
    el.classList.add("eg-saved"); setTimeout(function(){ el.classList.remove("eg-saved"); },1400);
    if(("Complete" in data)) renderAll();
  }).catch(function(e){ banner("err","Save failed: "+errText(e)); reloadActions(); });
}
function gComplete(id){ completeAction(id,true); }
function gReopen(id){ reopenAction(id); }
function setCurrent(id){
  var a=findAction(id); if(!a||S.busy) return;
  var updates=[[id,{Current_Action:true}]];
  actionsFor(lookupId(a.Contract1)).forEach(function(r){ if(String(r.ID)!==String(id)&&truthy(r.Current_Action)) updates.push([String(r.ID),{Current_Action:false}]); });
  runUpdates(updates);
}
function clearCurrent(id){ if(S.busy) return; runUpdates([[id,{Current_Action:false}]]); }
function deleteAction(id,force){
  var a=findAction(id); if(!a||S.busy) return;
  /* checked before the confirm opens, so a refusal never looks like a cancel */
  if(!needs(canEdit(),"delete actions")) return;
  if(!force){ confirmDeleteAction(id); return; }
  if(S.demo){ S.actions=S.actions.filter(function(r){ return String(r.ID)!==String(id); }); banner("ok","Action deleted."); renderAll(); return; }
  S.busy=true; setStatus("warn","Deleting…");
  sdkDeleteById(CFG.reports.actions,id).then(function(){
    S.actions=S.actions.filter(function(r){ return String(r.ID)!==String(id); });
    S.busy=false; setStatus("ok","Connected"); banner("ok","Action deleted.");
    auditLog("success","Action deleted",{actionId:String(id),action:String(a.Contract_Action||"")});
    renderAll();
  }).catch(function(e){
    S.busy=false; setStatus("err","Delete failed"); banner("err","Delete failed: "+errText(e));
    auditLog("error","Action delete failed",{actionId:String(id),report:CFG.reports.actions,error:e});
  });
}
function gAdd(title){
  title=(title||"").trim(); if(!title||S.busy) return;
  var all=actionsFor(S.selId), maxSort=0;
  all.forEach(function(r){ if(num(r.Sort_Order)>maxSort) maxSort=num(r.Sort_Order); });
  var fieldData={ Contract1:S.selId, Contract_Action:title, Status:"New", Complete:false, Sort_Order:maxSort+1 };
  S.busy=true; setStatus("warn","Saving…");
  createRecord(CFG.forms.action,fieldData).then(function(resp){
    S.busy=false; setStatus("ok",S.demo?"Demo data":"Connected"); banner("ok","Action added.");
    if(S.demo){
      var nid=(resp&&resp.data&&resp.data.ID)||("demo_"+Date.now());
      var local=JSON.parse(JSON.stringify(fieldData)); local.ID=String(nid); local.Contract1={ID:String(S.selId),display_value:""}; local.Current_Action="false";
      S.actions.push(local); renderAll();
    } else { sdkGetAll(CFG.reports.actions).then(function(rows){ S.actions=rows; renderAll(); }); }
  }).catch(function(e){ S.busy=false; setStatus("err","Save failed"); banner("err","Add failed: "+errText(e)); });
}
function wireGridDrag(wrap){
  wrap.querySelectorAll("[data-drag]").forEach(function(h){
    h.addEventListener("dragstart",function(e){ dragId=h.getAttribute("data-drag"); var r=h.closest("tr"); if(r) r.style.opacity=".35"; e.dataTransfer.effectAllowed="move"; try{ e.dataTransfer.setData("text/plain",dragId); }catch(err){} });
    h.addEventListener("dragend",function(){ dragId=null; wrap.querySelectorAll("tr").forEach(function(r){ r.style.opacity=""; r.style.boxShadow=""; }); });
  });
  wrap.querySelectorAll("tr[data-row]").forEach(function(row){
    row.addEventListener("dragover",function(e){ if(!dragId||row.getAttribute("data-row")===dragId) return; e.preventDefault(); e.dataTransfer.dropEffect="move"; row.style.boxShadow="inset 0 3px 0 0 var(--primary-2)"; });
    row.addEventListener("dragleave",function(){ row.style.boxShadow=""; });
    row.addEventListener("drop",function(e){ e.preventDefault(); row.style.boxShadow=""; var t=row.getAttribute("data-row"); if(!dragId||t===dragId) return; dropReorder(dragId,t); dragId=null; });
  });
}

/* Contract_Pricing is one row per distinct lot size. ncSeedPricing writes it at
   create time, but terms move mid-flight, so it has to stay editable here. Base
   price is Lot_Size x Price_per_Ft and is never typed - the same rule the create
   flow used - so the two can never disagree. */
function findPricing(id){ for(var i=0;i<S.pricing.length;i++) if(String(S.pricing[i].ID)===String(id)) return S.pricing[i]; return null; }
function pricingFor(cid){
  return S.pricing.filter(function(p){ return lookupId(p.Contract1)===String(cid); })
    .sort(function(a,b){ return num(a.Lot_Size)-num(b.Lot_Size); });
}
function pricingCard(cid){
  var c=findContract(cid); if(!c) return "";
  var rows=pricingFor(cid);
  /* show for Lot contracts always, and for anything else only if it has pricing */
  if(!rows.length && String(c.Contract_Type||"")!=="Lot") return "";
  var may=canEdit();
  var total=0; rows.forEach(function(p){ total+=num(p.Base_Price); });
  var items=rows.map(function(p){
    return '<div class="pr-row">'
      +'<div class="pr-size">'+esc(String(num(p.Lot_Size)||"\u2014"))+'<span>ft</span></div>'
      +'<div>'+(may
        ?'<input class="pr-in" type="number" step="0.01" min="0" value="'+attr(String(num(p.Price_per_Ft)||""))+'"'
          +' onchange="prSave(\''+p.ID+'\',this.value)" onkeydown="if(event.key===\'Enter\')this.blur()"/>'
        :'<span class="pr-ro">'+money(p.Price_per_Ft)+'</span>')+'</div>'
      +'<div class="pr-base">'+money(p.Base_Price)+'</div>'
      +(may?'<button class="pr-del" title="Remove this lot size" onclick="prDelete(\''+p.ID+'\',\''+cid+'\')">\u00d7</button>':'<span></span>')
      +'</div>';
  }).join("");
  return '<div class="side-card"><div class="dark-head"><div><div class="dark-kicker">Lot Pricing</div><div class="dark-title">Price per Size</div></div>'
    +'<div class="dark-badge"><strong>'+rows.length+'</strong><span>Size'+(rows.length===1?"":"s")+'</span></div></div>'
    +'<div class="pr-body">'
    +(rows.length

/* ensure exactly one open action is Current (Deluge parity) */
function ensureCurrentUpdates(cid,updates,already){
  var all=actionsFor(cid);
  var hasCurrent=all.some(function(a){
    var pend=(already||{})[String(a.ID)];
    var complete=pend&&"Complete" in pend?pend.Complete:truthy(a.Complete);
    var current=pend&&"Current_Action" in pend?pend.Current_Action:truthy(a.Current_Action);
    return !complete&&current;
  });
  if(!hasCurrent){
    for(var i=0;i<all.length;i++){
      var a=all[i], pend=(already||{})[String(a.ID)];
      var complete=pend&&"Complete" in pend?pend.Complete:truthy(a.Complete);
      if(!complete){ updates.push([String(a.ID),{Current_Action:true}]); break; }
    }
  }
}

function saveAction(id){
  var a=findAction(id); if(!a||S.busy) return;
  if(!needs(canPropose(),"edit actions")) return;
  var dm=$("f_dm_"+id).value;
  if(!dm){ banner("err","Choose an assignee before saving or completing this action."); return; }
  var status=$("f_st_"+id).value;
  var data={
    Dev_Mgr:dm,
    Dev_Notes:$("f_nt_"+id).value,
    Start_Date:toZoho($("f_sd_"+id).value),
    Due_Date:toZoho($("f_dd_"+id).value),
    Complete_Date:toZoho($("f_cd_"+id).value),
    Status:status
  };
  var updates=[];
  if(status==="Complete"){
    data.Complete=true; data.Current_Action=false;
    if(!data.Complete_Date) data.Complete_Date=toZoho(todayInput());
    updates.push([id,data]);
    advanceCurrent(id,updates);
  } else {
    if(truthy(a.Complete)){ data.Complete=false; data.Complete_Date=""; }

    ensureCurrentUpdates(lookupId(a.Contract1),updates,pend);

}

function advanceCurrent(completedId,updates){
  var a=findAction(completedId); if(!a) return;
  var cid=lookupId(a.Contract1);
  var all=actionsFor(cid);
  all.forEach(function(r){
    if(String(r.ID)!==String(completedId)&&truthy(r.Current_Action)) updates.push([String(r.ID),{Current_Action:false}]);
  });
  var sort=num(a.Sort_Order), next=null;
  all.forEach(function(r){
    if(String(r.ID)===String(completedId)||truthy(r.Complete)) return;
    if(num(r.Sort_Order)>sort&&(next==null||num(r.Sort_Order)<num(next.Sort_Order))) next=r;
  });
  if(!next){ for(var i=0;i<all.length;i++){ var r=all[i]; if(String(r.ID)!==String(completedId)&&!truthy(r.Complete)){ next=r; break; } } }
  if(next) updates.push([String(next.ID),{Current_Action:true}]);
}

/* reorder: arrows swap with visible neighbour; drag reinserts */
/* Move one row up/down. Renumbering the whole list beats swapping two values:
   a swap is a no-op when both rows have a blank or duplicated Sort_Order. */
function moveAction(id,dir){
  if(S.busy) return;
  if(!needs(canPropose(),"reorder actions")) return;
  var a=findAction(id); if(!a) return;
  var order=actionsFor(lookupId(a.Contract1)).map(function(r){ return String(r.ID); });
  var from=order.indexOf(String(id));
  var to=from+dir;
  if(from<0||to<0||to>=order.length) return;
  order.splice(to,0,order.splice(from,1)[0]);
  applyOrder(order,String(id));
}
var dragId=null;
function wireDrag(){
  var list=$("alist"); if(!list) return;
  list.querySelectorAll("[data-drag]").forEach(function(h){
    h.addEventListener("dragstart",function(e){
      dragId=h.getAttribute("data-drag");
      var row=h.closest(".arow"); if(row) row.classList.add("dragging");
      e.dataTransfer.effectAllowed="move";
      try{ e.dataTransfer.setData("text/plain",dragId); }catch(err){}
    });
    h.addEventListener("dragend",function(){
      dragId=null;
      list.querySelectorAll(".arow").forEach(function(r){ r.classList.remove("dragging","dragover"); });
    });
  });
  list.querySelectorAll(".arow[data-row]").forEach(function(row){
    row.addEventListener("dragover",function(e){
      if(!dragId||row.getAttribute("data-row")===dragId) return;
      e.preventDefault(); e.dataTransfer.dropEffect="move";
      row.classList.add("dragover");
    });
    row.addEventListener("dragleave",function(){ row.classList.remove("dragover"); });
    row.addEventListener("drop",function(e){
      e.preventDefault(); row.classList.remove("dragover");
      var r=row.getBoundingClientRect();
      var after=(e.clientY-r.top)>r.height/2;
      var targetId=row.getAttribute("data-row");
      if(!dragId||targetId===dragId) return;
      dropReorder(dragId,targetId,after);
      dragId=null;
    });
  });
}
function dropReorder(movedId,beforeId,after){
  if(S.busy) return;
  /* the drag already moved the row in the DOM - repaint to snap it back */
  if(!needs(canPropose(),"reorder actions")){ renderAll(); return; }
  var a=findAction(movedId); if(!a) return;
  var cid=lookupId(a.Contract1);
  var all=actionsFor(cid);
  var order=all.map(function(r){ return String(r.ID); });
  var from=order.indexOf(String(movedId)), to=order.indexOf(String(beforeId));
  if(from<0||to<0) return;
  order.splice(from,1);
  var at=order.indexOf(String(beforeId));
  if(at<0) return;
  /* dropping on the lower half of a row inserts AFTER it - without this the last
     position is unreachable, because every drop landed before its target. */
  order.splice(after?at+1:at,0,String(movedId));
  applyOrder(order,String(movedId));
}

/* ---------------- render root ---------------- */
/* ---------- reorder feedback: FLIP the rows, then flash the one that moved ---------- */
var PENDING_FLIP=null;
function flipCapture(){
  var m={};
  document.querySelectorAll(".dact-wrap[data-drow],.arow[data-row],.ma-wrap[data-mkey]").forEach(function(el){
    var id=el.getAttribute("data-drow")||el.getAttribute("data-row")||el.getAttribute("data-mkey");
    m[id]=el.getBoundingClientRect().top;
  });
  return m;
}
function flipPlay(prev,movedId,flashClass){
  document.querySelectorAll(".dact-wrap[data-drow],.arow[data-row],.ma-wrap[data-mkey]").forEach(function(el){
    var id=el.getAttribute("data-drow")||el.getAttribute("data-row")||el.getAttribute("data-mkey");
    var before=prev[id];
    if(before==null) return;
    var dy=before-el.getBoundingClientRect().top;
    if(!dy) return;
    el.style.transition="none";
    el.style.transform="translateY("+dy+"px)";
    /* next frame: release to the new position */
    requestAnimationFrame(function(){
      el.style.transition="transform .3s cubic-bezier(.22,1,.36,1)";
      el.style.transform="";
      setTimeout(function(){ el.style.transition=""; el.style.transform=""; },340);
    });
  });
  if(movedId){
    var t=document.querySelector('.dact-wrap[data-drow="'+movedId+'"]')
      ||document.querySelector('.ma-wrap[data-mkey="'+movedId+'"]');
    if(t){
      var cls=flashClass||"justmoved";
      t.classList.add(cls);
      setTimeout(function(){ t.classList.remove(cls); },1200);
    }
  }
}
function queueFlip(movedId,flashClass){
  PENDING_FLIP={prev:flipCapture(),moved:movedId||null,cls:flashClass||"justmoved"};
}
var SCROLL_SELECTORS=[".tscroll",".detailwrap",".loi-review-page",".boardwrap",".workarea"];
function viewKey(){
  return [S.view,S.homeSection,String(S.selId||""),String(S.loiSelId||""),S.mode,S.actionsMode].join("|");
}
var LAST_VIEW_KEY=null;
function captureScroll(){
  var out={view:0,inner:{}};
  var v=$("view"); if(v) out.view=v.scrollTop;
  SCROLL_SELECTORS.forEach(function(sel){
    var el=document.querySelector(sel);
    if(el && el.scrollTop) out.inner[sel]=el.scrollTop;
  });
  return out;
}
function restoreScroll(st){
  var v=$("view");
  if(v && st.view) v.scrollTop=st.view;
  Object.keys(st.inner).forEach(function(sel){
    var el=document.querySelector(sel);
    if(el) el.scrollTop=st.inner[sel];
  });
}
function renderView(){
  if(S.locked){ renderLocked(); return; }
  if(S.view==="detail"&&S.selId) renderDetail();
  else if(S.view==="loiReview"&&S.loiSelId) renderLOIReview();
  else if(S.homeSection==="loi") renderLOIReviews();
  else if(S.homeSection==="actions") renderManageActions();
  else { $("crumb").innerHTML='<a onclick="showContracts()">Contracts</a>'; renderHome(); }
}
/* The dead end a missing report grant deserves: say what was refused, say who
   can fix it, and offer nothing else. No list, no buttons that would fail, and
   crucially no demo mode pretending the writes worked. */
function renderLocked(){
  var c=$("crumb"); if(c) c.innerHTML='<strong>Contracts</strong>';
  var rep=S.lockedReport?esc(S.lockedReport):"";
  $("view").innerHTML='<div class="lock-wrap"><div class="lock-card">'
    +'<div class="lock-badge">'
      +'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'
      +'<rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></div>'
    +'<h2>You do not have access to the contract records</h2>'
    +'<p class="lock-lead">Creator refused the read with <b>Permission denied to view record(s)</b>. '
      +'Nothing has loaded, and nothing you did here would be saved \u2014 so the widget stays closed rather than pretending otherwise.</p>'
    +(rep?'<div class="lock-req"><span class="lock-req-l">Refused report</span><code>'+rep+'</code></div>':'')
    +'<div class="lock-ask">Ask an administrator to grant your profile <b>View</b> on '
      +(rep?'<code>'+rep+'</code>':'the contract reports')+', including <b>View all</b> so you can see records added by other people.</div>'
    +'<button class="btn primary" onclick="loadData()">Try again</button>'
    +'</div></div>';
}
/* Re-rendering replaces #view, which would reset every scroll container.
   Keep the scroll position whenever we stay on the same screen; only a real
   navigation (different record, section, or list/board mode) starts at the top. */
function renderAll(){
  var key=viewKey();
  var same=(key===LAST_VIEW_KEY);
  var st=same?captureScroll():null;
  renderView();
  LAST_VIEW_KEY=key;
  if(st){
    restoreScroll(st);
    if(window.requestAnimationFrame) requestAnimationFrame(function(){ restoreScroll(st); });
  }
  if(PENDING_FLIP){
    var f=PENDING_FLIP; PENDING_FLIP=null;
    flipPlay(f.prev,f.moved,f.cls);
  }
}

/* ---------------- data load ---------------- */
function ensureAccess(){ if(!S.usersLoaded) ncLoadUsers(); }
function loadData(){
  setStatus("warn","Loading…");
  S.locked=false; S.lockedReport="";
  /* Permissions have to be known before the user can touch anything. Loading them
     only when the New Contract form opened left every gate wide open until then -
     and made the first contract of a session land as New instead of Proposed. */
  ensureAccess();
  Promise.all([
    sdkGetAll(CFG.reports.contracts),
    sdkGetAll(CFG.reports.actions),
    sdkGetAll(CFG.reports.versions).catch(function(){ return []; }),
    loadPendingLOIs().catch(function(){ return []; }),
    sdkGetAll(CFG.reports.approvals).catch(function(){ return []; }),
    sdkGetAll(CFG.reports.pricing).catch(function(){ return []; })
  ]).then(function(res){
    S.contracts=res[0]; S.actions=res[1]; S.versions=res[2]; S.loiReviews=res[3]; S.approvals=res[4];
    S.pricing=res[5]||[];
    setStatus("ok","Connected");
    auditLog("success","Data loaded",{contracts:S.contracts.length,actions:S.actions.length,versions:S.versions.length,approvals:S.approvals.length,pendingLOIs:S.loiReviews.length});
    repairSingleCurrent();
    var qp=S.deepLink||readPageParams(); S.deepLink=qp;
    /* email links send `token=`; older links sent `tokenId=` — accept both */
    if(qp.loiReviewId && findLOI(qp.loiReviewId)){ openLOIReview(qp.loiReviewId,qp.token||qp.tokenId||""); }
    else if(qp.contractId && findContract(qp.contractId)){ openContract(qp.contractId); }
    else renderAll();
  }).catch(function(e){
    auditLog("error","Data load failed",{error:e});
    if(isPermissionError(e)){
      /* Not a transport failure - the server understood and refused. Lock the
         widget instead of dropping into demo mode, where every write would
         report success and silently go nowhere. */
      S.demo=false;
      S.locked=true;
      S.lockedReport=String((e&&e.__report)||"");
      S.acc={edit:false,propose:false,approve:false,templates:false,known:true,degraded:false,found:false};
      setStatus("err","No access");
      renderAll();
      return;
    }
    setStatus("err","Load failed");
    banner("err","Could not load data: "+errText(e));
    loadDemo();
  });
}
