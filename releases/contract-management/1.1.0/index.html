<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Land Master Contracts</title>
<script src="https://static.zohocdn.com/creator/widgets/version/1.0/widgetsdk-min.js"></script>
<script src="critical-error-reporter.js"></script>
<style>
/* ── TOKENS ── aligned with Pro Forma Manager / Land Master v7 ── */
:root{
  --bg:#f0f3f7; --surface:#e8ecf1; --card:#fff;
  --line:#dde4ef; --line-strong:#c8d4e5;
  --text:#0f2744; --muted:#5c7394; --faint:#8ea0bd;
  --navy:#0b2345; --navy-soft:rgba(11,35,69,.08);
  --primary:#1e40af; --primary-2:#2563eb; --ptint:#eef4ff; --psoft:#e8f0fb;
  --green:#047857; --green-bg:#ecfdf5;
  --amber:#b45309; --amber-bg:#fffbeb;
  --red:#b91c1c; --red-bg:#fef2f2;
  --violet:#3730a3; --violet-bg:#e0e7ff;
  --r:10px; --rsm:6px;
  --shadow:0 2px 8px rgba(30,64,175,.06),0 1px 2px rgba(0,0,0,.03);
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;overflow:hidden}
body{display:flex;flex-direction:column;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:13px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit}
:focus-visible{outline:2px solid var(--primary-2);outline-offset:1px}
::selection{background:#dbeafe}
*{scrollbar-width:thin;scrollbar-color:#c5d0df transparent}
*::-webkit-scrollbar{width:9px;height:9px}
*::-webkit-scrollbar-thumb{background:#c5d0df;border:2px solid transparent;background-clip:padding-box;border-radius:99px}
*::-webkit-scrollbar-track{background:transparent}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ── TOPBAR ── */
.topbar{display:flex;align-items:center;gap:0;height:48px;padding:0 18px;background:var(--card);border-bottom:1px solid var(--line);flex:none}
.topbar-brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:14px;letter-spacing:-.2px;color:var(--navy);margin-right:16px;flex:none}
.topbar-brand svg{width:16px;height:16px;color:var(--primary)}
.crumb{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--muted);min-width:0;overflow:hidden}
.crumb a{color:var(--muted);text-decoration:none;cursor:pointer;font-weight:600}
.crumb a:hover{color:var(--primary)}
.crumb strong{color:var(--text);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumb .sep{color:#afc0d5}
.spacer{flex:1}
.statusline{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;color:var(--muted);white-space:nowrap}
.statusline .dot{width:7px;height:7px;border-radius:50%;background:var(--green)}
.statusline .dot.warn{background:var(--amber)}
.statusline .dot.err{background:var(--red)}

/* ── BUTTONS / INPUTS ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line-strong);background:#fff;color:var(--text);
  font-size:12px;font-weight:700;padding:7px 14px;border-radius:8px;cursor:pointer;transition:all .12s;white-space:nowrap}
.btn:hover{border-color:var(--primary-2);color:var(--primary)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--primary-2);border-color:var(--primary-2);color:#fff}
.btn.primary:hover{background:var(--primary);color:#fff}
.btn.green{background:var(--green);border-color:var(--green);color:#fff}
.btn.green:hover{background:#065f46;color:#fff}
.btn.orange{background:var(--amber);border-color:var(--amber);color:#fff}
.btn.orange:hover{background:#92400e;color:#fff}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--primary)}
.btn.sm{padding:4px 10px;font-size:11px}
.btn:disabled{opacity:.5;pointer-events:none}
.input{height:31px;border:1px solid transparent;border-radius:7px;background:#eef2f8;color:var(--text);font-size:12.5px;padding:0 9px;outline:none;font-variant-numeric:tabular-nums;transition:background .12s,border-color .12s,box-shadow .12s;width:100%}
.input:hover:not(:focus){background:#e6edf7}
.input:focus{background:#fff;border-color:var(--primary-2);box-shadow:0 0 0 3px rgba(37,99,235,.12)}
.input::placeholder{color:var(--faint)}
select.input{cursor:pointer}
textarea.input{height:auto;min-height:56px;padding:7px 9px;resize:vertical;line-height:1.45}
.fl{font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:#7d90ad;font-weight:800;margin-bottom:4px;display:block;white-space:nowrap}

/* ── FILTER ROW ── */
.filterrow{display:flex;align-items:center;gap:10px;padding:14px 18px 12px;flex:none;flex-wrap:wrap}
.filterrow h1{font-size:18px;font-weight:800;letter-spacing:-.3px;margin:0;color:var(--navy)}
.scope-count{display:inline-grid;place-items:center;min-width:22px;height:20px;padding:0 7px;font-size:10.5px;font-weight:800;border-radius:999px;background:var(--psoft);color:var(--primary)}
.searchbox{display:flex;align-items:center;gap:9px;flex:0 1 420px;min-width:250px;background:#fff;border:1px solid #8fb2f3;border-radius:10px;padding:7px 11px;box-shadow:0 3px 12px rgba(37,99,235,.12),0 0 0 3px rgba(37,99,235,.04);transition:all .12s}
.searchbox:focus-within{border-color:var(--primary-2);box-shadow:0 0 0 4px rgba(37,99,235,.14),0 6px 18px rgba(37,99,235,.15);transform:translateY(-1px)}
.searchbox .search-icon{display:grid;place-items:center;width:24px;height:24px;border-radius:7px;background:var(--primary-2);color:#fff;flex:none;box-shadow:0 2px 5px rgba(37,99,235,.25)}
.searchbox svg{width:13px;height:13px}
.searchbox input{border:0;outline:0;font-size:13px;font-weight:650;flex:1;min-width:0;background:transparent;color:var(--text)}
.searchbox input::placeholder{color:#7c8faa;font-weight:550}
.chiprow{display:flex;gap:5px;flex-wrap:wrap}
.chip-f{border:1px solid var(--line-strong);background:#fff;color:var(--muted);border-radius:999px;height:28px;padding:0 12px;font-size:11px;font-weight:750;cursor:pointer;transition:all .12s;white-space:nowrap}
.chip-f:hover{border-color:var(--primary-2);color:var(--primary)}
.chip-f.active{background:var(--navy);border-color:var(--navy);color:#fff}
select.filter{border:1px solid transparent;border-radius:8px;background:#eef2f8;font-size:12px;font-weight:600;color:var(--text);padding:6px 9px;cursor:pointer;height:30px}
select.filter:hover{background:#e6edf7}
select.filter:focus{background:#fff;border-color:var(--primary-2);outline:0;box-shadow:0 0 0 3px rgba(37,99,235,.12)}
.seg{display:flex;align-items:center;gap:3px;background:linear-gradient(180deg,#f7f9fc 0%,#e9eef6 100%);border:1px solid #d4deeb;border-radius:999px;padding:4px;box-shadow:inset 0 1px 0 rgba(255,255,255,.96),0 3px 10px rgba(15,39,68,.07)}
.seg button{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 14px;border:0;background:transparent;color:#5a6b85;border-radius:999px;font-size:11.5px;font-weight:750;cursor:pointer;transition:background-color .18s ease,color .18s ease,box-shadow .18s ease,transform .18s ease;white-space:nowrap}
.seg button:hover{color:var(--navy);background:rgba(255,255,255,.88);box-shadow:0 2px 5px rgba(15,39,68,.08);transform:translateY(-1px)}
.seg button.active{color:#fff;background:linear-gradient(145deg,#163f77,#0b2345);box-shadow:0 4px 10px rgba(11,35,69,.25),inset 0 1px 0 rgba(255,255,255,.18);text-shadow:0 1px 1px rgba(0,0,0,.12);transform:translateY(-1px)}
.seg button:active{transform:translateY(0)}
.seg button:focus-visible{outline:2px solid var(--primary-2);outline-offset:2px}

/* ── WORKAREA / TABLE ── */
.workarea{flex:1;min-height:0;padding:0 18px 18px;display:flex;flex-direction:column}
.tablecard{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden;background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.tscroll{flex:1;overflow:auto;min-height:0}
.wtable{width:100%;border-collapse:collapse;font-size:12.5px}
.wtable th{position:sticky;top:0;z-index:2;background:#f6f8fc;text-align:left;font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;user-select:none;cursor:pointer}
.wtable th:hover,.wtable th.sorted{color:var(--primary)}
.wtable td{padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:250px;vertical-align:middle}
.wtable tbody tr{cursor:pointer;transition:background .1s}
.wtable tbody tr:hover{background:var(--ptint)}
.cname{font-weight:750;color:var(--primary)}
.subtle{color:var(--muted)}
.progress-cell{display:flex;align-items:center;gap:8px;min-width:120px}
.progress{flex:1;height:6px;background:#e3e9f2;border-radius:99px;overflow:hidden;min-width:56px}
.progress i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--green),#34d399)}
.progress-n{font-size:10.5px;font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums}
.tag{display:inline-flex;align-items:center;padding:2px 9px;border-radius:999px;font-size:10.5px;font-weight:800;letter-spacing:.02em;white-space:nowrap}
.empty{padding:44px 20px;text-align:center;color:var(--muted);font-weight:600}
.empty b{display:block;font-size:14px;color:var(--navy);margin-bottom:5px}
.err-banner{border:1px solid #fecaca;color:var(--red);background:var(--red-bg);border-radius:8px;padding:8px 12px;margin:0 18px 10px;font-size:11.5px;font-weight:650;display:flex;gap:8px;align-items:center}
.err-banner button{margin-left:auto;border:0;background:none;color:var(--red);font-size:16px;cursor:pointer;line-height:1}
.ok-banner{border:1px solid #a7f3d0;color:var(--green);background:var(--green-bg);border-radius:8px;padding:8px 12px;margin:0 18px 10px;font-size:11.5px;font-weight:650}

/* ── BOARD ── */
.boardwrap{flex:1;min-height:0;overflow:auto;display:flex;gap:12px;align-items:flex-start;padding-bottom:6px}
.bcol{flex:0 0 264px;background:#e9edf3;border-radius:10px;padding:9px;display:flex;flex-direction:column;gap:8px;max-height:100%}
.bcol-head{display:flex;align-items:center;gap:7px;font-size:10.5px;font-weight:850;letter-spacing:.05em;color:var(--navy);text-transform:uppercase;padding:2px 3px}
.bcol-head .bar{width:3px;height:13px;border-radius:2px;flex:none}
.bcol-head .n{margin-left:auto;color:var(--faint);font-weight:800}
.bcol-cards{display:flex;flex-direction:column;gap:8px;overflow:auto;min-height:14px}
.bcard{background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px 11px;cursor:pointer;transition:all .12s;display:flex;flex-direction:column;gap:5px}
.bcard:hover{border-color:var(--primary-2);box-shadow:0 3px 10px rgba(37,99,235,.12);transform:translateY(-1px)}
.bcard-name{font-size:12.5px;font-weight:750;color:var(--navy);line-height:1.3}
.bcard-action{font-size:11px;color:var(--muted);line-height:1.4;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.bcard-foot{display:flex;align-items:center;justify-content:space-between;gap:6px;padding-top:2px}
.bcard-builder{font-size:10.5px;color:var(--faint);font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bcard-type{font-size:10px;font-weight:800;color:var(--primary);flex:none}

/* ── DETAIL ── */
.detailwrap{flex:1;min-height:0;overflow:auto;padding:0 18px 18px}
.info-strip{display:flex;align-items:stretch;background:#fff;border:1px solid var(--line);border-radius:var(--r);margin-bottom:14px;overflow:hidden;box-shadow:var(--shadow);flex-wrap:wrap}
.info-name-block{background:linear-gradient(145deg,#0b2345,#173d72);padding:13px 20px;display:flex;flex-direction:column;justify-content:center;min-width:260px;flex:1.4}
.info-kicker{font-size:9.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#bfdbfe;margin-bottom:3px}
.info-name{font-size:17px;font-weight:800;letter-spacing:-.02em;line-height:1.2;color:#fff}
.info-field{padding:11px 16px;border-left:1px solid var(--line);display:flex;flex-direction:column;justify-content:center;min-width:110px}
.info-lbl{font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.13em;color:var(--faint);margin-bottom:3px}
.info-val{font-size:12.5px;font-weight:700;color:var(--text);line-height:1.3}
.dgrid{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:14px;align-items:start}
@media(max-width:1050px){.dgrid{grid-template-columns:1fr}}

/* actions card */
.acard-shell{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.ac-head{padding:14px 16px 12px;border-bottom:1px solid #eef2f8;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.ac-title{font-size:15px;font-weight:800;color:var(--navy);margin:0}
.ac-sub{font-size:11px;color:var(--faint);margin-top:1px}
.toggle-btn{border:0;background:transparent;display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:10.5px;font-weight:750;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;padding:0;transition:color .12s}
.toggle-btn:hover{color:var(--navy)}
.toggle-track{width:32px;height:17px;border-radius:999px;background:#dde4ef;position:relative;transition:background .18s;flex:none}
.toggle-knob{position:absolute;width:11px;height:11px;top:3px;left:3px;background:#fff;border-radius:50%;box-shadow:0 1px 3px rgba(0,0,0,.18);transition:left .18s}
.toggle-btn.on .toggle-track{background:var(--green)}
.toggle-btn.on .toggle-knob{left:18px}
.alist{padding:10px;display:flex;flex-direction:column;gap:7px;background:#f4f7fb}

/* action row */
.arow{border:2px solid var(--line);border-radius:11px;background:#fff;overflow:hidden;position:relative;transition:border-color .15s,box-shadow .15s,opacity .15s}
.arow::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:#cbd5e1;z-index:1}
.arow.current{border-color:#93c5fd;box-shadow:0 3px 14px rgba(30,64,175,.10)}
.arow.current::before{background:var(--primary)}
.arow.done{border-color:#a7f3d0}
.arow.done::before{background:#34d399}
.arow.overdue{border-color:#fca5a5}
.arow.overdue::before{background:#ef4444}
.arow.dragging{opacity:.35}
.arow.dragover{box-shadow:0 -3px 0 0 var(--primary-2)}
.arow-head{display:flex;align-items:center;min-height:56px;cursor:pointer;transition:background .12s;gap:0}
.arow-head:hover{background:#f8fafc}
.arow.open .arow-head{border-bottom:1px solid #eef2f8;background:#f8fafc}
.drag-cell{align-self:stretch;display:flex;align-items:center;padding:0 4px 0 10px;color:#c3cdda;cursor:grab;font-size:13px;user-select:none}
.drag-cell:hover{color:var(--primary-2)}
.num-cell{align-self:stretch;display:flex;align-items:center;justify-content:center;padding:0 10px 0 6px}
.num-badge{width:25px;height:25px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:800;background:#eef2f8;color:#64748b;border:1.5px solid #e2e8f4;flex:none}
.arow.current .num-badge{background:#dbeafe;color:var(--primary);border-color:#93c5fd}
.arow.overdue .num-badge{background:#fee2e2;color:#dc2626;border-color:#fca5a5}
.arow.done .num-badge{background:#d1fae5;color:var(--green);border-color:#6ee7b7}
.arow-main{flex:1;min-width:0;padding:9px 10px 9px 0}
.attention{font-size:8.5px;font-weight:800;text-transform:uppercase;letter-spacing:.14em;color:var(--primary);margin-bottom:4px;display:flex;align-items:center;gap:5px}
.attention::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--primary);flex:none;animation:pulse 1.8s ease infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(30,64,175,.45)}50%{box-shadow:0 0 0 4px rgba(30,64,175,0)}}
.arow-title{font-size:13px;font-weight:650;color:var(--text);line-height:1.35;white-space:normal}
.arow.done .arow-title{color:#94a3b8;text-decoration:line-through;text-decoration-thickness:1.5px}
.arow-meta{display:flex;align-items:center;gap:9px;margin-top:4px;flex-wrap:wrap;font-size:10.5px;color:var(--faint)}
.arow-meta strong{color:var(--muted);font-weight:700}
.arow-meta .od strong{color:#dc2626}
.arow-right{display:flex;align-items:center;gap:7px;padding-right:11px;flex:none}
.icon-btn{width:26px;height:26px;border:1px solid var(--line);border-radius:50%;background:#fff;color:var(--muted);font-size:13px;display:inline-flex;align-items:center;justify-content:center;transition:all .13s;cursor:pointer;line-height:1;padding:0}
.icon-btn:hover{background:#eaf0ff;border-color:#b9c8f3;color:var(--navy);transform:translateY(-1px)}
.quick-check{width:29px;height:29px;border:2px solid #e2e8f4;border-radius:50%;background:#fff;color:#cbd5e1;display:inline-flex;align-items:center;justify-content:center;font-size:13px;transition:all .15s;cursor:pointer;padding:0}
.quick-check:hover{border-color:#6ee7b7;background:var(--green-bg);color:var(--green)}
.quick-check.done{border-color:#6ee7b7;background:var(--green-bg);color:var(--green)}
.chev{width:26px;height:26px;border:1px solid #e2e8f4;border-radius:50%;background:#f8fafc;color:var(--faint);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;transition:transform .25s cubic-bezier(.22,1,.36,1);user-select:none;line-height:1;flex:none}
.arow.open .chev{transform:rotate(90deg);background:#eef4ff;color:var(--navy)}
.reorder-group{display:flex;gap:3px;padding-left:7px;border-left:1px solid #f0f4f9}

/* expanded form */
.arow-form{padding:13px 14px 14px 46px;background:#f8fafc;display:none;flex-direction:column;gap:10px}
.arow.open .arow-form{display:flex}
.frow{display:flex;align-items:flex-end;gap:9px;flex-wrap:wrap}
.ff{min-width:0}
.ff-dm{flex:0 0 96px}.ff-date{flex:0 0 128px}.ff-status{flex:0 0 172px}.ff-notes{flex:1;min-width:170px}
.form-actions{display:flex;gap:6px}

/* inline add row */
.add-row{border:1.5px dashed var(--line-strong);border-radius:11px;background:#f7f9fc;transition:border-color .12s}
.add-row:hover{border-color:var(--primary-2)}
.add-row-head{display:flex;align-items:center;gap:10px;padding:11px 14px;cursor:pointer;color:var(--muted);font-weight:650;font-size:12.5px}
.add-plus{width:24px;height:24px;background:#eef3ff;border:1px dashed #93b4f8;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;color:var(--primary);flex:none}
.add-form{display:none;flex-direction:column;gap:10px;padding:0 14px 14px}
.add-row.open .add-form{display:flex}

/* ── SIDEBAR ── */
.side{display:flex;flex-direction:column;gap:13px;position:sticky;top:0}
.side-card{background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.dark-head{background:linear-gradient(145deg,#0b2345,#173d72);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.dark-kicker{font-size:9.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#bfdbfe;margin-bottom:2px}
.dark-title{font-size:15px;font-weight:800;color:#fff;letter-spacing:-.01em}
.dark-badge strong{display:block;font-size:23px;font-weight:800;color:#fff;line-height:1;text-align:right}
.dark-badge span{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:#bfdbfe}
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr)}
.stat-cell{padding:12px 8px;border-right:1px solid #eef2f8;text-align:center}
.stat-cell:last-child{border-right:0}
.stat-n{font-size:21px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;margin-bottom:4px}
.stat-t{font-size:8.5px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:var(--faint)}
.stat-open .stat-n{color:var(--primary-2)}.stat-curr .stat-n{color:var(--navy)}.stat-over .stat-n{color:#dc2626}.stat-done .stat-n{color:var(--green)}
.stats-prog{padding:8px 15px 13px}
.stats-prog-lbl{display:flex;justify-content:space-between;font-size:10.5px;color:var(--muted);margin-bottom:5px}
.stats-prog-lbl b{color:var(--text)}
.stats-prog-pct{font-weight:800;color:var(--green)}
.propose-trigger{display:flex;align-items:center;gap:9px;padding:12px 15px;cursor:pointer;font-size:12.5px;font-weight:650;color:var(--primary);transition:background .12s;user-select:none}
.propose-trigger:hover{background:#f0f5ff}

<script>
/* ============================================================
   LAND MASTER — CONTRACT MANAGEMENT WIDGET
   Home: searchable list + kanban board of All_Contracts.
   Detail: Contract_Actions manager — drag/arrow reorder, inline
   expand edit, quick complete (advances Current_Action), reopen,
   propose action, Contract_Version attachments.
   Demo mode when the Creator SDK is absent.
   ============================================================ */

var CFG = {
  version: "1.1.0", pageSize: 200, maxPages: 25,
  reports: {
    contracts: "All_Contracts",
    actions: "All_Contract_Actions",
    versions: "All_Contract_Versions",
    proformas: "All_Pro_Formas_All_Fields",
    approvals: "All_Contract_Approvals",
    redlines: "All_Redline_Reviews",
    pricing: "Contract_Pricing_Report"
  },
  forms: { action: "Contract_Actions", contract: "Contract", version: "Contract_Version", approval: "Contract_Approvals", redline: "Redline_Review", proforma: "Add_Pro_Forma" },
  customApis: {
    reviewLOI: "Review_LOI_Request",
    errorReport: "Report_Proforma_Widget_Error",
    sendApprovals: "Send_Contract_Approvals",   /* Creator function pending — UI degrades if absent */
    remindApproval: "Remind_Contract_Approval"  /* Creator function pending — UI degrades if absent */
  },
  /* House-standard LOI terms; deviations get flagged in legal review */
  loiStandards: { Initial_Feasibility_Days:"90", Days_per_Extension:"30", Amount_per_Extension:"10000", Closing_Days_Feas:"30" }
};

var DEV_MGRS = ["AD","BB","DW","JS","MT","PS","SH","TB","TM","TP","TW"];
var ACTION_STATUSES = ["New","Proposed","Approval Rejected","Feasibility","Awaiting WBW DEV","Awaiting WBW LEG","Awaiting WBW CORP","Awaiting Counterparty","Awaiting Approvals","Approved","Complete"];
/* Single status vocabulary: includes "Awaiting WBW LEG" because Create_LOI_Contract creates
   contracts with it. Board/filters derive from this list plus any stray values found in data,
   so a status outside the list can never make a contract invisible again. */
var CONTRACT_STATUSES = ["New","Approval Rejected","Feasibility","Awaiting WBW","Awaiting WBW LEG","Awaiting Counterparty","Awaiting Approvals","Approved","Complete"];
var TYPES = ["Lot","DA","NSSA","Amendment","Acquisition","CCR","Master Services Agreement","Service Agreement"];
var APPROVAL_TYPES = ["Lot Split","Contract Approval","Final Approval","Term Sheet"];

var S = {
  liveSDK:false, demo:false,
  view:"home", mode:"list", homeSection:"dashboard",
  search:"", fType:"", fStatus:"", loiSearch:"", showArchived:false,
  sortKey:"Contract_Name", sortDir:1,
  selId:null, showDone:true, expanded:{},
  actionsMode:"review", detailTab:"overview",
  contracts:[], actions:[], versions:[], loiReviews:[], approvals:[], redlines:[], pricing:[],
  loiSelId:null, loiToken:"", deepLink:null,
  qAssignee:"", qStatus:"", qDue:"14",
  me:(function(){ try{ return localStorage.getItem("cmw_me")||""; }catch(e){ return ""; } })(),
  busy:false
};

if(window.LMCriticalErrors)window.LMCriticalErrors.configure({
  widget:"Contract Management",version:CFG.version,code:"CMW",
  apiCandidates:[CFG.customApis.errorReport,"reportProformaWidgetError"],
  getContext:function(){return{sdkMode:S.liveSDK?"LIVE":(S.demo?"DEMO":"NO-SDK"),view:S.view,section:S.homeSection,contractId:String(S.selId||""),loiReviewId:String(S.loiSelId||"")};}
});

/* ---------------- tiny utils ---------------- */
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }
function attr(s){ return esc(s).replace(/\n/g,"&#10;"); }
function num(v){ var n=parseFloat(v); return isNaN(n)?0:n; }
function truthy(v){ return v===true||v==="true"; }
function asList(v){ if(v==null||v==="") return []; if(Array.isArray(v)) return v; return [v]; }
function lookupId(v){ var l=asList(v); if(!l.length) return ""; var f=l[0]; if(typeof f==="object") return String(f.ID||f.id||""); return String(f); }
function displayValue(v){ var l=asList(v); if(!l.length) return ""; var f=l[0]; if(typeof f==="object") return String(f.display_value||""); return String(f); }
function listDisplay(v){ return asList(v).map(function(x){ return typeof x==="object"?String(x.display_value||""):String(x); }).filter(Boolean).join(", "); }
function diag(label,obj){
  var isError=/error|fail|failed|exception|invalid|denied/i.test(String(label||"")) || (obj&&obj.error);
  try{ console.log("[Contracts]",label,obj||""); }catch(e){}
  if(window.LMCriticalErrors)window.LMCriticalErrors.breadcrumb(isError?"error":"info",label,obj,isError);
}
function money(v){ var n=parseFloat(String(v==null?"":v).replace(/[$,]/g,"")); if(isNaN(n)) return "—"; return n.toLocaleString("en-US",{style:"currency",currency:"USD",maximumFractionDigits:0}); }
function plain(v){ if(v==null||v==="") return "—"; var d=displayValue(v); return d||String(v); }
function readPageParams(){
  var out={};
  function absorb(raw){
    if(!raw) return;
    var q=String(raw), qi=q.indexOf("?"); if(qi>=0) q=q.slice(qi+1);
    var hi=q.indexOf("#"); if(hi>=0) q=q.slice(0,hi);
    try{ new URLSearchParams(q).forEach(function(v,k){ if(out[k]==null) out[k]=v; }); }catch(e){}
  }
  absorb(window.location.search);
  absorb(window.location.hash);
  absorb(document.referrer);
  return out;
}
function resolvePageParams(){
  var fallback=readPageParams();
  try{
    if(S.liveSDK && window.ZOHO && ZOHO.CREATOR && ZOHO.CREATOR.UTIL && typeof ZOHO.CREATOR.UTIL.getQueryParams==="function"){
      return ZOHO.CREATOR.UTIL.getQueryParams().then(function(resp){
        var p=(resp&&resp.data)||resp||{};
        Object.keys(fallback).forEach(function(k){if(p[k]==null)p[k]=fallback[k];});
        return p;
      },function(){return fallback;});
    }
  }catch(e){}
  return Promise.resolve(fallback);
}

/* dates: Creator app format is MM/dd/yyyy; date inputs need yyyy-MM-dd */
function toInput(v){
  if(!v) return "";
  var s=String(v).trim(); if(!s) return "";
  var m=s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})/); if(m) return m[3]+"-"+("0"+m[1]).slice(-2)+"-"+("0"+m[2]).slice(-2);
  m=s.match(/^(\d{4})-(\d{2})-(\d{2})/); if(m) return m[1]+"-"+m[2]+"-"+m[3];
  var d=new Date(s); if(!isNaN(d)) return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2);
  return "";
}
function toZoho(inputVal){
  if(!inputVal) return "";
  var m=String(inputVal).match(/^(\d{4})-(\d{2})-(\d{2})/); if(!m) return String(inputVal);
  return m[2]+"/"+m[3]+"/"+m[1];
}
function fmtDate(v){ var i=toInput(v); if(!i) return ""; var p=i.split("-"); return p[1]+"/"+p[2]+"/"+p[0]; }
function todayInput(){ var d=new Date(); return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2); }
function isOverdue(a){ if(truthy(a.Complete)) return false; var d=toInput(a.Due_Date); return !!d && d<todayInput(); }

/* ---------------- status / banners ---------------- */
function setStatus(mode,text){ $("statusdot").className="dot"+(mode==="ok"?"":mode==="warn"?" warn":" err"); $("statustext").textContent=text; }
function banner(kind,msg){
  var b=$("banners");
  b.innerHTML='<div class="'+(kind==="err"?"err-banner":"ok-banner")+'">'+esc(msg)+(kind==="err"?'<button onclick="document.getElementById(\'banners\').innerHTML=\'\'">×</button>':'')+'</div>';
  if(kind!=="err") setTimeout(function(){ b.innerHTML=""; },3500);
}

/* ---------------- SDK layer (envelope machinery, proven in v7 widget) ---------------- */
function responseBad(resp){
  if(!resp) return true;
  var code=resp.code||(resp.result&&resp.result.code);
  if(code && code!==3000 && code!=="3000") return true;
  if(resp.error||(resp.result&&resp.result.error)) return true;
  return false;
}
function isEmptyCode(resp){ var code=resp&&(resp.code||(resp.result&&resp.result.code)); return String(code)==="3100"||String(code)==="9280"; }
function sdkGetAll(reportName,criteria){
  if(!S.liveSDK) return Promise.resolve([]);
  var all=[];
  function page(p){
    var payload={reportName:reportName,page:p,pageSize:CFG.pageSize};
    if(criteria) payload.criteria=criteria;
    return ZOHO.CREATOR.API.getAllRecords(payload).then(function(resp){
      if(isEmptyCode(resp)) return all;
      if(responseBad(resp)) return Promise.reject(resp);
      var rows=(resp&&resp.data)||[];
      all=all.concat(rows);
      if(rows.length===CFG.pageSize && p<CFG.maxPages) return page(p+1);
      diag("Read complete: "+reportName,{rows:all.length});
      return all;
    },function(err){
      var msg=(err&&(err.message||err.responseText||""))+"";
      if(err&&typeof err.responseText==="string"){ try{ if(isEmptyCode(JSON.parse(err.responseText))) return all; }catch(e){} }
      if(isEmptyCode(err)) return all;
      if(/9280|3100|no records|no data available|record(s)? not found/i.test(msg)) return all;
      return Promise.reject(err);
    });
  }
  return page(1);
}

function unwrapApi(resp){
  var c=[resp,resp&&resp.details,resp&&resp.details&&resp.details.output,resp&&resp.output,resp&&resp.result,resp&&resp.response];
  for(var i=0;i<c.length;i++){
    var v=c[i]; if(v==null) continue;
    if(typeof v==="string"){
      var t=v.trim(); if(t.charAt(0)==="{"||t.charAt(0)==="["){ try{return JSON.parse(t);}catch(e){} }
    }else if(typeof v==="object" && (v.success!=null||v.contractId||v.message||v.error)) return v;

}

function isSuccess(resp){

  var hasId=!!(resp&&((resp.data&&(resp.data.ID||resp.data.id))||(resp.result&&resp.result.data&&(resp.result.data.ID||resp.result.data.id))));
  return ((code===3000||(resp&&resp.result&&resp.result.code===3000))&&!hasErr)||(!hasErr&&hasId&&code==null);
}
function buildEnvelopes(recordId,fieldData,reportName){
  var rid=String(recordId);
  var appName=(window.ZOHO&&ZOHO.CREATOR&&ZOHO.CREATOR.appName)||undefined;
  return [
    {label:"data:{data}",args:{reportName:reportName,id:rid,data:{data:fieldData}}},
    {label:"data",args:{reportName:reportName,id:rid,data:fieldData}},
    {label:"data:{input}",args:{reportName:reportName,id:rid,data:{input:fieldData}}},
    {label:"input",args:{reportName:reportName,id:rid,input:fieldData}},
    {label:"payload",args:{reportName:reportName,id:rid,payload:{data:fieldData}}},
    {label:"appName+data",args:{appName:appName,reportName:reportName,id:rid,data:fieldData}}
  ];
}
function tryEnvelopes(recordId,fieldData,envelopes,idx){
  if(idx>=envelopes.length) return Promise.reject({message:"No envelope accepted for "+recordId});
  var env=envelopes[idx];
  return ZOHO.CREATOR.API.updateRecord(env.args).then(function(resp){
    if(isSuccess(resp)) return resp;
    throw resp;
  }).catch(function(err){
    var code=err&&err.code;
    if(!code&&err&&typeof err.responseText==="string"){ try{ code=JSON.parse(err.responseText).code; }catch(e){} }
    if(code===2945) return tryEnvelopes(recordId,fieldData,envelopes,idx+1);
    diag("Update failed",{recordId:String(recordId),fields:fieldData,error:err});
    return Promise.reject(err);
  });
}
function updateRecord(recordId,fieldData,reportName){
  if(S.demo) return Promise.resolve({code:3000});
  return tryEnvelopes(recordId,fieldData,buildEnvelopes(recordId,fieldData,reportName),0);
}
function isCreateSuccess(resp){
  var code=resp&&resp.code;
  var hasErr=!!(resp&&(resp.error||(resp.result&&resp.result.error)));
  var hasId=!!(resp&&((resp.data&&(resp.data.ID||resp.data.id))||(resp.result&&resp.result.data&&(resp.result.data.ID||resp.result.data.id))));
  return (!hasErr&&(code===3000||hasId));
}
function buildCreateEnvelopes(formName,fieldData){

    {label:"data:{data}",args:{formName:formName,data:{data:fieldData}}},

    {label:"appName+data",args:{appName:appName,formName:formName,data:fieldData}},
    {label:"input",args:{formName:formName,input:fieldData}}
  ];
}
function tryCreateEnvelopes(formName,fieldData,envelopes,idx){
  if(idx>=envelopes.length) return Promise.reject({message:"No create envelope accepted for "+formName});
  return ZOHO.CREATOR.API.addRecord(envelopes[idx].args).then(function(resp){
    if(isCreateSuccess(resp)||isSuccess(resp)) return resp;

    var code=err&&err.code;
    if(!code&&err&&typeof err.responseText==="string"){ try{ code=JSON.parse(err.responseText).code; }catch(e){} }
    if(code===2945) return tryCreateEnvelopes(formName,fieldData,envelopes,idx+1);
    return Promise.reject(err);
  });
}

function findContract(id){ for(var i=0;i<S.contracts.length;i++) if(String(S.contracts[i].ID)===String(id)) return S.contracts[i]; return null; }
function findAction(id){ for(var i=0;i<S.actions.length;i++) if(String(S.actions[i].ID)===String(id)) return S.actions[i]; return null; }
function actionsFor(cid){
  return S.actions.filter(function(a){ return lookupId(a.Contract1)===String(cid); })
    .sort(function(a,b){ return num(a.Sort_Order)-num(b.Sort_Order); });
}
function versionsFor(cid){
  return S.versions.filter(function(v){ return lookupId(v.Contract1)===String(cid); })
    .sort(function(a,b){ return toInput(b.Date_field1)<toInput(a.Date_field1)?-1:1; });
}
function statsFor(cid){
  var list=actionsFor(cid),st={open:0,done:0,current:0,overdue:0,total:list.length,pct:0};
  list.forEach(function(a){
    if(truthy(a.Complete)) st.done++;
    else { st.open++; if(isOverdue(a)) st.overdue++; }
    if(truthy(a.Current_Action)) st.current++;
  });
  if(st.total) st.pct=Math.round(st.done*100/st.total);
  return st;
}
function currentActionText(cid){
  var list=actionsFor(cid);
  for(var i=0;i<list.length;i++) if(truthy(list[i].Current_Action)&&!truthy(list[i].Complete)) return String(list[i].Contract_Action||"");
  var c=findContract(cid);
  return c?String(c.Current_Action||""):"";
}
function approvalsFor(cid){
  return S.approvals.filter(function(a){ return lookupId(a.Contract1)===String(cid); })
    .sort(function(a,b){ return num(a.Approval_Sequence)-num(b.Approval_Sequence); });

function redlinesFor(cid){

    .sort(function(a,b){ return toInput(b.Date_field)<toInput(a.Date_field)?-1:1; });
}
function pricingFor(cid){
  return S.pricing.filter(function(p){ return lookupId(p.Contract1)===String(cid); })
    .sort(function(a,b){ return num(a.Lot_Size)-num(b.Lot_Size); });
}
function daysBetween(inputA,inputB){
  var a=new Date(inputA+"T00:00:00"), b=new Date(inputB+"T00:00:00");
  if(isNaN(a)||isNaN(b)) return null;
  return Math.round((b-a)/86400000);
}
function daysSince(v){ var i=toInput(v); if(!i) return null; return daysBetween(i,todayInput()); }

function fileUrl(v){
  var s=String(v==null?"":v).trim();
  if(!s) return "";
  if(/^https?:\/\//i.test(s)) return s;
  if(s.charAt(0)==="/") return "https://creatorapp.zoho.com"+s;
  return "";
}
function fileDisplayName(v){
  var raw=String(v&&v.File_field1||"");
  var m=raw.match(/[?&]filepath=([^&]+)/);
  if(m){ try{ return decodeURIComponent(m[1]).replace(/^\d+_/,""); }catch(e){ return m[1]; } }
  var last=raw.split("?")[0].split("/").pop();
  if(last&&last.toLowerCase()!=="download") return last;
  return "Contract file"+(v&&toInput(v.Date_field1)?" · "+fmtDate(v.Date_field1):"");
}

/* LOI queue age — the approval token embeds its creation time: <pfId>-<ms>-<rand> */
function loiQueueDays(r){
  var t=String(r.LOI_Approval_Token||""), m=t.match(/^[^-]+-(\d{12,14})-\d+$/);
  if(!m) return null;
  var d=new Date(parseInt(m[1],10));
  if(isNaN(d)) return null;
  return Math.max(0,Math.round((Date.now()-d.getTime())/86400000));
}

function refreshAfterLOIReview(out,decision){
  return Promise.all([
    sdkGetAll(CFG.reports.contracts),sdkGetAll(CFG.reports.actions),sdkGetAll(CFG.reports.versions).catch(function(){return [];}),loadPendingLOIs(),
    sdkGetAll(CFG.reports.approvals).catch(function(){return [];})
  ]).then(function(res){
    S.contracts=res[0];S.actions=res[1];S.versions=res[2];S.loiReviews=res[3];S.approvals=res[4];
    if(decision==="APPROVE" && out.contractId){ openContract(out.contractId); banner("ok","LOI approved and Contract created."); }
    else { S.view="home";S.homeSection="loi";S.loiSelId=null;renderAll();banner("ok","LOI rejected and returned to the Proforma."); }
  });
}
function submitLOIReview(decision){
  if(S.busy) return;
  var r=findLOI(S.loiSelId); if(!r){banner("err","LOI request not found.");return;}
  var note=($("loiLegalNote")&&$("loiLegalNote").value||"").trim();
  if(decision==="REJECT" && !note){banner("err","Enter a Legal note explaining the rejection.");return;}
  var prompt=decision==="APPROVE"?"Approve this LOI and create the Acquisition Contract?":"Reject this LOI and return it to the Proforma owner?";
  if(!window.confirm(prompt)) return;
  S.busy=true;setStatus("warn",decision==="APPROVE"?"Creating Contract…":"Rejecting LOI…");
  sdkInvoke({api_name:CFG.customApis.reviewLOI,http_method:"POST",content_type:"application/json",payload:{proformaId:String(r.ID),tokenId:String(S.loiToken||r.LOI_Approval_Token||""),decision:decision,legalNote:note}})
    .then(function(resp){
      var out=unwrapApi(resp); if(!out||out.success!==true) throw {message:(out&&(out.message||out.error))||"LOI review failed",raw:resp};
      return refreshAfterLOIReview(out,decision);
    }).catch(function(e){banner("err","LOI review failed: "+errText(e));setStatus("err","Review failed");})
    .finally(function(){S.busy=false;if($("statustext").textContent!=="Review failed")setStatus("ok",S.demo?"Demo data":"Connected");});
}

  }).join("");

/* drag a card onto a column to change contract Status */
var boardDragId=null;
function wireBoardDrag(){
  document.querySelectorAll("[data-bdrag]").forEach(function(card){
    card.addEventListener("dragstart",function(e){ boardDragId=card.getAttribute("data-bdrag"); card.style.opacity=".4"; e.dataTransfer.effectAllowed="move"; try{ e.dataTransfer.setData("text/plain",boardDragId); }catch(err){} });
    card.addEventListener("dragend",function(){ boardDragId=null; document.querySelectorAll("[data-bdrag]").forEach(function(x){ x.style.opacity=""; }); document.querySelectorAll("[data-bcol]").forEach(function(x){ x.style.outline=""; }); });
  });
  document.querySelectorAll("[data-bcol]").forEach(function(col){
    col.addEventListener("dragover",function(e){ if(!boardDragId) return; e.preventDefault(); e.dataTransfer.dropEffect="move"; col.style.outline="2px solid var(--primary-2)"; });
    col.addEventListener("dragleave",function(){ col.style.outline=""; });
    col.addEventListener("drop",function(e){
      e.preventDefault(); col.style.outline="";
      var id=boardDragId; boardDragId=null;
      if(!id) return;
      var target=col.getAttribute("data-bcol");
      var c=findContract(id);
      if(!c||String(c.Status||"New")===target) return;
      setContractStatus(id,target);
    });
  });
}
function setContractStatus(id,status){
  if(S.busy) return;
  if(S.demo){ var c=findContract(id); if(c){ c.Status=status; } banner("ok","Status updated."); renderAll(); return; }
  S.busy=true; setStatus("warn","Saving…");
  updateRecord(String(id),{Status:status},CFG.reports.contracts).then(function(){
    var c=findContract(id); if(c) c.Status=status;
    S.busy=false; setStatus("ok","Connected"); banner("ok","Status updated to "+status+"."); renderAll();
  }).catch(function(e){
    S.busy=false; setStatus("err","Save failed"); banner("err","Status update failed: "+errText(e)); renderAll();
  });
}

/* ============================================================ DETAIL ============================================================ */
function toggleDone(){ S.showDone=!S.showDone; renderAll(); }
function toggleRow(id){ if(S.expanded[id]) delete S.expanded[id]; else S.expanded[id]=true; renderAll(); }
function togglePropose(){ var el=$("proposeCard"); if(el) el.classList.toggle("open"); }
function toggleAdd(){ var el=$("addRow"); if(el) el.classList.toggle("open"); }
function setActionsMode(m){ S.actionsMode=m; renderAll(); }
function addFile(){
  if(S.demo){ banner("ok","Demo mode — inside Creator this opens the Contract Version form."); return; }
  openParent("#Form:"+CFG.forms.version+"?Contract1="+S.selId);
}

function setDetailTab(t){ S.detailTab=t; renderAll(); }
function detailTabs(c){
  var tabs=[
    ["overview","Overview",null],
    ["actions","Actions",actionsFor(c.ID).length],
    ["documents","Documents",versionsFor(c.ID).length],
    ["approvals","Approvals",approvalsFor(c.ID).length],
    ["redlines","Redlines",redlinesFor(c.ID).length],
    ["pricing","Pricing",pricingFor(c.ID).length],
    ["activity","Activity",null]
  ];
  return '<div class="dtabs">'+tabs.map(function(t){
    return '<button class="dtab'+(S.detailTab===t[0]?" on":"")+'" onclick="setDetailTab(\''+t[0]+'\')">'+t[1]
      +(t[2]?' <span class="dtab-n">'+t[2]+'</span>':'')+'</button>';
  }).join("")+'</div>';
}
function renderDetail(){
  var c=findContract(S.selId);
  if(!c){ goHome(); return; }
  var st=statsFor(c.ID);
  var all=actionsFor(c.ID);
  var shown=S.showDone?all:all.filter(function(a){ return !truthy(a.Complete); });

  $("crumb").innerHTML='<a onclick="goHome()">Contracts</a><span class="sep">/</span><strong>'+esc(c.Contract_Name||"Contract")+'</strong>';

  var statusSel='<select class="filter" id="cStatusSel" style="height:26px;font-size:11px;font-weight:700">'
    +allContractStatuses().map(function(s){ return '<option'+(String(c.Status||"New")===s?" selected":"")+'>'+esc(s)+'</option>'; }).join("")+'</select>';
  var strip='<div class="info-strip">'
    +'<div class="info-name-block"><div class="info-kicker">'+esc(c.Contract_Type||"Contract")+(displayValue(c.Subdivision1)?' · '+esc(displayValue(c.Subdivision1)):'')+'</div><div class="info-name">'+esc(c.Contract_Name||("Contract "+c.ID))+'</div>'
    +'<div style="margin-top:7px">'+statusSel+'</div></div>'
    +(displayValue(c.Builder)?'<div class="info-field"><div class="info-lbl">Counterparty</div><div class="info-val">'+esc(displayValue(c.Builder))+'</div></div>':'')
    +'<div class="info-field"><div class="info-lbl">Point Person</div><div class="info-val">'+esc(listDisplay(c.WBW_Point_Person)||"—")+(c.Territory?'<div style="font-size:10px;color:var(--faint)">'+esc(c.Territory)+'</div>':'')+'</div></div>'
    +(c.Number_of_Lots?'<div class="info-field"><div class="info-lbl">Lots</div><div class="info-val">'+esc(c.Number_of_Lots)+' total'+(c.Initial_Takedown?' · '+esc(c.Initial_Takedown)+' initial':'')+'</div></div>':'')
    +'<div class="info-field"><div class="info-lbl">Earnest / Total</div><div class="info-val">'+money(c.Earnest_Money)+' / '+money(c.Total_Contract_Price)+'</div></div>'
    +(toInput(c.Completion_Date)?'<div class="info-field"><div class="info-lbl">Completion</div><div class="info-val" style="color:var(--amber)">'+esc(fmtDate(c.Completion_Date))+'</div></div>':'')
    +(c.Current_Approver?'<div class="info-field"><div class="info-lbl">Current Approver</div><div class="info-val">'+esc(c.Current_Approver)+'</div></div>':'')
    +'</div>';

  var modeSeg='<div class="mode-seg">'
    +'<button class="'+(S.actionsMode==="review"?"active":"")+'" onclick="setActionsMode(\'review\')">Review</button>'
    +'<button class="'+(S.actionsMode==="edit"?"active":"")+'" onclick="setActionsMode(\'edit\')">Edit</button>'
    +'</div>';

  var actionsCard;
  if(S.actionsMode==="edit"){
    actionsCard='<section class="acard-shell">'
      +'<div class="ac-head"><div><h2 class="ac-title">Edit Actions</h2><div class="ac-sub">Attorney workspace · edit any field inline · add actions directly</div></div>'
      +'<div class="spacer"></div>'+modeSeg
      +'<button class="toggle-btn'+(S.showDone?" on":"")+'" onclick="toggleDone()"><span class="toggle-track"><span class="toggle-knob"></span></span>Show Complete</button>'
      +'</div>'
      +'<div class="edit-note">✎ <span><b>Edit mode</b> — changes save on blur. New actions are added directly (no proposal step).</span></div>'
      +renderEditGrid(c.ID,shown)
      +'</section>';
  } else {
    var rowsHtml=shown.length?shown.map(function(a){ return actionRow(a); }).join("")
      :'<div class="empty" style="background:#fff;border:1px dashed var(--line);border-radius:10px;"><b>'+(all.length?"No open actions":"No actions yet")+'</b>'+(all.length?"Toggle Show Complete to review completed actions.":"Propose the first action below.")+'</div>';
    var addRow='<div class="add-row" id="addRow">'
      +'<div class="add-row-head" onclick="toggleAdd()"><span class="add-plus">+</span>Add a new proposed action…</div>'
      +'<div class="add-form">'+proposeFields("a_")+'<div class="form-actions"><button class="btn primary" onclick="proposeAction(\'a_\')">Propose Action</button><button class="btn ghost" onclick="toggleAdd()">Cancel</button></div></div>'
      +'</div>';
    actionsCard='<section class="acard-shell">'
      +'<div class="ac-head"><div><h2 class="ac-title">Actions</h2><div class="ac-sub">Drag ⠿ or use arrows to reorder · click a row to edit</div></div>'
      +'<div class="spacer"></div>'+modeSeg
      +'<button class="toggle-btn'+(S.showDone?" on":"")+'" onclick="toggleDone()"><span class="toggle-track"><span class="toggle-knob"></span></span>Show Complete</button>'
      +'</div>'
      +'<div class="alist" id="alist">'+rowsHtml+addRow+'</div>'
      +'</section>';
  }

  var side='<aside class="side">'
    +'<div class="side-card"><div class="stats-grid">'
    +'<div class="stat-cell stat-open"><div class="stat-n">'+st.open+'</div><div class="stat-t">Open</div></div>'
    +'<div class="stat-cell stat-curr"><div class="stat-n">'+st.current+'</div><div class="stat-t">Current</div></div>'
    +'<div class="stat-cell stat-over"><div class="stat-n">'+st.overdue+'</div><div class="stat-t">Overdue</div></div>'
    +'<div class="stat-cell stat-done"><div class="stat-n">'+st.done+'</div><div class="stat-t">Done</div></div>'
    +'</div><div class="stats-prog"><div class="stats-prog-lbl"><span><b>'+st.done+'</b> of <b>'+st.total+'</b> complete</span><span class="stats-prog-pct">'+st.pct+'%</span></div>'
    +'<div class="progress" style="height:7px"><i style="width:'+st.pct+'%"></i></div></div></div>'

    +(S.actionsMode==="review"
      ?'<div class="side-card" id="proposeCard"><div class="dark-head"><div><div class="dark-kicker">New Action</div><div class="dark-title">Propose Action</div></div></div>'
        +'<div class="propose-trigger" onclick="togglePropose()"><span class="add-plus">+</span>Add a new proposed action<span class="propose-chev">›</span></div>'
        +'<div class="propose-body">'+proposeFields("p_")+'<button class="btn primary" style="width:100%;height:38px;font-weight:800;letter-spacing:.05em;text-transform:uppercase" onclick="proposeAction(\'p_\')">Propose Action</button></div></div>'
      :'')
    +'</aside>';

  var body;
  if(S.detailTab==="actions") body='<div class="dgrid">'+actionsCard+side+'</div>';
  else if(S.detailTab==="documents") body=documentsTab(c);
  else if(S.detailTab==="approvals") body=approvalsTab(c);
  else if(S.detailTab==="redlines") body=redlinesTab(c);
  else if(S.detailTab==="pricing") body=pricingTab(c);
  else if(S.detailTab==="activity") body=activityTab(c);
  else body=overviewTab(c,st);

  $("view").innerHTML='<div class="detailwrap">'
    +'<div style="padding:12px 0 10px;display:flex;align-items:center;gap:8px"><button class="btn ghost sm" onclick="goHome()">← All Contracts</button>'
    +'<div class="spacer"></div>'
    +'<button class="btn sm" onclick="sendForApprovals()">Send for Approvals</button>'
    +'<button class="btn ghost sm" onclick="openContractRecord()">Open in Creator ↗</button>'
    +'</div>'
    +strip+detailTabs(c)+body+'</div>';
  var cs=$("cStatusSel");
  if(cs) cs.addEventListener("change",function(){ setContractStatus(S.selId,cs.value); });
  if(S.detailTab==="actions"){ if(S.actionsMode==="review") wireDrag(); else wireEditGrid(); }
}

/* ---------------- workspace tabs ---------------- */
function overviewTab(c,st){
  var cur=null;
  actionsFor(c.ID).forEach(function(a){ if(!cur&&truthy(a.Current_Action)&&!truthy(a.Complete)) cur=a; });
  var vers=versionsFor(c.ID), latest=vers[0];
  var apps=approvalsFor(c.ID);
  var appDone=apps.filter(function(a){ return String(a.Status||"")==="Approved"; }).length;
  var appNext=null;
  apps.forEach(function(a){ if(!appNext&&String(a.Status||"")!=="Approved") appNext=a; });
  var reds=redlinesFor(c.ID);
  var left='<div class="acard-shell" style="padding:16px 18px">'
    +'<div class="fl">Current action</div>'
    +(cur
      ?'<div style="font-size:14px;font-weight:700;color:var(--text);line-height:1.35">'+esc(cur.Contract_Action||"")+'</div>'
        +'<div style="font-size:11px;color:var(--faint);margin:4px 0 12px">'+(cur.Dev_Mgr?esc(cur.Dev_Mgr)+' · ':'')
        +(toInput(cur.Due_Date)?(isOverdue(cur)?'<span style="color:#dc2626;font-weight:700">overdue since '+esc(fmtDate(cur.Due_Date))+'</span>':'due '+esc(fmtDate(cur.Due_Date))):'no due date')+'</div>'
        +'<div style="display:flex;gap:7px;flex-wrap:wrap"><button class="btn green sm" onclick="quickComplete(\''+cur.ID+'\')">✓ Complete &amp; advance</button>'
        +'<button class="btn sm" onclick="setDetailTab(\'actions\')">All actions →</button></div>'
      :'<div style="color:var(--muted);margin-bottom:10px">No current action.</div><button class="btn sm" onclick="setDetailTab(\'actions\')">Open actions →</button>')
    +'<div style="border-top:1px solid var(--line);margin:14px 0 12px"></div>'
    +'<div class="fl">Progress</div>'
    +'<div class="stats-prog-lbl" style="display:flex;justify-content:space-between;font-size:11px;color:var(--muted)"><span><b>'+st.done+'</b> of <b>'+st.total+'</b> actions complete'+(st.overdue?' · <span style="color:#dc2626;font-weight:700">'+st.overdue+' overdue</span>':'')+'</span><span style="font-weight:800;color:var(--green)">'+st.pct+'%</span></div>'
    +'<div class="progress" style="height:7px;margin-top:5px"><i style="width:'+st.pct+'%"></i></div>'
    +'</div>';
  var right='<div class="acard-shell" style="padding:16px 18px">'
    +'<div class="fl">Latest document</div>'
    +(latest
      ?'<div style="font-weight:700;color:var(--primary);cursor:pointer" onclick="openVersionFile(\''+latest.ID+'\')">'+esc(fileDisplayName(latest)||"Attachment")+' ↗</div>'
        +'<div style="font-size:11px;color:var(--faint);margin:2px 0 10px">'+esc(fmtDate(latest.Date_field1)||"")+(truthy(latest.Email_Attachment)?' · attached to approval email ✓':'')+'</div>'
      :'<div style="color:var(--muted);margin-bottom:10px">No documents yet.</div>')
    +'<button class="btn sm" onclick="setDetailTab(\'documents\')">Documents →</button>'
    +'<div style="border-top:1px solid var(--line);margin:14px 0 12px"></div>'
    +'<div class="fl">Approvals</div>'
    +(apps.length
      ?'<div style="font-weight:700;margin-bottom:2px">'+appDone+' of '+apps.length+' approved'+(appNext?' · next: '+esc(appNext.Approver||"—"):'')+'</div>'
      :'<div style="color:var(--muted)">No approvers configured.</div>')
    +'<div style="font-size:11px;color:var(--faint);margin:2px 0 10px">'+(reds.length?reds.length+' redline review'+(reds.length>1?'s':'')+' logged':'no redlines logged')+'</div>'
    +'<button class="btn sm" onclick="setDetailTab(\'approvals\')">Approvals →</button>'
    +'</div>';
  return '<div class="dgrid" style="grid-template-columns:1.4fr 1fr">'+left+right+'</div>';
}

function documentsTab(c){
  var vers=versionsFor(c.ID);
  var rows=vers.map(function(v){
    var name=fileDisplayName(v)||("Attachment "+v.ID);
    var lower=name.toLowerCase(), lbl="DOC", ic="doc";
    if(/\.pdf(\?|$)/.test(lower)){ lbl="PDF"; ic="pdf"; }
    else if(/\.(xls|xlsx)(\?|$)/.test(lower)){ lbl="XLS"; ic="xls"; }
    else if(/\.(png|jpe?g|gif|webp)(\?|$)/.test(lower)){ lbl="IMG"; ic=""; }
    var onEmail=truthy(v.Email_Attachment);
    return '<tr style="cursor:default">'
      +'<td style="width:52px"><span class="attach-icon '+ic+'" style="width:34px;height:26px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;font-size:9.5px;font-weight:800">'+lbl+'</span></td>'
      +'<td style="white-space:normal"><b style="color:var(--primary);cursor:pointer" onclick="openVersionFile(\''+v.ID+'\')" title="Open file">'+esc(name)+'</b></td>'
      +'<td style="width:90px">'+esc(fmtDate(v.Date_field1)||"—")+'</td>'
      +'<td style="width:150px">'+esc(v.Added_User||"—")+'</td>'
      +'<td style="width:150px;text-align:center"><button class="toggle-btn'+(onEmail?" on":"")+'" title="Attach this file to internal approval emails" onclick="toggleEmailAttach(\''+v.ID+'\')"><span class="toggle-track"><span class="toggle-knob"></span></span></button></td>'
      +'<td style="width:160px;text-align:right"><button class="btn sm" onclick="openVersionFile(\''+v.ID+'\')">Open ↗</button> '
      +'<button class="btn ghost sm" onclick="openRecord(CFG.forms.version,CFG.reports.versions,\''+v.ID+'\')" title="Open the version record">Record</button></td>'
      +'</tr>';
  }).join("");
  return '<div class="acard-shell"><div class="ac-head"><div><h2 class="ac-title">Documents</h2><div class="ac-sub">Versions and exhibits · "On approval email" controls what internal approvers receive</div></div>'
    +'<div class="spacer"></div><button class="btn primary" onclick="addFile()">+ Add File</button></div>'
    +(vers.length
      ?'<div class="tscroll"><table class="wtable"><thead><tr><th></th><th>File</th><th>Date</th><th>Added By</th><th style="text-align:center">On Approval Email</th><th></th></tr></thead><tbody>'+rows+'</tbody></table></div>'
      :'<div class="empty"><b>No documents yet</b>Add the first contract file with + Add File.</div>')
    +'</div>';
}
function toggleEmailAttach(id){
  var v=null; S.versions.forEach(function(x){ if(String(x.ID)===String(id)) v=x; });
  if(!v||S.busy) return;
  var next=!truthy(v.Email_Attachment);
  if(S.demo){ v.Email_Attachment=next; renderAll(); return; }
  S.busy=true; setStatus("warn","Saving…");
  updateRecord(String(id),{Email_Attachment:next},CFG.reports.versions).then(function(){
    v.Email_Attachment=next; S.busy=false; setStatus("ok","Connected"); renderAll();
  }).catch(function(e){ S.busy=false; setStatus("err","Save failed"); banner("err","Save failed: "+errText(e)); });
}

function approvalsTab(c){
  var apps=approvalsFor(c.ID);
  var willAttach=versionsFor(c.ID).filter(function(v){ return truthy(v.Email_Attachment); })
    .map(function(v){ return fileDisplayName(v); }).filter(Boolean);
  var rows=apps.map(function(a){
    var stv=String(a.Status||"Not Sent");
    var tone=stv==="Approved"?"Complete":stv==="Rejected"?"Overdue":stv==="Awaiting Approval"?"Awaiting WBW":"Open";
    var since=stv==="Awaiting Approval"?daysSince(a.Last_Reminder_Date):null;
    var sub=[];
    if(a.Type1) sub.push(esc(String(a.Type1)));
    if(stv==="Approved"&&toInput(a.Approval_Date)) sub.push("approved "+esc(fmtDate(a.Approval_Date)));
    if(stv==="Awaiting Approval") sub.push(a.Last_Reminder_Date?("last reminder "+esc(fmtDate(a.Last_Reminder_Date))+(since!=null?" · "+since+"d ago":"")):"no reminder sent yet");
    if(stv==="Rejected"&&a.Reject_Reason) sub.push('<span style="color:#dc2626">reason: '+esc(a.Reject_Reason)+'</span>');
    return '<tr style="cursor:default'+(stv==="Awaiting Approval"?';background:var(--amber-bg)':'')+'">'
      +'<td style="width:44px;text-align:center"><span class="num-badge" style="margin:0 auto">'+(stv==="Approved"?"✓":esc(a.Approval_Sequence||"·"))+'</span></td>'
      +'<td style="white-space:normal"><b>'+esc(a.Approver||"—")+'</b><div style="font-size:11px;color:var(--faint)">'+sub.join(" · ")+'</div></td>'
      +'<td style="width:140px">'+chip(stv==="Awaiting Approval"?"Awaiting WBW":stv==="Rejected"?"Approval Rejected":stv==="Approved"?"Approved":"New")+'</td>'
      +'<td style="width:200px;text-align:right">'
      +(stv==="Awaiting Approval"?'<button class="btn sm" onclick="remindApprover(\''+a.ID+'\')">Remind now</button> ':'')
      +'<button class="btn ghost sm" onclick="openRecord(CFG.forms.approval,CFG.reports.approvals,\''+a.ID+'\')">Record</button></td>'
      +'</tr>';
  }).join("");
  return '<div class="acard-shell"><div class="ac-head"><div><h2 class="ac-title">Internal Approvals</h2><div class="ac-sub">Sequenced sign-off chain · rejections show their reason inline</div></div>'
    +'<div class="spacer"></div>'
    +'<button class="btn" onclick="openParent(\'#Form:\'+CFG.forms.approval+\'?Contract1=\'+S.selId)">+ Add Approver</button>'
    +'<button class="btn primary" onclick="sendForApprovals()">Send for Approvals</button></div>'
    +(apps.length
      ?'<div class="tscroll"><table class="wtable"><tbody>'+rows+'</tbody></table></div>'
        +'<div style="padding:10px 16px;border-top:1px dashed var(--line);font-size:11.5px;color:var(--muted)">Will attach to approval emails: '
        +(willAttach.length?'<b>'+willAttach.map(esc).join(", ")+'</b>':'<span style="color:var(--amber)">nothing — flag files on the Documents tab first</span>')+'</div>'
      :'<div class="empty"><b>No approvers configured</b>Add approver rows, flag the files to attach on the Documents tab, then Send for Approvals.</div>')
    +'</div>';
}
function sendForApprovals(){
  if(S.busy) return;
  var apps=approvalsFor(S.selId);
  if(!apps.length){ S.detailTab="approvals"; renderAll(); banner("err","Add at least one approver before sending."); return; }
  var flagged=apps.filter(function(a){ return truthy(a.Approval_Email); });
  if(!window.confirm("Send approval emails now?\n\nEmails go to approvers with the Email flag set"+(flagged.length?" ("+flagged.length+" flagged)":" (none currently flagged — set the Email flag on the approval records first)")+".")) return;
  if(S.demo){ banner("ok","Demo mode — inside Creator this sends the approval emails."); return; }
  S.busy=true; setStatus("warn","Sending…");
  sdkInvoke({api_name:CFG.customApis.sendApprovals,http_method:"POST",content_type:"application/json",payload:{contractId:String(S.selId)}})
    .then(function(resp){
      var out=unwrapApi(resp);
      if(!out||out.success!==true) throw {message:(out&&(out.message||out.error))||"Send failed",raw:resp};
      S.busy=false; setStatus("ok","Connected"); banner("ok","Approval emails sent.");
      reloadQuiet();
    }).catch(function(e){
      S.busy=false; setStatus("ok","Connected");
      banner("err","Could not send from the widget ("+errText(e)+"). Use the \"Send for Approvals\" action on the All Contracts report until the Send_Contract_Approvals function is installed.");
    });
}
function remindApprover(id){
  if(S.busy) return;
  if(S.demo){ banner("ok","Demo mode — inside Creator this re-sends the approval email."); return; }
  S.busy=true; setStatus("warn","Sending reminder…");
  sdkInvoke({api_name:CFG.customApis.remindApproval,http_method:"POST",content_type:"application/json",payload:{approvalId:String(id)}})
    .then(function(resp){
      var out=unwrapApi(resp);
      if(!out||out.success!==true) throw {message:(out&&(out.message||out.error))||"Reminder failed",raw:resp};
      S.busy=false; setStatus("ok","Connected"); banner("ok","Reminder sent.");
      reloadQuiet();
    }).catch(function(e){
      S.busy=false; setStatus("ok","Connected");
      banner("err","Could not send the reminder ("+errText(e)+"). The Remind_Contract_Approval function is not installed yet.");
    });
}

function redlinesTab(c){
  var reds=redlinesFor(c.ID);
  var rows=reds.map(function(r){
    return '<tr style="cursor:default"><td style="width:96px">'+esc(fmtDate(r.Date_field)||"—")+'</td>'
      +'<td style="white-space:normal">'+esc(r.Description||"")+'</td>'
      +'<td style="width:150px" class="subtle">'+esc(r.Added_User||"—")+'</td>'
      +'<td style="width:80px;text-align:right"><button class="btn ghost sm" onclick="openRecord(CFG.forms.redline,CFG.reports.redlines,\''+r.ID+'\')">Record</button></td></tr>';
  }).join("");
  return '<div class="acard-shell"><div class="ac-head"><div><h2 class="ac-title">Redline Reviews</h2><div class="ac-sub">Dated log of redline turns on this contract</div></div><div class="spacer"></div></div>'
    +'<div style="padding:12px 16px;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap;background:#f8fafc">'
    +'<div style="flex:1;min-width:220px"><span class="fl">Description</span><textarea class="input" id="rlDesc" rows="1" placeholder="e.g. Returned v3 with revised takedown exhibit and indemnity edits"></textarea></div>'
    +'<div style="flex:0 0 140px"><span class="fl">Date</span><input type="date" class="input" id="rlDate" value="'+todayInput()+'"/></div>'
    +'<button class="btn primary" onclick="addRedline()">Log Redline</button></div>'
    +(reds.length
      ?'<div class="tscroll"><table class="wtable"><thead><tr><th>Date</th><th>Description</th><th>Added By</th><th></th></tr></thead><tbody>'+rows+'</tbody></table></div>'
      :'<div class="empty"><b>No redlines logged</b>Log each redline turn so the negotiation history lives here, not in inboxes.</div>')
    +'</div>';
}
function addRedline(){
  if(S.busy) return;
  var desc=($("rlDesc")&&$("rlDesc").value||"").trim();
  var date=$("rlDate")&&$("rlDate").value;
  if(!desc||!date){ banner("err","Enter a description and date for the redline."); return; }
  var fieldData={ Contract1:S.selId, Description:desc, Date_field:toZoho(date) };
  S.busy=true; setStatus("warn","Saving…");
  createRecord(CFG.forms.redline,fieldData).then(function(resp){
    S.busy=false; setStatus("ok",S.demo?"Demo data":"Connected"); banner("ok","Redline logged.");
    if(S.demo){
      var local=JSON.parse(JSON.stringify(fieldData));
      local.ID=String((resp&&resp.data&&resp.data.ID)||("demo_"+Date.now()));
      local.Contract1={ID:String(S.selId),display_value:""};
      S.redlines.push(local); renderAll();
    } else {
      sdkGetAll(CFG.reports.redlines).then(function(rows){ S.redlines=rows; renderAll(); }).catch(function(){ renderAll(); });

function gSaveField(el){
  var id=el.getAttribute("data-id"), f=el.getAttribute("data-f");
  var a=findAction(id); if(!a) return;
  var raw=el.value;
  var val=(f==="Start_Date"||f==="Due_Date"||f==="Complete_Date")?toZoho(raw):raw;
  var oldZ=(f==="Start_Date"||f==="Due_Date"||f==="Complete_Date")?toZoho(toInput(a[f])):(a[f]||"");
  if(String(val)===String(oldZ)) return;
  var data={}; data[f]=val;
  if(f==="Status"&&raw==="Complete"&&!truthy(a.Complete)){ data.Complete=true; data.Current_Action=false; if(!toInput(a.Complete_Date)) data.Complete_Date=toZoho(todayInput()); }
  if(f==="Status"&&raw!=="Complete"&&truthy(a.Complete)){ data.Complete=false; data.Complete_Date=""; }
  updateRecord(id,data,CFG.reports.actions).then(function(){
    applyLocal(id,data);
    el.classList.add("eg-saved"); setTimeout(function(){ el.classList.remove("eg-saved"); },1400);
    if(("Complete" in data)) renderAll();
  }).catch(function(e){ banner("err","Save failed: "+errText(e)); reloadActions(); });

function gAdd(title){

  createRecord(CFG.forms.action,fieldData).then(function(resp){
    S.busy=false; setStatus("ok",S.demo?"Demo data":"Connected"); banner("ok","Action added.");
    if(S.demo){
      var nid=(resp&&resp.data&&resp.data.ID)||("demo_"+Date.now());
      var local=JSON.parse(JSON.stringify(fieldData)); local.ID=String(nid); local.Contract1={ID:String(S.selId),display_value:""}; local.Current_Action="false";
      S.actions.push(local); renderAll();

function wireGridDrag(wrap){

    h.addEventListener("dragend",function(){ dragId=null; wrap.querySelectorAll("tr").forEach(function(r){ r.style.opacity=""; r.style.boxShadow=""; }); });
  });
  wrap.querySelectorAll("tr[data-row]").forEach(function(row){
    row.addEventListener("dragover",function(e){ if(!dragId||row.getAttribute("data-row")===dragId) return; e.preventDefault(); e.dataTransfer.dropEffect="move"; row.style.boxShadow="inset 0 3px 0 0 var(--primary-2)"; });
    row.addEventListener("dragleave",function(){ row.style.boxShadow=""; });
    row.addEventListener("drop",function(e){ e.preventDefault(); row.style.boxShadow=""; var t=row.getAttribute("data-row"); if(!dragId||t===dragId) return; dropReorder(dragId,t); dragId=null; });
  });

/* ---------------- persistence ---------------- */
function applyLocal(id,data){
  var a=findAction(id); if(!a) return;
  Object.keys(data).forEach(function(k){ a[k]=data[k]; });
}
function runUpdates(list){
  /* list: [[id, data], ...] — sequential, then re-render */
  S.busy=true; setStatus("warn","Saving…");
  var p=Promise.resolve();
  list.forEach(function(u){
    p=p.then(function(){ return updateRecord(u[0],u[1],CFG.reports.actions).then(function(){ applyLocal(u[0],u[1]); }); });
  });
  return p.then(function(){
    S.busy=false; setStatus("ok",S.demo?"Demo data":"Connected"); renderAll();
  }).catch(function(e){
    S.busy=false; setStatus("err","Save failed");
    banner("err","Save failed: "+errText(e));
    reloadActions();
  });
}
function reloadActions(){
  if(S.demo){ renderAll(); return; }
  sdkGetAll(CFG.reports.actions).then(function(rows){ S.actions=rows; renderAll(); }).catch(function(){ renderAll(); });
}

/* ensure exactly one open action is Current (Deluge parity) */
function ensureCurrentUpdates(cid,updates,already){
  var all=actionsFor(cid);
  var hasCurrent=all.some(function(a){
    var pend=(already||{})[String(a.ID)];
    var complete=pend&&"Complete" in pend?pend.Complete:truthy(a.Complete);
    var current=pend&&"Current_Action" in pend?pend.Current_Action:truthy(a.Current_Action);
    return !complete&&current;
  });
  if(!hasCurrent){
    for(var i=0;i<all.length;i++){
      var a=all[i], pend=(already||{})[String(a.ID)];
      var complete=pend&&"Complete" in pend?pend.Complete:truthy(a.Complete);
      if(!complete){ updates.push([String(a.ID),{Current_Action:true}]); break; }
    }
  }
}

function saveAction(id){
  var a=findAction(id); if(!a||S.busy) return;
  var dm=$("f_dm_"+id).value;
  if(!dm){ banner("err","Choose an assignee before saving or completing this action."); return; }
  var status=$("f_st_"+id).value;
  var data={
    Dev_Mgr:dm,
    Dev_Notes:$("f_nt_"+id).value,
    Start_Date:toZoho($("f_sd_"+id).value),
    Due_Date:toZoho($("f_dd_"+id).value),
    Complete_Date:toZoho($("f_cd_"+id).value),
    Status:status
  };
  var updates=[];
  if(status==="Complete"){
    data.Complete=true; data.Current_Action=false;
    if(!data.Complete_Date) data.Complete_Date=toZoho(todayInput());
    updates.push([id,data]);
    advanceCurrent(id,updates);
  } else {
    if(truthy(a.Complete)){ data.Complete=false; data.Complete_Date=""; }
    updates.push([id,data]);
    var pend={}; pend[id]=data;
    ensureCurrentUpdates(lookupId(a.Contract1),updates,pend);
  }
  banner("ok","Action updated.");
  runUpdates(updates);
}

function advanceCurrent(completedId,updates){
  var a=findAction(completedId); if(!a) return;
  var cid=lookupId(a.Contract1);
  var all=actionsFor(cid);
  all.forEach(function(r){
    if(String(r.ID)!==String(completedId)&&truthy(r.Current_Action)) updates.push([String(r.ID),{Current_Action:false}]);
  });
  var sort=num(a.Sort_Order), next=null;
  all.forEach(function(r){
    if(String(r.ID)===String(completedId)||truthy(r.Complete)) return;
    if(num(r.Sort_Order)>sort&&(next==null||num(r.Sort_Order)<num(next.Sort_Order))) next=r;
  });
  if(!next){ for(var i=0;i<all.length;i++){ var r=all[i]; if(String(r.ID)!==String(completedId)&&!truthy(r.Complete)){ next=r; break; } } }
  if(next) updates.push([String(next.ID),{Current_Action:true}]);
}

function quickComplete(id){ completeAction(id,true); }
function completeAction(id,quick){
  var a=findAction(id); if(!a||S.busy) return;
  var dmEl=$("f_dm_"+id);
  var dm=quick?String(a.Dev_Mgr||""):(dmEl?dmEl.value:String(a.Dev_Mgr||""));
  if(!dm){
    /* jump to the contract with the row expanded so the assignee can be set */
    S.view="detail"; S.selId=lookupId(a.Contract1); S.detailTab="actions";
    S.expanded[id]=true; renderAll();
    banner("err","Choose an assignee before completing this action.");
    return;
  }
  var cd=quick?"":$("f_cd_"+id).value;
  var data={
    Dev_Mgr:dm, Complete:true, Current_Action:false, Status:"Complete",
    Complete_Date:toZoho(cd||todayInput())
  };
  if(!quick){
    data.Dev_Notes=$("f_nt_"+id).value;
    data.Start_Date=toZoho($("f_sd_"+id).value);
    data.Due_Date=toZoho($("f_dd_"+id).value);
  }
  delete S.expanded[id];
  var updates=[[id,data]];
  advanceCurrent(id,updates);
  banner("ok","Action completed.");
  runUpdates(updates);
}

function reopenAction(id){
  var a=findAction(id); if(!a||S.busy) return;
  var data={Complete:false,Complete_Date:"",Current_Action:true};
  if(String(a.Status||"")==="Complete") data.Status="New";
  var updates=[[id,data]];
  actionsFor(lookupId(a.Contract1)).forEach(function(r){
    if(String(r.ID)!==String(id)&&truthy(r.Current_Action)) updates.push([String(r.ID),{Current_Action:false}]);
  });
  S.expanded[id]=true;
  banner("ok","Action reopened.");
  runUpdates(updates);
}

/* reorder: arrows swap with visible neighbour; drag reinserts */
function moveAction(id,dir){
  if(S.busy) return;
  var a=findAction(id); if(!a) return;
  var cid=lookupId(a.Contract1);
  var all=actionsFor(cid);
  var visible=S.showDone?all:all.filter(function(r){ return !truthy(r.Complete); });
  var vi=visible.findIndex(function(r){ return String(r.ID)===String(id); });
  var ni=vi+dir;
  if(vi<0||ni<0||ni>=visible.length) return;
  var other=visible[ni];
  var updates=[
    [String(a.ID),{Sort_Order:num(other.Sort_Order)}],
    [String(other.ID),{Sort_Order:num(a.Sort_Order)}]
  ];
  runUpdates(updates);
}
var dragId=null;
function wireDrag(){
  var list=$("alist"); if(!list) return;
  list.querySelectorAll("[data-drag]").forEach(function(h){
    h.addEventListener("dragstart",function(e){
      dragId=h.getAttribute("data-drag");
      var row=h.closest(".arow"); if(row) row.classList.add("dragging");
      e.dataTransfer.effectAllowed="move";
      try{ e.dataTransfer.setData("text/plain",dragId); }catch(err){}
    });
    h.addEventListener("dragend",function(){
      dragId=null;
      list.querySelectorAll(".arow").forEach(function(r){ r.classList.remove("dragging","dragover"); });
    });
  });
  list.querySelectorAll(".arow[data-row]").forEach(function(row){
    row.addEventListener("dragover",function(e){
      if(!dragId||row.getAttribute("data-row")===dragId) return;
      e.preventDefault(); e.dataTransfer.dropEffect="move";
      row.classList.add("dragover");
    });
    row.addEventListener("dragleave",function(){ row.classList.remove("dragover"); });
    row.addEventListener("drop",function(e){
      e.preventDefault(); row.classList.remove("dragover");
      var targetId=row.getAttribute("data-row");
      if(!dragId||targetId===dragId) return;
      dropReorder(dragId,targetId);
      dragId=null;
    });
  });
}
function dropReorder(movedId,beforeId){
  if(S.busy) return;
  var a=findAction(movedId); if(!a) return;
  var cid=lookupId(a.Contract1);
  var all=actionsFor(cid);
  var order=all.map(function(r){ return String(r.ID); });
  var from=order.indexOf(String(movedId)), to=order.indexOf(String(beforeId));
  if(from<0||to<0) return;
  order.splice(from,1);
  to=order.indexOf(String(beforeId));
  order.splice(to,0,String(movedId));
  var updates=[];
  order.forEach(function(rid,i){
    var r=findAction(rid);
    if(num(r.Sort_Order)!==i+1) updates.push([rid,{Sort_Order:i+1}]);
  });
  if(updates.length) runUpdates(updates);
}

function proposeAction(pfx){
  if(S.busy) return;
  var title=$(pfx+"title").value.trim(), notes=$(pfx+"notes").value.trim(),
      start=$(pfx+"start").value, due=$(pfx+"due").value, dm=$(pfx+"dm").value;
  if(!title||!notes||!start||!due||!dm){ banner("err","All Propose Action fields are required."); return; }
  var all=actionsFor(S.selId), maxSort=0;
  all.forEach(function(r){ if(num(r.Sort_Order)>maxSort) maxSort=num(r.Sort_Order); });
  var fieldData={
    Contract1:S.selId,
    Contract_Action:title, Dev_Notes:notes, Dev_Mgr:dm,
    Start_Date:toZoho(start), Due_Date:toZoho(due),
    Status:"Proposed", Complete:false, Sort_Order:maxSort+1
  };
  S.busy=true; setStatus("warn","Saving…");
  createRecord(CFG.forms.action,fieldData).then(function(resp){
    S.busy=false; setStatus("ok",S.demo?"Demo data":"Connected");
    banner("ok","Action proposed.");
    if(S.demo){
      var nid=(resp&&resp.data&&resp.data.ID)||("demo_"+Date.now());
      var local=JSON.parse(JSON.stringify(fieldData));
      local.ID=String(nid); local.Contract1={ID:String(S.selId),display_value:""}; local.Current_Action=false;
      S.actions.push(local); renderAll();
    } else {
      sdkGetAll(CFG.reports.actions).then(function(rows){ S.actions=rows; renderAll(); });
    }
  }).catch(function(e){
    S.busy=false; setStatus("err","Save failed");
    banner("err","Propose failed: "+errText(e));
  });
}

/* ---------------- render root ---------------- */
function renderAll(){
  if(S.view==="detail"&&S.selId) renderDetail();
  else if(S.view==="loiReview"&&S.loiSelId) renderLOIReview();
  else if(S.homeSection==="loi") renderLOIReviews();
  else if(S.homeSection==="queue") renderQueue();
  else if(S.homeSection==="dashboard") renderDashboard();
  else { $("crumb").innerHTML='<a onclick="showContracts()">Contracts</a>'; renderHome(); }
}

/* ---------------- data load ---------------- */
function loadData(){
  setStatus("warn","Loading…");
  Promise.all([
    sdkGetAll(CFG.reports.contracts),
    sdkGetAll(CFG.reports.actions),
    sdkGetAll(CFG.reports.versions).catch(function(){ return []; }),
    loadPendingLOIs().catch(function(){ return []; }),
    sdkGetAll(CFG.reports.approvals).catch(function(){ return []; }),
    sdkGetAll(CFG.reports.redlines).catch(function(){ return []; }),
    sdkGetAll(CFG.reports.pricing).catch(function(){ return []; })
  ]).then(function(res){
    S.contracts=res[0]; S.actions=res[1]; S.versions=res[2]; S.loiReviews=res[3];
    S.approvals=res[4]; S.redlines=res[5]; S.pricing=res[6];
    setStatus("ok","Connected");
    var qp=S.deepLink||readPageParams(); S.deepLink=qp;
    /* email links send `token=`; older links sent `tokenId=` — accept both (B5 fix) */
    if(qp.loiReviewId && findLOI(qp.loiReviewId)){ openLOIReview(qp.loiReviewId,qp.token||qp.tokenId||""); }
    else if(qp.contractId && findContract(qp.contractId)){ openContract(qp.contractId); }
    else renderAll();
  }).catch(function(e){
    setStatus("err","Load failed");
    banner("err","Could not load data: "+errText(e));
    loadDemo();
  });
}
function reloadQuiet(){
  if(S.demo){ renderAll(); return; }
  Promise.all([
    sdkGetAll(CFG.reports.contracts),
    sdkGetAll(CFG.reports.actions),
    sdkGetAll(CFG.reports.versions).catch(function(){ return []; }),
    sdkGetAll(CFG.reports.approvals).catch(function(){ return []; }),
    sdkGetAll(CFG.reports.redlines).catch(function(){ return []; })
  ]).then(function(res){
    S.contracts=res[0]; S.actions=res[1]; S.versions=res[2]; S.approvals=res[3]; S.redlines=res[4];
    renderAll();
  }).catch(function(){ renderAll(); });
}

/* ---------------- demo data ---------------- */
function loadDemo(){
  S.demo=true;
  S.contracts=[];
  S.actions=[];
  S.versions=[];
  S.loiReviews=[];
  setStatus("warn","Preview mode — connect inside Creator to load records");
  renderAll();
}

/* ---------------- boot ---------------- */
var initDone=false;
function fallbackDemo(){ if(!initDone){ initDone=true; loadDemo(); } }
if(window.ZOHO && window.ZOHO.CREATOR && typeof ZOHO.CREATOR.init==="function"){
  var demoTimer=setTimeout(fallbackDemo,5000);
  ZOHO.CREATOR.init().then(function(){
    if(initDone) return;
    initDone=true; clearTimeout(demoTimer);
    S.liveSDK=true;
    if(window.LMCriticalErrors)window.LMCriticalErrors.markReady();
    resolvePageParams().then(function(p){ S.deepLink=p||{}; loadData(); });
  }).catch(function(err){ clearTimeout(demoTimer); diag("Creator init error",err); fallbackDemo(); });
} else {
  fallbackDemo();
}
window.addEventListener("error",function(e){diag("Unhandled widget error",{message:e.message,source:e.filename,line:e.lineno,column:e.colno,stack:e.error&&e.error.stack});});
window.addEventListener("unhandledrejection",function(e){diag("Unhandled promise rejection",{reason:e.reason});});
</script>
