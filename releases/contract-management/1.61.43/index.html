   Send_for_Approvals can never pick up a half-built row with no address. */
function aprAddBlank(cid){
  if(!needsContractEdit(cid)) return;
  if(S.busy) return;
  var mx=0;
  approvalsFor(cid).forEach(function(a){ if(num(a.Approval_Sequence)>mx) mx=num(a.Approval_Sequence); });
  var fieldData={ Contract1:String(cid), Approver:"", Type1:"Contract Approval",
                  Approval_Sequence:mx+1, Approval_Email:false, Status:"Not Sent" };
  S.busy=true; setStatus("warn","Adding approver\u2026");
  createRecord(CFG.forms.approval,fieldData).then(function(resp){
    var nid=String((resp&&resp.data&&(resp.data.ID||resp.data.id))
      ||(resp&&resp.result&&resp.result.data&&resp.result.data.ID)||("demo_"+Date.now()));
    contractReleaseBusy(); setStatus("ok","Connected");
    banner("ok","Approver added \u2014 enter an email address.");
    if(S.demo){
      var local=JSON.parse(JSON.stringify(fieldData));
      local.ID=nid; local.Contract1={ID:String(cid),display_value:""};
      S.approvals.push(local); refreshDetailPanel(); aprFocusRow(nid); return;
    }
    sdkGetAll(CFG.reports.approvals)
      .then(function(r){ S.approvals=r; refreshDetailPanel(); aprFocusRow(nid); })
      .catch(function(){ refreshDetailPanel(); });
  }).catch(function(e){

    banner("err","Could not add the approver: "+errText(e));

function aprFocusRow(id){

/* Renumbers Approval_Sequence 1..n after a swap and writes only the rows whose
   number actually changed. Stands in for Pro Forma's reorder Custom API. */
function aprMove(cid,id,delta){
  if(!needsContractEdit(cid)) return;
  if(S.busy) return;
  var rows=approvalsFor(cid), idx=-1;
  rows.forEach(function(a,i){ if(String(a.ID)===String(id)) idx=i; });
  var next=idx+Number(delta||0);
  if(idx<0||next<0||next>=rows.length) return;
  var tmp=rows[idx]; rows[idx]=rows[next]; rows[next]=tmp;
  var writes=[];
  rows.forEach(function(a,i){ if(num(a.Approval_Sequence)!==i+1) writes.push({row:a,seq:i+1}); });
  if(!writes.length){ refreshDetailPanel(); return; }
  S.busy=true; setStatus("warn","Saving order\u2026");
  var chain=Promise.resolve();
  writes.forEach(function(w){
    chain=chain.then(function(){
      w.row.Approval_Sequence=w.seq;
      return S.demo?null:updateRecord(String(w.row.ID),{Approval_Sequence:w.seq},CFG.reports.approvals);
    });
  });
  chain.then(function(){ contractReleaseBusy(); setStatus("ok","Connected"); refreshDetailPanel(); })
   .catch(function(e){
     contractReleaseBusy(); setStatus("err","Reorder failed");
     banner("err","Could not save the approval order: "+errText(e));
     refreshDetailPanel();
   });
}
function aprDelete(cid,id){

function doAprDelete(cid,id){

function doAprResetChain(cid){

  var data={Status:"Not Sent",Approval_Date:"",Reject_Reason:""};

function aprSave(el){
  var id=el.getAttribute("data-id"), f=el.getAttribute("data-f");
  var a=findApproval(id); if(!a) return;
  var val=el.value;
  if(String(val)===String(a[f]||"")) return;
  var data={}; data[f]=(f==="Approval_Sequence")?num(val):val;
  if(f==="Status"&&val==="Approved"&&!toInput(a.Approval_Date)) data.Approval_Date=toZoho(todayInput());

    Object.keys(data).forEach(function(k){ a[k]=data[k]; });
    el.classList.add("saved"); setTimeout(function(){ el.classList.remove("saved"); },1200);
    if(f==="Status"||f==="Type1"||f==="Approval_Sequence"){
    if(overlayOpen()) showApprovalsModal(lookupId(a.Contract1)); else refreshDetailPanel();
  }
  }
  if(S.demo){ apply(); return; }

function aprToggleEmail(id){

  function paint(){ if(overlayOpen()) showApprovalsModal(lookupId(a.Contract1)); else refreshDetailPanel(); }
  a.Approval_Email=next?"true":"false"; paint();
  if(S.demo) return;
  return updateRecord(String(id),{Approval_Email:next?"true":"false"},CFG.reports.approvals)
    .catch(function(e){ a.Approval_Email=prev; paint(); banner("err","Save failed: "+errText(e)); })
    .finally(contractControls);

function aprAdd(cid){
  if(!needsContractEdit(cid)) return;
  var email=($("na_email")&&$("na_email").value||"").trim();
  var type=$("na_type")&&$("na_type").value;
  var seq=num($("na_seq")&&$("na_seq").value);
  if(!email||!type){ banner("err","Enter an approver email and type."); return; }
  if(!seq){ var mx=0; approvalsFor(cid).forEach(function(a){ if(num(a.Approval_Sequence)>mx) mx=num(a.Approval_Sequence); }); seq=mx+1; }
  /* Status is sent explicitly: a Data API insert does not apply the form's
     "Not Sent" initial value, and Send_Contract_Approvals only picks up rows
     whose Status IS "Not Sent" - a blank one was invisible to it */
  var fieldData={ Contract1:String(cid), Approver:email, Type1:type, Approval_Sequence:seq, Approval_Email:true, Status:"Not Sent" };
  createRecord(CFG.forms.approval,fieldData).then(function(resp){
    banner("ok","Approver added.");
    if(S.demo){
      var local=JSON.parse(JSON.stringify(fieldData));
      local.ID=String((resp&&resp.data&&resp.data.ID)||("demo_"+Date.now()));
      local.Contract1={ID:String(cid),display_value:""}; local.Status="Not Sent";
      S.approvals.push(local); showApprovalsModal(cid);
    } else {
      sdkGetAll(CFG.reports.approvals).then(function(rows){ S.approvals=rows; showApprovalsModal(cid); }).catch(function(){ showApprovalsModal(cid); });
    }
  }).catch(function(e){ banner("err","Could not add the approver: "+errText(e)); });
}
/* ══ INTERNAL APPROVALS MODAL ═══════════════════════════════════════════
   Two tabs. Approvers: who is in the chain, in what order (drag to reorder),

/* Creator readFile returns a JS byte string — Blob([string]) would UTF-8 encode and
   corrupt binary files, so preserve each character's low byte (Budget Manager pattern).

   A character above 0xFF means this is NOT a byte string: something upstream
   decoded the file as text and those bytes are already gone. The old code masked
   them with &0xff, which produces a file whose header still looks right and whose
   contents are wrong from the first non-ASCII byte on - exactly how a .docx came
   out unopenable. Refuse instead, and let the caller fall back to Creator's own
   viewer, which works. */
function binaryStringToBlob(text,mime){
  var len=text.length,bytes=new Uint8Array(len);
  for(var i=0;i<len;i++){
    var code=text.charCodeAt(i);
    if(code>0xff) return null;
    bytes[i]=code;
  }
  return new Blob([bytes],{type:mime||"application/octet-stream"});
}
/* What the first bytes have to be, for the extensions worth checking. A payload
   that is not the file at all - a URL, a JSON envelope, an error page - used to
   be written into the blob verbatim and handed over as the download. */
var FILE_SIGS={pdf:["%PDF-"],
  docx:["PK\u0003\u0004"],xlsx:["PK\u0003\u0004"],pptx:["PK\u0003\u0004"],zip:["PK\u0003\u0004"],
  doc:["\u00d0\u00cf\u0011\u00e0"],xls:["\u00d0\u00cf\u0011\u00e0"],ppt:["\u00d0\u00cf\u0011\u00e0"],
  png:["\u0089PNG"],gif:["GIF8"],jpg:["\u00ff\u00d8\u00ff"],jpeg:["\u00ff\u00d8\u00ff"],webp:["RIFF"]};
function fileSigOk(head,ext){
  var sigs=FILE_SIGS[ext];
  if(!sigs) return true;   /* text or unknown type - nothing to check it against */
  for(var i=0;i<sigs.length;i++){ if(head.indexOf(sigs[i])===0) return true; }
  return false;
}
function blobHead(blob,n){
  if(!blob||typeof blob.arrayBuffer!=="function") return Promise.resolve("");
  return blob.slice(0,n).arrayBuffer().then(function(buf){
    var b=new Uint8Array(buf),out="";
    for(var i=0;i<b.length;i++) out+=String.fromCharCode(b[i]);
    return out;
  }).catch(function(){ return ""; });
}
function looksLikeBase64(text){
  var t=String(text||"").replace(/\s+/g,"");
  if(t.length<80||t.length%4!==0||!/^[A-Za-z0-9+/]+={0,2}$/.test(t)) return false;
  try{
    var head=atob(t.slice(0,96));
    return head.indexOf("%PDF-")===0||head.indexOf("PK\x03\x04")===0||head.indexOf("\x89PNG")===0||head.indexOf("GIF8")===0||head.indexOf("RIFF")===0;
  }catch(e){ return false; }
}
/* Always resolves to a Blob or rejects - never returns a half-right one. The
   shapes below are the ones Budget Manager learned readFile can answer with;
   this copy was missing the last three, and a typed array or a URL fell through
   to the key probe and came back as "no content" or, worse, as the URL text
   written into the file. */
function fileResponseToBlob(resp,mime){
  function convert(value,depth){
    if(depth>5||value==null) return null;
    if(typeof Blob!=="undefined"&&value instanceof Blob) return value.type?value:value.slice(0,value.size,mime);
    if(typeof ArrayBuffer!=="undefined"&&value instanceof ArrayBuffer) return new Blob([value],{type:mime});
    if(typeof ArrayBuffer!=="undefined"&&ArrayBuffer.isView&&ArrayBuffer.isView(value))
      return new Blob([value.buffer.slice(value.byteOffset,value.byteOffset+value.byteLength)],{type:mime});
    if(value&&typeof value.blob==="function")
      return Promise.resolve(value.blob()).then(function(b){ return b.type?b:b.slice(0,b.size,mime); });
    if(typeof value==="string"){
      /* readFile can answer with a link to the file rather than the file itself */
      if(/^(blob:|https?:\/\/)/i.test(value))
        return fetch(value,{credentials:"include"}).then(function(r){
          if(!r.ok) throw {message:"File request failed ("+r.status+")."};
          return r.blob();
        });
      /* [\s\S] rather than . so a payload containing newlines still matches */
      var dm=value.match(/^data:([^;,]+)?(;base64)?,([\s\S]*)$/);
      if(dm) return dm[2]?base64ToBlob(dm[3],dm[1]||mime):new Blob([decodeURIComponent(dm[3])],{type:dm[1]||mime});
      if(looksLikeBase64(value)) return base64ToBlob(value.replace(/\s+/g,""),mime);
      return binaryStringToBlob(value,mime);
    }
    if(typeof value==="object"){
      var keys=["filecontent","file_content","content","body","value","response","responseText","payload","data","result"];
      for(var i=0;i<keys.length;i++){
        if(Object.prototype.hasOwnProperty.call(value,keys[i])){
          var found=convert(value[keys[i]],depth+1);
          if(found) return found;
        }
      }
    }
    return null;
  }
  return Promise.resolve(convert(resp,0)).then(function(blob){
    if(!blob||!blob.size) throw {message:"Creator did not return readable file content."};
    return blob.type?blob:blob.slice(0,blob.size,mime);
  });
}
var PREV_URL="", PREV_TOKEN=0, PREV_MSG=null;
function closePreview(){
  var el=$("prevpane"); if(el) el.remove();
  if(PREV_URL){ try{ URL.revokeObjectURL(PREV_URL); }catch(e){} PREV_URL=""; }

/* ---- PDF preview: exact Budget Manager pipeline ----
   Creator's download-file URL cannot be iframed from a widget (blank/blocked frame),
   so PDF bytes are fetched as base64 (custom API first, widget readFile fallback)
   and rendered by the isolated PDF.js viewer packaged with this widget. */
/* invokeCustomApi wraps the function's return in {code, details:{output}}. This
   unwrapper knew about result/data/response but not details or output, so it
   handed the raw envelope back, the ok check failed, and every attachment read
   fell through to readFile - which is the call that needs the user to hold API
   access and that mangles binary content. unwrapApi, used by every other custom
   API call in this widget, has always unwrapped details.output; this one did not. */
function parsePreviewResponse(resp){
  var value=resp;
  for(var depth=0;depth<8;depth++){
    if(value==null) break;
    if(typeof value==="string"){
      var text=value.trim(); if(!text) break;
      try{ value=JSON.parse(text); continue; }catch(e){ break; }
    }
    if(typeof value==="object"){
      if(value.base64||value.ok!=null||value.message) return value;
      var keys=["details","output","result","data","response"],moved=false;
      for(var i=0;i<keys.length;i++){
        if(Object.prototype.hasOwnProperty.call(value,keys[i])){ value=value[keys[i]]; moved=true; break; }
      }
      if(moved) continue;
    }
    break;
  }
  return value&&typeof value==="object"?value:null;
}
function invokeContractAttachmentApi(key,args,attempt){
  if(key==='createAttachment'||key==='deleteAttachment')return contractParentWritePreflight(args&&args.contractId,false).then(function(){return invokeContractAttachmentRequest(key,args,attempt);});
  return invokeContractAttachmentRequest(key,args,attempt);
}
function invokeContractAttachmentRequest(key,args,attempt){
  return sdkInvoke({api_name:CFG.customApis[key]||key,http_method:'POST',content_type:'application/json',payload:args||{}},attempt).then(function(response){if(attempt)attempt.response=response;var body=parsePreviewResponse(response);if(!body||Array.isArray(body)||responseBad(body)||body.ok===false||String(body.ok).toLowerCase()==='false')throw contractMutationError(response,body&&typeof body.message==='string'&&body.message.trim()?contractAuditText(body.message):'Creator did not confirm this attachment operation.');return body;});
}
function normalizeBase64(value){
  var text=String(value||"").trim();
  var dm=text.match(/^data:[^;,]*(;base64)?,([\s\S]*)$/i);
  if(dm) text=dm[2];
  text=text.replace(/\s+/g,"").replace(/-/g,"+").replace(/_/g,"/");
  while(text.length%4) text+="=";
  if(!text) throw {message:"Creator returned an empty attachment payload."};
  return text;
}
function normalizePdfBase64(value){
  var text=normalizeBase64(value);
  var head=atob(text.slice(0,Math.min(text.length,120)));
  if(head.indexOf("%PDF-")!==0) throw {message:"Creator did not return PDF bytes."};
  return text;
}
function blobToBase64(blob){
  return blob.arrayBuffer().then(function(buf){
    var bytes=new Uint8Array(buf), out="", CH=8192;
    for(var i=0;i<bytes.length;i+=CH){
      out+=String.fromCharCode.apply(null,bytes.subarray(i,Math.min(i+CH,bytes.length)));
    }
    return btoa(out);
  });
}
/* ---- where attachment bytes come from ----------------------------------
   ZOHO.CREATOR.API.readFile runs AS THE LOGGED-IN USER, so it needs that user to
   hold API access in Creator. Most do not, and they get Creator's "you do not
   have permission to use the APIs" popup instead of their file.

   The Custom API is a standalone Deluge function, so it runs in the publishing
   admin's scope and answers for everyone. It returns an exact base64 copy of the
   stored file (zoho.encryption.base64Encode on the file field) - the bytes, not a
   rendering - so it serves any file type, not just the PDFs it was first added
   for. It is now the primary source for every attachment read, with readFile kept
   only as the fallback for the admins who do have API access.                  */
function getVersionApiBase64(v){
  var cid=lookupId(v.Contract1);
  return invokeContractAttachmentApi("attachmentPreview",{contractId:String(cid),attachmentId:String(v.ID)})
    .then(function(payload){
      /* the bytes are the contract - ok can come back as the string "true" */
      if(payload&&payload.base64) return normalizeBase64(payload.base64);
      throw {message:(payload&&payload.message)||"Attachment API returned no file content."};
    });
}
/* Blob for any attachment: admin-scope API, then readFile, and it is the caller's
   job to decide what to do when both are refused. */
function getVersionBlob(v,mime){
  return getVersionApiBase64(v)
    .then(function(b64){ return base64ToBlob(b64,mime); })
    .catch(function(apiErr){
      diag("Attachment custom API unavailable, falling back to readFile",apiErr);
      return sdkReadVersionFile(v.ID)
        .then(function(resp){ return fileResponseToBlob(resp,mime); })
        .catch(function(readErr){
          /* both sources refused - say which, on screen and in the audit log,
             instead of reporting only the second failure */
          var why="API: "+errText(apiErr)+" \u00b7 readFile: "+errText(readErr);
          auditLog("error","Attachment bytes unavailable from both sources",
            {versionId:String(v.ID),api:errText(apiErr),readFile:errText(readErr)});
          throw {message:why};
        });
    });
}
function getVersionPdfBase64(v){
  var cid=lookupId(v.Contract1);
  return invokeContractAttachmentApi("attachmentPreview",{contractId:String(cid),attachmentId:String(v.ID)})
    .then(function(payload){
      if(!payload||!payload.base64) throw {message:(payload&&payload.message)||"Preview API unavailable."};
      return normalizePdfBase64(payload.base64);
    })
    .catch(function(apiErr){
      diag("Preview custom API unavailable, falling back to readFile",apiErr);
      return sdkReadVersionFile(v.ID)
        .then(function(resp){ return fileResponseToBlob(resp,"application/pdf"); })
        .then(function(blob){ return blobToBase64(blob).then(normalizePdfBase64); });
    });
}
function renderPdfIsolated(base64,name,vid){
  var body=$("prevBody"); if(!body) return;
  var token=PREV_TOKEN;
  body.innerHTML='<iframe id="cmPdfFrame" class="prev-frame" title="'+attr(name)+'" src="pdf-preview.html" allow="fullscreen"></iframe>';
  var frame=$("cmPdfFrame");
  var timeout=setTimeout(function(){
    if(token!==PREV_TOKEN) return;
    var b=$("prevBody");
    if(b) b.innerHTML='<div class="prev-state"><h3>Preview timed out</h3><p>The PDF viewer did not initialize.</p><button class="btn primary" onclick="openVersionFile(\''+vid+'\')">Open the file ↗</button></div>';
  },20000);
  var sent=false;
  PREV_MSG=function(ev){
    if(token!==PREV_TOKEN||!frame||ev.source!==frame.contentWindow) return;
    var data=ev.data||{};
    if(data.type==="budget-pdf-preview-ready"&&!sent){
      sent=true;
      try{ frame.contentWindow.postMessage({type:"budget-pdf-preview-load",fileName:name,base64:base64},"*"); }
      catch(e){ clearTimeout(timeout); }
    } else if(data.type==="budget-pdf-preview-loaded"){
      clearTimeout(timeout);
    } else if(data.type==="budget-pdf-preview-error"){
      clearTimeout(timeout);
      var b=$("prevBody");
      if(b) b.innerHTML='<div class="prev-state"><h3>Could not preview PDF</h3><p>'+esc(String(data.message||"Unknown error"))+'</p><button class="btn primary" onclick="openVersionFile(\''+vid+'\')">Open the file ↗</button></div>';
    }
  };
  window.addEventListener("message",PREV_MSG);
}
function downloadVersion(vid){
  var v=findVersion(vid); if(!v) return;
  var name=fileDisplayName(v), ext=attachmentExt(name);
  getVersionBlob(v,attachmentMime(name))
    .then(function(blob){
      return blobHead(blob,8).then(function(head){
        /* the file is only handed over once its first bytes say it really is one -
           sending the user to Creator's viewer beats handing them something that
           will not open */
        if(head&&!fileSigOk(head,ext))
          throw {message:"Creator returned "+blob.size+" bytes that are not a ."+ext+" file"};
        var url=URL.createObjectURL(blob);
        var a=document.createElement("a");
        a.href=url; a.download=name; a.style.display="none";
        document.body.appendChild(a); a.click();
        setTimeout(function(){ try{ a.remove(); URL.revokeObjectURL(url); }catch(e){} },800);
      });
    })
    .catch(function(e){
      diag("Download fell back to Creator's viewer",e);
      auditLog("warn","Attachment download fell back to Creator's viewer",{versionId:String(vid),file:name,reason:errText(e)});
      banner("ok","Opening "+name+" in Creator\u2019s viewer \u2014 it could not be downloaded from here.",{info:true});
      openVersionFile(vid);
    });
}

function previewVersion(vid){

/* ---- Word preview -------------------------------------------------------
   mammoth turns the .docx into HTML in the browser, so a reviewer can read the
   document without leaving the widget. It is a READING view, not a faithful one:
   mammoth reproduces text, headings, lists, tables and images, but not page
   layout, pagination, headers/footers or tracked changes. The "Open" button in
   the header stays the way to see the document exactly as Word renders it.

   The bundle is 640KB, so it is fetched the first time a .docx is opened and
   never on load. The result is dropped into a sandboxed iframe with no script
   permission - the HTML comes from a document someone uploaded. */

var MAMMOTH_P=null;
function loadMammoth(){
  if(window.mammoth) return Promise.resolve(window.mammoth);
  if(MAMMOTH_P) return MAMMOTH_P;
  MAMMOTH_P=new Promise(function(res,rej){
    var sc=document.createElement("script");

function previewDocx(vid,name){
  var v=findVersion(vid); if(!v) return;
  var token=PREV_TOKEN;
  var fail=function(e){
    if(token!==PREV_TOKEN) return;
    var b=$("prevBody");

      +'<button class="btn primary" onclick="openVersionFile(\''+vid+'\')">Open the file \u2197</button></div>';
  };
  getVersionBlob(v,attachmentMime(name))
    .then(function(blob){ return blob.arrayBuffer(); })
    .then(function(buf){
      /* a .docx is a zip; anything else here means the bytes are not the document */
      var head=new Uint8Array(buf.slice(0,4));
      if(!(head[0]===0x50&&head[1]===0x4b)) throw {message:"Creator did not return a .docx file."};
      return loadMammoth().then(function(mm){ return mm.convertToHtml({arrayBuffer:buf}); });
    })
    .then(function(out){
      if(token!==PREV_TOKEN) return;
      var body=$("prevBody"); if(!body) return;

      f.className="prev-frame"; f.title=name; f.setAttribute("sandbox","");
      f.srcdoc=docxFrameHTML(html);
      body.innerHTML="";
      body.appendChild(f);
      var msgs=(out&&out.messages)||[];
      if(msgs.length) diag("Word preview rendered with notes",{file:name,notes:msgs.length});
    })
    .catch(fail);
}

function attachmentCreatorIdentities(author){
  var values=[];

    values=[author.user_name,author.username,author.email].filter(function(value){return typeof value==="string"&&value.trim();});
    if(!values.length)values=[author.zc_display_value,author.display_value,author.display_name,author.name,author.Name];

function attachmentRosterFullName(user){
  var names=[user.fullName,user.Full_Name];
  for(var i=0;i<names.length;i++){
    var name=names[i];
    if(typeof name==="string"&&name.trim()) return name.trim();
    if(!name||typeof name!=="object"||Array.isArray(name)) continue;
    var first=typeof name.first_name==="string"?name.first_name.trim():"";
    var last=typeof name.last_name==="string"?name.last_name.trim():"";

function attachmentRosterAuthor(author){

    if(!user||typeof user!=="object"||Array.isArray(user)) return false;
    return [user.userName,user.label,user.email,user.approverEmail].some(function(value){
      return typeof value==="string"&&value.trim()&&identities.indexOf(value.trim().toLowerCase())>=0;
    });

   Dev_Mgr, and Contract Approval approver. No new Creator field or read is needed. */
function reviewMe(){
  var raw=String(S.currentUser||ncLoginUser()||"").trim().toLowerCase();
  var bare=raw.split("@")[0].split("_")[0];
  return {raw:raw,bare:bare,id:String(S.myAccessId||""),code:bare.slice(0,2).toUpperCase()};
}
function reviewValueIsMine(v){
  var me=reviewMe(); if(!me.raw&&!me.id) return false;
  return asList(v).some(function(x){
    var vals=(x&&typeof x==="object")?[x.ID,x.id,x.email,x.User,x.display_value]:[x];
    return vals.some(function(value){
      var s=String(value==null?"":value).trim(); if(!s) return false;
      if(me.id&&s===me.id) return true;
      var low=s.toLowerCase(), bare=low.split("@")[0].split("_")[0];
      if(low===me.raw||bare===me.bare) return true;
      return /^[a-z]{2}$/i.test(s)&&s.toUpperCase()===me.code;
    });
  });
}
function reviewContractIsMine(c){
  if(!c) return false;
  if(c.Current_Approver&&reviewValueIsMine(c.Current_Approver)) return true;
  var owners=asList(c.Owner); if(owners.length) return reviewValueIsMine(owners);
  return reviewValueIsMine(c.WBW_Point_Person);
}
function reviewActionIsMine(a){
  if(!a) return false;
  if(String(a.Dev_Mgr||"").trim()) return reviewValueIsMine(a.Dev_Mgr);
  return reviewContractIsMine(findContract(lookupId(a.Contract1)));
}
function reviewLOIIsMine(r){
  if(!r) return false;
  if(String(r.Acquisition_Email||"").trim()) return reviewValueIsMine(r.Acquisition_Email);
  return reviewValueIsMine(r.Owner);
}
function filteredLOIs(){
  var q=String(S.loiSearch||"").toLowerCase();
  return (contractLOIReady()?S.loiReviews:[]).filter(function(r){
    if(String(r.LOI_Legal_Status||"")!=="Pending Approval") return false;
    if(S.loiMine&&!reviewLOIIsMine(r)) return false;
    if(!q) return true;
    var hay=[r.Name,r.Seller,displayValue(r.Buying_Entity),r.Territory,r.Property_County,r.Property_City,r.CAD_ID].join(" ").toLowerCase();
    return hay.indexOf(q)>=0;

}
/* Everything sitting with Legal: newly created contracts, and individual
   actions proposed against a live contract. Contract_Actions has always had a
   Proposed status and proposeAction() has always written it - nothing ever moved
   one back out, which is what these accept/decline handlers finally do. */
function proposedContracts(){
  return S.contracts.filter(function(c){ return String(c.Status||"")==="Proposed"&&(!S.loiMine||reviewContractIsMine(c)); })
    .sort(function(a,b){ return String(a.Contract_Name||"").localeCompare(String(b.Contract_Name||"")); });
}
function proposedActions(){
  return S.actions.filter(function(a){
    if(String(a.Status||"")!=="Proposed"||truthy(a.Complete)) return false;
    var cid=lookupId(a.Contract1); if(!cid) return false;
    /* a dead contract takes its proposals with it - they stay on the record, they
       just stop asking for a decision that the contract already answered */
    var c=findContract(cid);
    if(c&&(String(c.Status||"")==="Approval Rejected"||truthy(c.Archive))) return false;
    if(S.loiMine&&!reviewActionIsMine(a)) return false;
    return true;
  }).sort(function(a,b){ return num(a.Sort_Order)-num(b.Sort_Order); });
}
/* An action proposed with a still-Proposed contract is decided with that contract,
   so it nests under it in the queue and is not its own item. Only actions proposed
   onto a contract that already exists stand alone. */
function actionStandsAlone(a){
  var c=findContract(lookupId(a.Contract1));
  return !(c&&String(c.Status||"")==="Proposed");
}
function looseProposedActions(){ return proposedActions().filter(actionStandsAlone); }
/* The tab badge remains the whole legal queue; filter pills only narrow the page.
   A proposed contract and the actions that came with it count as one item. */
function reviewCount(){
  var lois=(contractLOIReady()?S.loiReviews:[]).filter(function(r){ return String(r.LOI_Legal_Status||"")==="Pending Approval"; }).length;
  var contracts=S.contracts.filter(function(c){ return String(c.Status||"")==="Proposed"; }).length;
  var actions=S.actions.filter(function(a){
    if(String(a.Status||"")!=="Proposed"||truthy(a.Complete)||!lookupId(a.Contract1)) return false;
    var c=findContract(lookupId(a.Contract1));
    if(c&&(String(c.Status||"")==="Approval Rejected"||truthy(c.Archive))) return false;
    return actionStandsAlone(a);
  }).length;
  return lois+contracts+actions;
}
function pcDecide(cid,ok){
  var c=findContract(cid); if(!c||S.busy) return;

  if(ok)return pcRun(cid,true);
  var kids=actionsFor(cid).filter(function(a){ return String(a.Status||"")==="Proposed"; });
  var withN=kids.length?(" and its "+kids.length+" proposed action"+(kids.length===1?"":"s")):"";
  confirmDialog({
    kicker:ok?"Accept contract":"Decline contract",
    title:c.Contract_Name||("Contract "+cid),
    lead:ok?("The contract"+withN+" join the pipeline together.")
           :("The contract is marked Approval Rejected"+(kids.length?", and its "+kids.length+" proposed action"+(kids.length===1?"":"s")+" leave the queue with it":"")+"."),
    items:kids.length?kids.map(function(a){ return String(a.Contract_Action||"Untitled action").replace(/\n/g," "); }):undefined,
    okLabel:ok?"Accept":"Decline", danger:!ok,

function contractReviewRead(read){var timer;return Promise.race([Promise.resolve().then(read),new Promise(function(resolve,reject){timer=setTimeout(function(){reject(new Error('Review details could not be checked. Refresh before trying again.'));},30000);})]).finally(function(){clearTimeout(timer);});}
function pcRun(cid,ok){
  var source=findContract(cid);if(!source||S.busy||String(source.Status||'')!=='Proposed'||!needs(canApprove(),'approve proposed contracts'))return Promise.resolve(false);
  var scope=contractMutationScope(),generation=S.contractDataGeneration;
  var next=ok?"New":"Approval Rejected";
  function apply(){
    var c=findContract(cid); if(c) c.Status=next;
    if(ok) actionsFor(cid).forEach(function(a){ if(String(a.Status||"")==="Proposed") a.Status="New"; });
    banner("ok",ok?"Contract accepted.":"Contract declined.");
    renderAll();
  }
  if(S.demo){ apply(); return; }
  S.busy=true;S.reviewDecision={kind:'pc',id:String(cid),ok:ok};renderAll();contractControls();setStatus("warn","Saving\u2026");
  return contractReviewRead(function(){return contractStatusPreflight(String(cid),{Status:next},true);}).then(function(){
    return ok?contractReviewRead(function(){return sdkGetAll(CFG.reports.actions,'(Contract1 == '+cid+')',contractReadOptions(generation,scope));}):[];
  }).then(function(rows){
    if(scope!==contractMutationScope()||generation!==S.contractDataGeneration||!canApprove())throw new Error('Approval Queue access changed. Refresh before accepting.');
    var p=Promise.resolve();rows.filter(function(a){return lookupId(a.Contract1)===String(cid)&&String(a.Status||'')==='Proposed';}).forEach(function(a){p=p.then(function(){if(!canApprove())throw new Error('Approval Queue access is required.');return updateRecord(String(a.ID),{Status:'New'},CFG.reports.actions,true).then(function(response){var local=findAction(a.ID);if(local)Object.assign(local,response.verifiedRow);});});});
    return p.then(function(){return updateRecord(String(cid),{Status:next},CFG.reports.contracts,true);});
  }).then(function(){setStatus('ok','Connected');apply();return true;})
   .catch(function(e){setStatus('err','Save failed');banner('err','Save needs review: '+errText(e));return false;})
   .finally(function(){contractReleaseBusy();S.reviewDecision=null;renderAll();contractControls();});
}
function paDecide(aid,ok){

function paRun(aid,ok){

  var scope=contractMutationScope(),generation=S.contractDataGeneration;

/* Age of a record, when the report happens to expose a timestamp. Neither
   All_Contracts1 nor All_Contract_Actions lists Added_Time in its quick view today,
   so this is usually null - the column stays empty rather than showing a wrong
   number, and lights up on its own if the column is ever added. */
function rqAge(rec){
  var raw=rec&&(rec.Added_Time||rec.Modified_Time);
  if(!raw) return null;
  var t=new Date(String(raw).replace(/-/g,"/"));
  if(isNaN(t.getTime())) return null;
  return Math.max(0,Math.floor((Date.now()-t.getTime())/86400000));
}
/* Who proposed it and when. Reads the Creator system fields Added_User and
   Added_Time, which only arrive when the report's quick view shows them
   (All_Contracts1, All_Contract_Actions) - blank until it does, never guessed. */
function rqWhen(raw){
  if(!raw) return "";
  var t=new Date(String(raw).replace(/-/g,"/"));
  if(isNaN(t.getTime())) return String(raw);
  var h=t.getHours(), m=t.getMinutes(), ap=h>=12?"PM":"AM"; h=h%12||12;
  return (t.getMonth()+1)+"/"+t.getDate()+"/"+t.getFullYear()+" "+h+":"+(m<10?"0":"")+m+" "+ap;
}
function rqSubmitted(rec){
  var who=String((rec&&rec.Added_User)||"").trim(), when=rqWhen(rec&&rec.Added_Time);

/* ------------------------------------------------------------------
   PROOF OF CONCEPT - "what am I waiting on".
   Review answers "what needs my decision". It never answered the question Legal
   asks between decisions: who is sitting on my contracts and for how long. Every
   signal is already on Contract_Approvals - approver, sequence step, and the
   reminder cycle - so this needs no new field and no new call. Read-only by
   design: acting on an approval still happens on the contract.
   ------------------------------------------------------------------ */
function daysSinceDate(v){
  if(!v) return null;
  var t=new Date(String(v).replace(/-/g,"/"));
  if(isNaN(t.getTime())) return null;
  return Math.max(0,Math.floor((Date.now()-t.getTime())/86400000));
}
function waitingApprovals(){
  return S.approvals.filter(function(a){
    return String(a.Status||"")==="Awaiting Approval" && lookupId(a.Contract1)
      &&(!S.loiMine||reviewValueIsMine(a.Approver));
  }).map(function(a){
    var c=findContract(lookupId(a.Contract1));
    var d=daysSinceDate(a.Last_Reminder_Date);
    return {a:a,c:c,days:d};
  }).filter(function(r){ return r.c; })
    .sort(function(x,y){ return (y.days==null?-1:y.days)-(x.days==null?-1:x.days); });
}
function waitingHTML(){

function runLOIReview(decision,r,note,trigger){
  if(S.busy) return;
  if(!contractLOIReady()||findLOI(r&&r.ID)!==r){banner('err','Refresh the LOI status before deciding.');return;}
  if(decision==="REJECT"){
    if(contractApprovalProgress)return;
    var p={kind:"loireject",pfId:String(r.ID),name:String(r.Name||("Pro Forma "+r.ID)),note:note,token:String(S.loiToken||r.LOI_Approval_Token||""),address:String(r.Acquisition_Email||"").trim(),trigger:trigger,ids:[],started:Date.now(),step:0,target:0,terminal:"",last:null,emailOutcome:"unknown",repairUsed:false,writeSettled:false,timer:null,deadline:null,visual:null,pendingResult:null};

    $("contractApprovalProgressSteps").textContent="";
    $("contractApprovalProgress").hidden=false;contractProgressRender(p);$("contractApprovalProgress").querySelector(".approval-progress-dialog").focus();
    p.deadline=setTimeout(function(){contractProgressDeadline(p);},20000);
    contractProgressCall(p,"Reject").catch(function(err){auditLog("error","Legal rejection write returned an error; checking persisted state",{proformaId:p.pfId,error:errText(err)});}).then(function(){if(contractApprovalProgress!==p||p.terminal)return;p.writeSettled=true;contractProgressSchedule(p);});
    return;
  }
  S.busy=true;setStatus("warn",decision==="APPROVE"?"Creating Contract…":"Rejecting LOI…");
  sdkInvoke({api_name:CFG.customApis.reviewLOI,http_method:"POST",content_type:"application/json",payload:{proformaId:String(r.ID),tokenId:String(S.loiToken||r.LOI_Approval_Token||""),decision:decision,legalNote:note}})
    .then(function(resp){
      var out=unwrapApi(resp); if(!out||out.success!==true) throw {message:(out&&(out.message||out.error))||"LOI review failed",raw:resp};
      return refreshAfterLOIReview(out,decision);
    }).catch(function(e){banner("err","LOI review failed: "+errText(e));setStatus("err","Review failed");auditLog("error","LOI review failed",{proformaId:String(r.ID),decision:decision,error:e});})
    .finally(function(){contractReleaseBusy();if($("statustext").textContent!=="Review failed")setStatus("ok",S.demo?"Demo data":"Connected");});
}

function prefersReducedMotion(){

function completeDrillAction(aid){
  var a=findAction(aid); if(!a||S.busy) return;
  S.exiting=S.exiting||{};
  if(S.exiting[aid]) return;                       /* a write is already deferred behind the animation */
  var data=collectDrillData(aid);
  if(!data.Dev_Mgr){ banner("err","Choose an assignee before completing this action."); return; }
  data.Complete=true; data.Current_Action=false; data.Status="Complete";
  if(!data.Complete_Date) data.Complete_Date=toZoho(todayInput());
  var updates=[[aid,data]];
  advanceCurrent(aid,updates);
  delete S.dexp[aid];
  var cNotes=String(data.Dev_Notes||""), cCid=lookupId(a.Contract1);
  var cNoteEdit=cNotes.trim()&&cNotes!==String(a.Dev_Notes||"");
  function write(){
    banner("ok","Action completed.");
    runUpdates(updates).then(function(){ if(cNoteEdit) claimIfNoteLanded(aid,cCid,cNotes); });
  }
  var row=document.querySelector('.dact-wrap[data-drow="'+aid+'"]');
  var chk=row?row.querySelector(".d-badge"):null;
  if(chk){ chk.classList.add("done","popped"); }
  /* Show Completed on => the row stays put, so an exit would animate it away
     and have it reappear in the same slot on the next paint. */
  if(!row||S.drillDone||prefersReducedMotion()){
    /* the row survives, so the flash has to be applied AFTER the re-render -
       queueFlip is the only hook that outlives innerHTML replacement */
    if(S.drillDone) queueFlip(aid,"settled");
    write();
    return;
  }
  S.exiting[aid]=1;
  queueFlip(null);                                  /* neighbours slide up rather than jump */
  setTimeout(function(){
    row.classList.add("leaving");
    setTimeout(function(){ delete S.exiting[aid]; write(); },300);
  },180);                                           /* let the tick land before the row goes */
}
var drillDragId=null;
function wireDrillDrag(){
  document.querySelectorAll("[data-ddrag]").forEach(function(h){
    h.addEventListener("dragstart",function(e){
      drillDragId=h.getAttribute("data-ddrag");
      var w=h.closest(".dact-wrap"); if(w) w.style.opacity=".4";
      e.dataTransfer.effectAllowed="move";
      try{ e.dataTransfer.setData("text/plain",drillDragId); }catch(err){}
    });
    h.addEventListener("dragend",function(){
      drillDragId=null;
      document.querySelectorAll(".dact-wrap").forEach(function(w){ w.style.opacity=""; w.classList.remove("dragover","dragover-after"); });
      document.querySelectorAll(".dadd").forEach(function(z){ z.classList.remove("dropend"); });
    });
  });
  function lowerHalf(el,e){
    var r=el.getBoundingClientRect();
    return (e.clientY-r.top)>r.height/2;
  }
  document.querySelectorAll(".dact-wrap[data-drow]").forEach(function(w){
    w.addEventListener("dragover",function(e){
      if(!drillDragId||w.getAttribute("data-drow")===drillDragId) return;
      var a=findAction(drillDragId), b=findAction(w.getAttribute("data-drow"));
      if(!a||!b||lookupId(a.Contract1)!==lookupId(b.Contract1)) return;
      e.preventDefault(); e.dataTransfer.dropEffect="move";
      var after=lowerHalf(w,e);
      w.classList.toggle("dragover",!after);
      w.classList.toggle("dragover-after",after);
    });
    w.addEventListener("dragleave",function(){ w.classList.remove("dragover","dragover-after"); });
    w.addEventListener("drop",function(e){
      e.preventDefault();
      var after=lowerHalf(w,e);
      w.classList.remove("dragover","dragover-after");
      var t=w.getAttribute("data-drow");
      if(!drillDragId||t===drillDragId) return;
      dropReorder(drillDragId,t,after);
      drillDragId=null;
    });
  });
  /* the add strip doubles as an explicit "move to the end" target */
  document.querySelectorAll(".dadd").forEach(function(z){
    z.addEventListener("dragover",function(e){
      if(!drillDragId) return;
      e.preventDefault(); e.dataTransfer.dropEffect="move"; z.classList.add("dropend");
    });
    z.addEventListener("dragleave",function(){ z.classList.remove("dropend"); });
    z.addEventListener("drop",function(e){
      e.preventDefault(); z.classList.remove("dropend");
      if(!drillDragId) return;
      var a=findAction(drillDragId);
      if(a){
        var order=actionsFor(lookupId(a.Contract1)).map(function(r){ return String(r.ID); });
        var from=order.indexOf(String(drillDragId));
        if(from>=0){ order.splice(from,1); order.push(String(drillDragId)); applyOrder(order,String(drillDragId)); }
      }
      drillDragId=null;
    });
  });
}

function mdShort(input){ if(!input) return ""; return String(parseInt(input.slice(5,7),10))+"/"+input.slice(8,10); }
/* short aging label under the due date */
function agingText(a){
  if(truthy(a.Complete)){
    var cd=toInput(a.Complete_Date);
    return cd?["\u2713 "+mdShort(cd),"#047857"]:["\u2713 no date","#b45309"];
  }
  var d=toInput(a.Due_Date);
  if(!d) return ["no due",truthy(a.Current_Action)?"#c2410c":"#8ea0bd"];
  var diff=daysBetween(todayInput(),d);
  if(diff==null) return ["",""];
  if(diff<0) return [(-diff)+"d late","#dc2626"];
  if(diff===0) return ["today","#b45309"];
  if(diff<=5) return ["in "+diff+"d","#b45309"];
  return [mdShort(d),"#8ea0bd"];
}
/* read-only sentence in the panel: the detail the 116px lane cannot hold */
function agingStrip(a){
  var parts=[], sd=toInput(a.Start_Date), dd=toInput(a.Due_Date), cd=toInput(a.Complete_Date);
  if(truthy(a.Complete)){
    if(sd) parts.push("Started "+mdShort(sd));
    if(cd&&sd){ var n=daysBetween(sd,cd); if(n!=null) parts.push("closed in "+n+"d"); }
    if(!cd) parts.push('<span class="warn">Completed: date not recorded</span>');
    return parts.length?parts.join(" \u00b7 "):"Completed";
  }
  if(dd) parts.push("Due "+prettyDate(a.Due_Date));
  if(sd){
    parts.push("Started "+prettyDate(a.Start_Date));
    var f=daysBetween(sd,todayInput());
    if(f!=null&&f>=0) parts.push(f+"d in flight");
  }

function drillAdd(cid){
  var el=$("dadd_"+cid); if(!el||S.busy) return;
  if(!needsContractEdit(cid))return;
  var title=String(el.value||"").trim();
  if(!title){ el.focus(); return; }
  var maxSort=0;
  actionsFor(cid).forEach(function(r){
    var k=sortKey(r);
    if(k!==Number.MAX_SAFE_INTEGER && k>maxSort) maxSort=k;
  });
  var fieldData={ Contract1:String(cid), Contract_Action:title, Status:"Proposed", Complete:false, Sort_Order:maxSort+1 };
  S.busy=true; setStatus("warn","Saving\u2026");
  el.value="";
  createRecord(CFG.forms.action,fieldData).then(function(resp){
    contractReleaseBusy(); setStatus("ok",S.demo?"Demo data":"Connected"); banner("ok","Action added.");
    var newId=(resp&&resp.data&&(resp.data.ID||resp.data.id))||"";
    if(S.demo){
      var local=JSON.parse(JSON.stringify(fieldData));
      local.ID=String(newId||("demo_"+Date.now()));
      local.Contract1=[{ID:String(cid),display_value:""}];
      local.Current_Action="false";
      S.actions.push(local);
      queueFlip(local.ID,"justadded");
      renderAll();
      var again=$("dadd_"+cid); if(again) again.focus();
    } else {
      sdkGetAll(CFG.reports.actions).then(function(rows){
        S.actions=rows;
        if(newId) queueFlip(String(newId),"justadded");
        renderAll();
        var again=$("dadd_"+cid); if(again) again.focus();
      }).catch(function(){ renderAll(); });
    }
  }).catch(function(e){
    contractReleaseBusy(); setStatus("err","Save failed");

function completeContractCascade(cid,c,openActs){
  if(S.busy) return;
  if(!mayEdit(cid)||String(c.Status||'')==='Proposed')return;
  var updates=openActs.map(function(a){
    return [String(a.ID),{Complete:true,Current_Action:false,Status:"Complete",Complete_Date:toZoho(todayInput())}];
  });
  S.busy=true; setStatus("warn","Saving…");
  var p=Promise.resolve();
  updates.forEach(function(u){ p=p.then(function(){ return updateRecord(u[0],u[1],CFG.reports.actions).then(function(){ applyLocal(u[0],u[1]); }); }); });
  var cPayload={Status:"Complete"};
  if(!toInput(c.Completion_Date)) cPayload.Completion_Date=toZoho(todayInput());
  p.then(function(){ return updateRecord(String(cid),cPayload,CFG.reports.contracts); })
   .then(function(){ c.Status="Complete"; contractReleaseBusy(); setStatus("ok",S.demo?"Demo data":"Connected"); banner("ok","Contract completed — "+openActs.length+" open action"+(openActs.length===1?"":"s")+" closed out."); renderAll(); })

}

  function visit(value){
    if(typeof value==='string'){try{visit(JSON.parse(value));}catch(ignore){}return;}
    if(!value||typeof value!=='object'||seen.has(value))return;seen.add(value);
    if(Array.isArray(value)){value.forEach(visit);return;}
    if(value.task==='alert'&&Array.isArray(value.alert_message))value.alert_message.forEach(function(text){if(typeof text==='string'&&text.trim())messages.push(text.trim());});
    ['error','raw','cause','response','responseText','message','result','details','output'].forEach(function(key){visit(value[key]);});
  }

}

/* Board drag-and-drop. The drop routes into statusCellChange - the same function
   the list's status dropdown calls - so moving a card onto Complete runs the whole
   completion path (lot-contract guard, the Complete_Lot_Contract write-back, the
   open-actions cascade) rather than quietly setting a field. */
function bDragClear(){
  S.bDrag=null;
  Array.prototype.forEach.call(document.querySelectorAll(".bcard.dragging"),function(n){ n.classList.remove("dragging"); });
  Array.prototype.forEach.call(document.querySelectorAll(".bcol.over"),function(n){ n.classList.remove("over"); });
}
function bDragStart(e,cid){
  S.bDrag=String(cid);
  try{ e.dataTransfer.setData("text/plain",String(cid)); e.dataTransfer.effectAllowed="move"; }catch(_){}
  if(e.currentTarget&&e.currentTarget.classList) e.currentTarget.classList.add("dragging");
}
function bDragEnd(){ S.bDragEndedAt=Date.now(); bDragClear(); }
function bDragOver(e){
  if(!S.bDrag) return;
  e.preventDefault();
  try{ e.dataTransfer.dropEffect="move"; }catch(_){}
  if(e.currentTarget&&e.currentTarget.classList) e.currentTarget.classList.add("over");
}
function bDragLeave(e){
  var col=e.currentTarget;
  if(col&&col.classList&&!(e.relatedTarget&&col.contains(e.relatedTarget))) col.classList.remove("over");
}
function bDrop(e){
  e.preventDefault();
  var col=e.currentTarget;
  var status=col?col.getAttribute("data-status"):"";
  var cid=S.bDrag;
  if(!cid){ try{ cid=e.dataTransfer.getData("text/plain"); }catch(_){} }
  bDragEnd();
  if(!cid||!status) return;
  var c=findContract(cid); if(!c) return;
  if(String(c.Status||"New")===status) return;
  statusCellChange(String(cid),status);
}

}

    +'<div class="ff ff-date"><span class="fl">Due Date</span><input type="date" class="input" id="f_dd_'+id+'" value="'+toInput(a.Due_Date)+'"/></div>'
    +'<div class="ff ff-date"><span class="fl">Complete Date</span><input type="date" class="input" id="f_cd_'+id+'" value="'+toInput(a.Complete_Date)+'"/></div>'
    +'<div class="ff ff-status"><span class="fl">Status</span>'+statusSelect("f_st_"+id,status)+'</div>'
    +'</div>'
    +'<div class="frow"><div class="ff ff-notes"><span class="fl">Notes</span><textarea class="input" id="f_nt_'+id+'" rows="2">'+esc(a.Dev_Notes||"")+'</textarea></div></div>'

function gSelect(field,id,val,opts,withBlank){
  return cbo({cls:"eg-in",field:field,rid:id,value:val,opts:opts,blank:withBlank});
}
function wireEditGrid(){
  var wrap=document.querySelector(".egrid-wrap"); if(!wrap) return;
  wrap.querySelectorAll("textarea.eg-in").forEach(function(t){ t.style.height="auto"; t.style.height=(t.scrollHeight)+"px"; t.addEventListener("input",function(){ t.style.height="auto"; t.style.height=(t.scrollHeight)+"px"; }); });
  wrap.querySelectorAll(".eg-in").forEach(function(el){
    var ev=(el.tagName==="SELECT"||el.classList.contains("cbo")||el.type==="date")?"change":"blur";
    el.addEventListener(ev,function(){ gSaveField(el); });
  });
  var add=$("egAdd");
  if(add) add.addEventListener("keydown",function(e){ if(e.key==="Enter"){ e.preventDefault(); gAdd(add.value); } });
  wireGridDrag(wrap);
}
function gSaveField(el){return contractFieldSave(el,true);}
function gComplete(id){ completeAction(id,true); }
function gReopen(id){ reopenAction(id); }
function setCurrent(id){
  var a=findAction(id); if(!a||S.busy) return;
  var updates=[[id,{Current_Action:true}]];
  actionsFor(lookupId(a.Contract1)).forEach(function(r){ if(String(r.ID)!==String(id)&&truthy(r.Current_Action)) updates.push([String(r.ID),{Current_Action:false}]); });
  runUpdates(updates);
}
function clearCurrent(id){ if(S.busy) return; runUpdates([[id,{Current_Action:false}]]); }
function deleteAction(id,force){
  var a=findAction(id); if(!a||S.busy) return;
  /* checked before the confirm opens, so a refusal never looks like a cancel */
  if(!needsContractEdit(lookupId((findAction(id)||{}).Contract1))) return;
  if(!force){ confirmDeleteAction(id); return; }
  if(S.demo){ S.actions=S.actions.filter(function(r){ return String(r.ID)!==String(id); }); banner("ok","Action deleted."); renderAll(); return; }
  S.busy=true; setStatus("warn","Deleting…");
  sdkDeleteById(CFG.reports.actions,id).then(function(){
    S.actions=S.actions.filter(function(r){ return String(r.ID)!==String(id); });
    contractReleaseBusy(); setStatus("ok","Connected"); banner("ok","Action deleted.");
    auditLog("success","Action deleted",{actionId:String(id),action:String(a.Contract_Action||"")});
    renderAll();
  }).catch(function(e){
    contractReleaseBusy(); setStatus("err","Delete failed"); banner("err","Delete failed: "+errText(e));
    auditLog("error","Action delete failed",{actionId:String(id),report:CFG.reports.actions,error:e});
  });
}
function gAdd(title){
  title=(title||"").trim(); if(!title||S.busy) return;
  if(!needsContractEdit(S.selId))return;
  var all=actionsFor(S.selId), maxSort=0;
  all.forEach(function(r){ if(num(r.Sort_Order)>maxSort) maxSort=num(r.Sort_Order); });
  var fieldData={ Contract1:S.selId, Contract_Action:title, Status:ncNewActionStatus(), Complete:false, Sort_Order:maxSort+1 };
  S.busy=true; setStatus("warn","Saving…");
  createRecord(CFG.forms.action,fieldData).then(function(resp){
    contractReleaseBusy(); setStatus("ok",S.demo?"Demo data":"Connected"); banner("ok","Action added.");
    if(S.demo){
      var nid=(resp&&resp.data&&resp.data.ID)||("demo_"+Date.now());
      var local=JSON.parse(JSON.stringify(fieldData)); local.ID=String(nid); local.Contract1={ID:String(S.selId),display_value:""}; local.Current_Action="false";
      S.actions.push(local); renderAll();
    } else { sdkGetAll(CFG.reports.actions).then(function(rows){ S.actions=rows; renderAll(); }); }
  }).catch(function(e){ contractReleaseBusy(); setStatus("err","Save failed"); banner("err","Add failed: "+errText(e)); });
}
function wireGridDrag(wrap){
  wrap.querySelectorAll("[data-drag]").forEach(function(h){
    h.addEventListener("dragstart",function(e){ dragId=h.getAttribute("data-drag"); var r=h.closest("tr"); if(r) r.style.opacity=".35"; e.dataTransfer.effectAllowed="move"; try{ e.dataTransfer.setData("text/plain",dragId); }catch(err){} });
    h.addEventListener("dragend",function(){ dragId=null; wrap.querySelectorAll("tr").forEach(function(r){ r.style.opacity=""; r.style.boxShadow=""; }); });
  });
  wrap.querySelectorAll("tr[data-row]").forEach(function(row){
    row.addEventListener("dragover",function(e){ if(!dragId||row.getAttribute("data-row")===dragId) return; e.preventDefault(); e.dataTransfer.dropEffect="move"; row.style.boxShadow="inset 0 3px 0 0 var(--primary-2)"; });
    row.addEventListener("dragleave",function(){ row.style.boxShadow=""; });
    row.addEventListener("drop",function(e){ e.preventDefault(); row.style.boxShadow=""; var t=row.getAttribute("data-row"); if(!dragId||t===dragId) return; dropReorder(dragId,t); dragId=null; });
  });
}

/* Contract_Pricing is one row per distinct lot size. ncSeedPricing writes it at
   create time, but terms move mid-flight, so it has to stay editable here. Base
   price is Lot_Size x Price_per_Ft and is never typed - the same rule the create
   flow used - so the two can never disagree. */
function findPricing(id){ for(var i=0;i<S.pricing.length;i++) if(String(S.pricing[i].ID)===String(id)) return S.pricing[i]; return null; }
function pricingFor(cid){
  return S.pricing.filter(function(p){ return lookupId(p.Contract1)===String(cid); })
    .sort(function(a,b){ return num(a.Lot_Size)-num(b.Lot_Size); });
}
function pricingCard(cid){
  var c=findContract(cid); if(!c) return "";
  var rows=pricingFor(cid);
  /* show for Lot contracts always, and for anything else only if it has pricing */
  if(!rows.length && !isLotContract(c)) return "";
  var may=mayEdit(cid);
  var total=0; rows.forEach(function(p){ total+=num(p.Base_Price); });
  var items=rows.map(function(p){
    return '<div class="pr-row">'
      +'<div class="pr-size">'+esc(String(num(p.Lot_Size)||"\u2014"))+'<span>ft</span></div>'
      +'<div>'+(may
        ?'<input class="pr-in" type="text" inputmode="decimal" value="'+attr(moneyEdit(p.Price_per_Ft||""))+'" placeholder="$0.00"'
          +' onchange="prSave(\''+p.ID+'\',this.value,this)"'
          +' onfocus="this.value=moneyRaw(this.value);this.select()"'
          +' onblur="this.value=moneyEdit(this.value)"'
          +' onkeydown="if(event.key===\'Enter\')this.blur()"/>'
        :'<span class="pr-ro">'+money(p.Price_per_Ft)+'</span>')+'</div>'
      +'<div>'+(may
        ?'<input class="pr-in" type="number" step="0.01" min="0" value="'+attr(p.Escalator==null||p.Escalator===""?"":String(num(p.Escalator)))+'"'
          +' placeholder="\u2014" onchange="prSaveEsc(\''+p.ID+'\',this.value,this)" onkeydown="if(event.key===\'Enter\')this.blur()"/>'
        :'<span class="pr-ro">'+(p.Escalator==null||p.Escalator===""?"\u2014":num(p.Escalator)+"%")+'</span>')+'</div>'
      +'<div class="pr-base">'+money(p.Base_Price)+'</div>'
      +(may?'<button class="pr-del" title="Remove this lot size" onclick="prDelete(\''+p.ID+'\',\''+cid+'\')">\u00d7</button>':'<span></span>')
      +'</div>';
  }).join("");
  return '<div class="side-card"><div class="dark-head"><div><div class="dark-kicker">Lot Pricing</div><div class="dark-title">Price per Size</div></div>'
    +'<div class="dark-badge"><strong>'+rows.length+'</strong><span>Size'+(rows.length===1?"":"s")+'</span></div></div>'
    +(hasLotsPricingAccess(cid)?'<div class="pr-editbar"><button class="btn sm"'+(mayChangeLotsPricing(cid)&&!contractInteractionHeld()?'':' disabled')+' onclick="clpOpen(\''+cid+'\')">Change Lots &amp; Pricing</button></div>':'')
    +'<div class="pr-body">'
    +(rows.length
      ?'<div class="pr-head"><span>Size</span><span>Price / ft</span><span>Esc %</span><span>Base price</span><span></span></div>'+items
        +'<div class="pr-total"><span>Total base price</span><b>'+money(total)+'</b></div>'
      :'<div class="attach-empty">No pricing rows yet.</div>')
    +(may?'<div class="pr-add">'
      +'<input class="pr-in" id="prNewSize" type="number" min="0" step="1" placeholder="Size (ft)"/>'
      +'<input class="pr-in" id="prNewPpf" type="text" inputmode="decimal" placeholder="Price / ft"'
      +' onfocus="this.value=moneyRaw(this.value);this.select()" onblur="this.value=moneyEdit(this.value)"/>'
      +'<input class="pr-in" id="prNewEsc" type="number" min="0" step="0.01" placeholder="Esc %"/>'
      +'<button class="btn sm" onclick="prAdd(\''+cid+'\')">+ Add</button></div>':'')
    +'</div></div>';
}
function prSave(pid,val,el){return contractPricingSave(pid,'Price_per_Ft',val,el);}
function prSaveEsc(pid,val,el){return contractPricingSave(pid,'Escalator',val,el);}
function prAdd(cid){

function ensureCurrentUpdates(cid,updates,already){
  var all=actionsFor(cid);
  var hasCurrent=all.some(function(a){
    var pend=(already||{})[String(a.ID)];
    var complete=pend&&"Complete" in pend?pend.Complete:truthy(a.Complete);
    var current=pend&&"Current_Action" in pend?pend.Current_Action:truthy(a.Current_Action);
    return !complete&&current;
  });
  if(!hasCurrent){
    for(var i=0;i<all.length;i++){
      var a=all[i], pend=(already||{})[String(a.ID)];
      var complete=pend&&"Complete" in pend?pend.Complete:truthy(a.Complete);
      if(!complete){ updates.push([String(a.ID),{Current_Action:true}]); break; }
    }
  }
}

/* reorder: arrows swap with visible neighbour; drag reinserts */
/* Move one row up/down. Renumbering the whole list beats swapping two values:
   a swap is a no-op when both rows have a blank or duplicated Sort_Order. */
function moveAction(id,dir){
  if(S.busy) return;
  if(!needsContractEdit(lookupId((findAction(id)||{}).Contract1))) return;
  var a=findAction(id); if(!a) return;
  var order=actionsFor(lookupId(a.Contract1)).map(function(r){ return String(r.ID); });
  var from=order.indexOf(String(id));
  var to=from+dir;
  if(from<0||to<0||to>=order.length) return;
  order.splice(to,0,order.splice(from,1)[0]);
  applyOrder(order,String(id));
}
var dragId=null;
function wireDrag(){
  var list=$("alist"); if(!list) return;
  list.querySelectorAll("[data-drag]").forEach(function(h){
    h.addEventListener("dragstart",function(e){
      dragId=h.getAttribute("data-drag");
      var row=h.closest(".arow"); if(row) row.classList.add("dragging");
      e.dataTransfer.effectAllowed="move";
      try{ e.dataTransfer.setData("text/plain",dragId); }catch(err){}
    });
    h.addEventListener("dragend",function(){
      dragId=null;
      list.querySelectorAll(".arow").forEach(function(r){ r.classList.remove("dragging","dragover"); });
    });
  });
  list.querySelectorAll(".arow[data-row]").forEach(function(row){
    row.addEventListener("dragover",function(e){
      if(!dragId||row.getAttribute("data-row")===dragId) return;
      e.preventDefault(); e.dataTransfer.dropEffect="move";
      row.classList.add("dragover");
    });
    row.addEventListener("dragleave",function(){ row.classList.remove("dragover"); });
    row.addEventListener("drop",function(e){
      e.preventDefault(); row.classList.remove("dragover");
      var r=row.getBoundingClientRect();
      var after=(e.clientY-r.top)>r.height/2;
      var targetId=row.getAttribute("data-row");
      if(!dragId||targetId===dragId) return;
      dropReorder(dragId,targetId,after);
      dragId=null;
    });
  });
}
function dropReorder(movedId,beforeId,after){
  if(S.busy) return;
  /* the drag already moved the row in the DOM - repaint to snap it back */
  if(!needsContractEdit(lookupId((findAction(movedId)||{}).Contract1))){ renderAll(); return; }
  var a=findAction(movedId); if(!a) return;
  var cid=lookupId(a.Contract1);
  var all=actionsFor(cid);
  var order=all.map(function(r){ return String(r.ID); });
  var from=order.indexOf(String(movedId)), to=order.indexOf(String(beforeId));
  if(from<0||to<0) return;
  order.splice(from,1);
  var at=order.indexOf(String(beforeId));
  if(at<0) return;
  /* dropping on the lower half of a row inserts AFTER it - without this the last
     position is unreachable, because every drop landed before its target. */
  order.splice(after?at+1:at,0,String(movedId));
  applyOrder(order,String(movedId));
}

/* ---------- reorder feedback: FLIP the rows, then flash the one that moved ---------- */
var PENDING_FLIP=null;
function flipCapture(){
  var m={};
  document.querySelectorAll(".dact-wrap[data-drow],.arow[data-row],.ma-wrap[data-mkey]").forEach(function(el){
    var id=el.getAttribute("data-drow")||el.getAttribute("data-row")||el.getAttribute("data-mkey");
    m[id]=el.getBoundingClientRect().top;
  });
  return m;
}
function flipPlay(prev,movedId,flashClass){
  document.querySelectorAll(".dact-wrap[data-drow],.arow[data-row],.ma-wrap[data-mkey]").forEach(function(el){
    var id=el.getAttribute("data-drow")||el.getAttribute("data-row")||el.getAttribute("data-mkey");
    var before=prev[id];
    if(before==null) return;
    var dy=before-el.getBoundingClientRect().top;
    if(!dy) return;
    el.style.transition="none";
    el.style.transform="translateY("+dy+"px)";
    /* next frame: release to the new position */
    requestAnimationFrame(function(){
      el.style.transition="transform .3s cubic-bezier(.22,1,.36,1)";
      el.style.transform="";
      setTimeout(function(){ el.style.transition=""; el.style.transform=""; },340);
    });
  });
  if(movedId){
    var t=document.querySelector('.dact-wrap[data-drow="'+movedId+'"]')
      ||document.querySelector('.ma-wrap[data-mkey="'+movedId+'"]');
    if(t){
      var cls=flashClass||"justmoved";
      t.classList.add(cls);
      setTimeout(function(){ t.classList.remove(cls); },1200);
    }
  }
}
function queueFlip(movedId,flashClass){
  PENDING_FLIP={prev:flipCapture(),moved:movedId||null,cls:flashClass||"justmoved"};
}
var SCROLL_SELECTORS=[".tscroll",".detailwrap",".loi-review-page",".boardwrap",".workarea"];
function viewKey(){
  /* detailTab must be in the key: renderAll restores the previous scrollTop
     whenever viewKey is unchanged, so without it a tab switch reads as "same
     view" and the new panel opens at the old one's scroll offset. */
  return [S.view,S.homeSection,String(S.selId||""),String(S.loiSelId||""),S.mode,S.actionsMode,S.detailTab].join("|");
}
var LAST_VIEW_KEY=null;
function captureScroll(){
  var out={view:0,inner:{}};
  var v=$("view"); if(v) out.view=v.scrollTop;
  SCROLL_SELECTORS.forEach(function(sel){
    var el=document.querySelector(sel);
    if(el && el.scrollTop) out.inner[sel]=el.scrollTop;
  });

}
function restoreScroll(st){
  var v=$("view");
  if(v && st.view) v.scrollTop=st.view;
  Object.keys(st.inner).forEach(function(sel){
    var el=document.querySelector(sel);
    if(el) el.scrollTop=st.inner[sel];
  });

/* Re-rendering replaces #view, which would reset every scroll container.
   Keep the scroll position whenever we stay on the same screen; only a real
   navigation (different record, section, or list/board mode) starts at the top. */
function renderAll(){
  var key=viewKey();
  var same=(key===LAST_VIEW_KEY);
  var st=same?captureScroll():null;
  renderView();
  var backfill=$("contract_backfill_banner");
  if(!backfill){ backfill=document.createElement("div"); backfill.id="contract_backfill_banner"; document.body.insertBefore(backfill,document.body.firstChild); }
  backfill.innerHTML=contractBackfillBanner();
  LAST_VIEW_KEY=key;

  }
  if(PENDING_FLIP){
    var f=PENDING_FLIP; PENDING_FLIP=null;
    flipPlay(f.prev,f.moved,f.cls);
  }
}
