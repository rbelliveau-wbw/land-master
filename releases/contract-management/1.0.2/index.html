<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Land Master Contracts</title>
<script src="https://static.zohocdn.com/creator/widgets/version/1.0/widgetsdk-min.js"></script>
<script src="critical-error-reporter.js"></script>
<style>
/* â”€â”€ TOKENS â”€â”€ aligned with Pro Forma Manager / Land Master v7 â”€â”€ */
:root{
  --bg:#f0f3f7; --surface:#e8ecf1; --card:#fff;
  --line:#dde4ef; --line-strong:#c8d4e5;
  --text:#0f2744; --muted:#5c7394; --faint:#8ea0bd;
  --navy:#0b2345; --navy-soft:rgba(11,35,69,.08);
  --primary:#1e40af; --primary-2:#2563eb; --ptint:#eef4ff; --psoft:#e8f0fb;
  --green:#047857; --green-bg:#ecfdf5;
  --amber:#b45309; --amber-bg:#fffbeb;
  --red:#b91c1c; --red-bg:#fef2f2;
  --violet:#3730a3; --violet-bg:#e0e7ff;
  --r:10px; --rsm:6px;
  --shadow:0 2px 8px rgba(30,64,175,.06),0 1px 2px rgba(0,0,0,.03);
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;overflow:hidden}
body{display:flex;flex-direction:column;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:13px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit}
:focus-visible{outline:2px solid var(--primary-2);outline-offset:1px}
::selection{background:#dbeafe}
*{scrollbar-width:thin;scrollbar-color:#c5d0df transparent}
*::-webkit-scrollbar{width:9px;height:9px}
*::-webkit-scrollbar-thumb{background:#c5d0df;border:2px solid transparent;background-clip:padding-box;border-radius:99px}
*::-webkit-scrollbar-track{background:transparent}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* â”€â”€ TOPBAR â”€â”€ */
.topbar{display:flex;align-items:center;gap:0;height:48px;padding:0 18px;background:var(--card);border-bottom:1px solid var(--line);flex:none}
.topbar-brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:14px;letter-spacing:-.2px;color:var(--navy);margin-right:16px;flex:none}
.topbar-brand svg{width:16px;height:16px;color:var(--primary)}
.crumb{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--muted);min-width:0;overflow:hidden}
.crumb a{color:var(--muted);text-decoration:none;cursor:pointer;font-weight:600}
.crumb a:hover{color:var(--primary)}
.crumb strong{color:var(--text);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumb .sep{color:#afc0d5}
.spacer{flex:1}
.statusline{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;color:var(--muted);white-space:nowrap}
.statusline .dot{width:7px;height:7px;border-radius:50%;background:var(--green)}
.statusline .dot.warn{background:var(--amber)}
.statusline .dot.err{background:var(--red)}

/* â”€â”€ BUTTONS / INPUTS â”€â”€ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line-strong);background:#fff;color:var(--text);
  font-size:12px;font-weight:700;padding:7px 14px;border-radius:8px;cursor:pointer;transition:all .12s;white-space:nowrap}
.btn:hover{border-color:var(--primary-2);color:var(--primary)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--primary-2);border-color:var(--primary-2);color:#fff}
.btn.primary:hover{background:var(--primary);color:#fff}
.btn.green{background:var(--green);border-color:var(--green);color:#fff}
.btn.green:hover{background:#065f46;color:#fff}
.btn.orange{background:var(--amber);border-color:var(--amber);color:#fff}
.btn.orange:hover{background:#92400e;color:#fff}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--primary)}
.btn.sm{padding:4px 10px;font-size:11px}
.btn:disabled{opacity:.5;pointer-events:none}
.input{height:31px;border:1px solid transparent;border-radius:7px;background:#eef2f8;color:var(--text);font-size:12.5px;padding:0 9px;outline:none;font-variant-numeric:tabular-nums;transition:background .12s,border-color .12s,box-shadow .12s;width:100%}
.input:hover:not(:focus){background:#e6edf7}
.input:focus{background:#fff;border-color:var(--primary-2);box-shadow:0 0 0 3px rgba(37,99,235,.12)}
.input::placeholder{color:var(--faint)}
select.input{cursor:pointer}
textarea.input{height:auto;min-height:56px;padding:7px 9px;resize:vertical;line-height:1.45}
.fl{font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:#7d90ad;font-weight:800;margin-bottom:4px;display:block;white-space:nowrap}

/* â”€â”€ FILTER ROW â”€â”€ */
.filterrow{display:flex;align-items:center;gap:10px;padding:14px 18px 12px;flex:none;flex-wrap:wrap}
.filterrow h1{font-size:18px;font-weight:800;letter-spacing:-.3px;margin:0;color:var(--navy)}
.scope-count{display:inline-grid;place-items:center;min-width:22px;height:20px;padding:0 7px;font-size:10.5px;font-weight:800;border-radius:999px;background:var(--psoft);color:var(--primary)}
.searchbox{display:flex;align-items:center;gap:9px;flex:0 1 420px;min-width:250px;background:#fff;border:1px solid #8fb2f3;border-radius:10px;padding:7px 11px;box-shadow:0 3px 12px rgba(37,99,235,.12),0 0 0 3px rgba(37,99,235,.04);transition:all .12s}
.searchbox:focus-within{border-color:var(--primary-2);box-shadow:0 0 0 4px rgba(37,99,235,.14),0 6px 18px rgba(37,99,235,.15);transform:translateY(-1px)}
.searchbox .search-icon{display:grid;place-items:center;width:24px;height:24px;border-radius:7px;background:var(--primary-2);color:#fff;flex:none;box-shadow:0 2px 5px rgba(37,99,235,.25)}
.searchbox svg{width:13px;height:13px}
.searchbox input{border:0;outline:0;font-size:13px;font-weight:650;flex:1;min-width:0;background:transparent;color:var(--text)}
.searchbox input::placeholder{color:#7c8faa;font-weight:550}
.chiprow{display:flex;gap:5px;flex-wrap:wrap}
.chip-f{border:1px solid var(--line-strong);background:#fff;color:var(--muted);border-radius:999px;height:28px;padding:0 12px;font-size:11px;font-weight:750;cursor:pointer;transition:all .12s;white-space:nowrap}
.chip-f:hover{border-color:var(--primary-2);color:var(--primary)}
.chip-f.active{background:var(--navy);border-color:var(--navy);color:#fff}
select.filter{border:1px solid transparent;border-radius:8px;background:#eef2f8;font-size:12px;font-weight:600;color:var(--text);padding:6px 9px;cursor:pointer;height:30px}
select.filter:hover{background:#e6edf7}
select.filter:focus{background:#fff;border-color:var(--primary-2);outline:0;box-shadow:0 0 0 3px rgba(37,99,235,.12)}
.seg{display:flex;align-items:center;gap:3px;background:#eef2f8;border:1px solid #dde5f0;border-radius:999px;padding:3px}
.seg button{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 14px;border:0;background:transparent;color:#5a6b85;border-radius:999px;font-size:11.5px;font-weight:750;cursor:pointer;transition:all .13s;white-space:nowrap}
.seg button:hover{color:var(--navy);background:rgba(255,255,255,.65)}
.seg button.active{color:#fff;background:var(--navy);box-shadow:0 1px 3px rgba(11,31,58,.25)}

/* â”€â”€ WORKAREA / TABLE â”€â”€ */
.workarea{flex:1;min-height:0;padding:0 18px 18px;display:flex;flex-direction:column}
.tablecard{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden;background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.tscroll{flex:1;overflow:auto;min-height:0}
.wtable{width:100%;border-collapse:collapse;font-size:12.5px}
.wtable th{position:sticky;top:0;z-index:2;background:#f6f8fc;text-align:left;font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;user-select:none;cursor:pointer}
.wtable th:hover,.wtable th.sorted{color:var(--primary)}
.wtable td{padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:250px;vertical-align:middle}
.wtable tbody tr{cursor:pointer;transition:background .1s}
.wtable tbody tr:hover{background:var(--ptint)}
.cname{font-weight:750;color:var(--primary)}
.subtle{color:var(--muted)}
.progress-cell{display:flex;align-items:center;gap:8px;min-width:120px}
.progress{flex:1;height:6px;background:#e3e9f2;border-radius:99px;overflow:hidden;min-width:56px}
.progress i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--green),#34d399)}
.progress-n{font-size:10.5px;font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums}
.tag{display:inline-flex;align-items:center;padding:2px 9px;border-radius:999px;font-size:10.5px;font-weight:800;letter-spacing:.02em;white-space:nowrap}
.empty{padding:44px 20px;text-align:center;color:var(--muted);font-weight:600}
.empty b{display:block;font-size:14px;color:var(--navy);margin-bottom:5px}
.err-banner{border:1px solid #fecaca;color:var(--red);background:var(--red-bg);border-radius:8px;padding:8px 12px;margin:0 18px 10px;font-size:11.5px;font-weight:650;display:flex;gap:8px;align-items:center}
.err-banner button{margin-left:auto;border:0;background:none;color:var(--red);font-size:16px;cursor:pointer;line-height:1}
.ok-banner{border:1px solid #a7f3d0;color:var(--green);background:var(--green-bg);border-radius:8px;padding:8px 12px;margin:0 18px 10px;font-size:11.5px;font-weight:650}

/* â”€â”€ BOARD â”€â”€ */
.boardwrap{flex:1;min-height:0;overflow:auto;display:flex;gap:12px;align-items:flex-start;padding-bottom:6px}
.bcol{flex:0 0 264px;background:#e9edf3;border-radius:10px;padding:9px;display:flex;flex-direction:column;gap:8px;max-height:100%}
.bcol-head{display:flex;align-items:center;gap:7px;font-size:10.5px;font-weight:850;letter-spacing:.05em;color:var(--navy);text-transform:uppercase;padding:2px 3px}
.bcol-head .bar{width:3px;height:13px;border-radius:2px;flex:none}
.bcol-head .n{margin-left:auto;color:var(--faint);font-weight:800}
.bcol-cards{display:flex;flex-direction:column;gap:8px;overflow:auto;min-height:14px}
.bcard{background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px 11px;cursor:pointer;transition:all .12s;display:flex;flex-direction:column;gap:5px}
.bcard:hover{border-color:var(--primary-2);box-shadow:0 3px 10px rgba(37,99,235,.12);transform:translateY(-1px)}
.bcard-name{font-size:12.5px;font-weight:750;color:var(--navy);line-height:1.3}
.bcard-action{font-size:11px;color:var(--muted);line-height:1.4;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.bcard-foot{display:flex;align-items:center;justify-content:space-between;gap:6px;padding-top:2px}
.bcard-builder{font-size:10.5px;color:var(--faint);font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bcard-type{font-size:10px;font-weight:800;color:var(--primary);flex:none}

/* â”€â”€ DETAIL â”€â”€ */
.detailwrap{flex:1;min-height:0;overflow:auto;padding:0 18px 18px}
.info-strip{display:flex;align-items:stretch;background:#fff;border:1px solid var(--line);border-radius:var(--r);margin-bottom:14px;overflow:hidden;box-shadow:var(--shadow);flex-wrap:wrap}
.info-name-block{background:linear-gradient(145deg,#0b2345,#173d72);padding:13px 20px;display:flex;flex-direction:column;justify-content:center;min-width:260px;flex:1.4}
.info-kicker{font-size:9.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#bfdbfe;margin-bottom:3px}
.info-name{font-size:17px;font-weight:800;letter-spacing:-.02em;line-height:1.2;color:#fff}
.info-field{padding:11px 16px;border-left:1px solid var(--line);display:flex;flex-direction:column;justify-content:center;min-width:110px}
.info-lbl{font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.13em;color:var(--faint);margin-bottom:3px}
.info-val{font-size:12.5px;font-weight:700;color:var(--text);line-height:1.3}
.dgrid{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:14px;align-items:start}
@media(max-width:1050px){.dgrid{grid-template-columns:1fr}}

/* actions card */
.acard-shell{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.ac-head{padding:14px 16px 12px;border-bottom:1px solid #eef2f8;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.ac-title{font-size:15px;font-weight:800;color:var(--navy);margin:0}
.ac-sub{font-size:11px;color:var(--faint);margin-top:1px}
.toggle-btn{border:0;background:transparent;display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:10.5px;font-weight:750;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;padding:0;transition:color .12s}
.toggle-btn:hover{color:var(--navy)}
.toggle-track{width:32px;height:17px;border-radius:999px;background:#dde4ef;position:relative;transition:background .18s;flex:none}
.toggle-knob{position:absolute;width:11px;height:11px;top:3px;left:3px;background:#fff;border-radius:50%;box-shadow:0 1px 3px rgba(0,0,0,.18);transition:left .18s}
.toggle-btn.on .toggle-track{background:var(--green)}
.toggle-btn.on .toggle-knob{left:18px}
.alist{padding:10px;display:flex;flex-direction:column;gap:7px;background:#f4f7fb}

/* action row */
.arow{border:2px solid var(--line);border-radius:11px;background:#fff;overflow:hidden;position:relative;transition:border-color .15s,box-shadow .15s,opacity .15s}
.arow::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:#cbd5e1;z-index:1}
.arow.current{border-color:#93c5fd;box-shadow:0 3px 14px rgba(30,64,175,.10)}
.arow.current::before{background:var(--primary)}
.arow.done{border-color:#a7f3d0}
.arow.done::before{background:#34d399}
.arow.overdue{border-color:#fca5a5}
.arow.overdue::before{background:#ef4444}
.arow.dragging{opacity:.35}
.arow.dragover{box-shadow:0 -3px 0 0 var(--primary-2)}
.arow-head{display:flex;align-items:center;min-height:56px;cursor:pointer;transition:background .12s;gap:0}
.arow-head:hover{background:#f8fafc}
.arow.open .arow-head{border-bottom:1px solid #eef2f8;background:#f8fafc}
.drag-cell{align-self:stretch;display:flex;align-items:center;padding:0 4px 0 10px;color:#c3cdda;cursor:grab;font-size:13px;user-select:none}
.drag-cell:hover{color:var(--primary-2)}
.num-cell{align-self:stretch;display:flex;align-items:center;justify-content:center;padding:0 10px 0 6px}
.num-badge{width:25px;height:25px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:800;background:#eef2f8;color:#64748b;border:1.5px solid #e2e8f4;flex:none}
.arow.current .num-badge{background:#dbeafe;color:var(--primary);border-color:#93c5fd}
.arow.overdue .num-badge{background:#fee2e2;color:#dc2626;border-color:#fca5a5}
.arow.done .num-badge{background:#d1fae5;color:var(--green);border-color:#6ee7b7}
.arow-main{flex:1;min-width:0;padding:9px 10px 9px 0}
